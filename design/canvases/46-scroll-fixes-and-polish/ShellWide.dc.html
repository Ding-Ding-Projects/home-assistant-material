.in{animation:rise .35s cubic-bezier(.2,0,0,1) both}

.up{animation:up .32s cubic-bezier(.2,0,0,1) both}
.spin{animation:spin 1s linear infinite}

@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
.lin{height:4px;border-radius:2px;background:var(--sl4);overflow:hidden}

</div>
</div>
<div class="ring" aria-hidden="true"></div>
</div>
</div>
</div>

<div class="win" dir="{{dir}}">
<div class="wtitle"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>To-do lists · the page area of a wide window{{dirNote}}</span><sc-if value="{{isOld}}" hint-placeholder-val="{{ false }}"><span class="tag td">Today</span></sc-if></div>
<div class="tp">

<div class="{{tptCls}}"><h1>To-do lists</h1><button class="ib" aria-label="Add a list"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"></path></svg></button></div>

</header>
<div class="tpb">

<button class="lrow"><svg class="ic s" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5.69L17 10.19V18H15V12H9V18H7V10.19L12 5.69M12 3L2 12H5V20H11V14H13V20H19V12H22"></path></svg>House jobs<span class="cnt">3</span></button>
<button class="lrow"><svg class="ic s" aria-hidden="true" viewBox="0 0 24 24"><path d="M2,22V20C2,20 7,18 12,18C17,18 22,20 22,20V22H2M11.3,9.1C10.1,5.2 4,6.1 4,6.1C4,6.1 4.2,13.9 9.9,12.7C9.5,9.8 8,9 8,9C10.8,9 11,12.4 11,12.4V17C11.3,17 11.7,17 12,17C12.3,17 12.7,17 13,17V12.8C13,12.8 13,8.9 16,7.9C16,7.9 14,10.9 14,12.9C21,13.6 21,4 21,4C21,4 12.1,3 11.3,9.1Z"></path></svg>Grow shelf<span class="cnt">2</span></button>

</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#98CBFF","options":["#98CBFF","#9BD6A4","#F2C744","#D4BEE6"]},"motion":{"editor":"boolean","default":true},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"stage":{"editor":"enum","default":"after","options":["after","rtl","before","rtl-before"]},"$preview":{"width":1280,"height":860}}'>
const WHIST = [["Front door","Closed",[["sl4",30],["amber",4],["sl4",38],["amber",3],["sl4",25]]],["Thermostat","Heat",[["sl4",22],["p",20],["sl4",30],["p",28]]],["Kitchen counter light","On",[["sl4",26],["p",6],["sl4",40],["p",28]]],["Porch motion","Clear",[["sl4",18],["amber",2],["sl4",30],["amber",2],["sl4",20],["amber",3],["sl4",25]]],["Garage door","Closed",[["sl4",50],["amber",5],["sl4",45]]],["Washer","Idle",[["sl4",60],["p",14],["sl4",26]]]];
const TODO = [["Oat milk",0],["Filter for the kitchen tap",0],["AA batteries for the hallway sensor",0],["Coffee beans",1],["Dish soap",0],["Light bulb for the porch",0],["Rice",1]];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 0 }; this._p = null; this._s = 'after'; this.done = {}; }

  base() {
    const accent = this.props.accent ?? '#98CBFF';
    const motion = this.props.motion ?? true;
    const theme = this.props.theme ?? 'dark';
    return { accent, shell: 'm3' + (theme === 'dark' ? ' dark' : '') + (motion ? '' : ' still') };
  }
  bump() { this.setState({ n: this.state.n + 1 }); }
  stage() {
    const p = this.props.stage ?? 'after';
    if (p !== this._p) { this._p = p; this._s = p; this.reset(p); }
    return this._s;
  }
  go(s) { this._s = s; this.reset(s); this.bump(); }

  reset(s) { const d = {}; TODO.forEach((t) => { if (t[1]) d[t[0]] = 1; }); this.done = d; }
  renderVals() {
    const v = this.base();
    const s = this.stage();
    const old = s === 'before' || s === 'rtl-before';
    const rtl = s.indexOf('rtl') === 0;
    const open = TODO.filter((t) => !this.done[t[0]]).length;
    return Object.assign(v, {
      isOld: old,
      dir: rtl ? 'rtl' : 'ltr',
      dirNote: rtl ? ' \u00b7 right-to-left layout, labels left in English' : '',
      railCls: 'rail ' + (old ? 'old' : 'fix'),
      pageCls: 'page ' + (old ? 'old' : 'fix'),
      tptCls: 'tpt ' + (old ? 'old' : 'fix'),
      tppCls: 'tpp ' + (old ? 'old' : 'fix'),
      todoText: open + ' open, ' + (TODO.length - open) + ' done',
      openCount: String(open),
      hist: WHIST.map((h) => {
        const total = h[2].reduce((a, g) => a + g[1], 0);
        let at = 0;
        const stops = h[2].map((g) => { const from = at; at += (g[1] / total) * 100; return 'var(--' + g[0] + ') ' + from.toFixed(1) + '% ' + at.toFixed(1) + '%'; });
        return { name: h[0], value: h[1], label: 'More for ' + h[0], grad: 'background: linear-gradient(90deg, ' + stops.join(', ') + ')' };
      }),
      todos: TODO.map((t) => {
        const on = !!this.done[t[0]];
        return {
          name: t[0], cls: on ? 'trow done' : 'trow', aria: on ? 'true' : 'false', box: on ? 'box on' : 'box',
          toggle: () => { const d = Object.assign({}, this.done); if (on) delete d[t[0]]; else d[t[0]] = 1; this.done = d; this.bump(); }
        };
      })
    });
  }
}
</script>
