<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Media browser on a wide window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m3{--ac:#98CBFF;--s:#51606F;--sc:#D5E4F6;--on-sc:#3A4857;--err:#BA1A1A;--errc:#FFDAD6;--on-errc:#93000A;--surf:#EEF1F6;--sl0:#FFFFFF;--sl1:#F7F9FD;--sl2:#F1F4F9;--sl3:#E9EDF3;--sl4:#E1E5EC;--on:#181C20;--onv:#42474E;--out:#72777F;--outv:#C2C7CF;--inv:#2D3135;--on-inv:#EFF1F6;--amber:#6B5200;--amberc:#FFE08B;--green:#1F6A3B;--greenc:#B6F2BE;--scrim:rgba(24,28,32,.42);--e3:0 4px 8px 3px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.2);--p:color-mix(in srgb,var(--ac) 55%,#00131f);--on-p:#FFFFFF;--pc:color-mix(in srgb,var(--ac) 34%,#FFFFFF);--on-pc:color-mix(in srgb,var(--ac) 30%,#000000);font-family:Roboto,system-ui,sans-serif;color:var(--on);background:var(--surf);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.m3.dark{--s:#B9C8DA;--sc:#3A4857;--on-sc:#D5E4F6;--err:#FFB4AB;--errc:#93000A;--on-errc:#FFDAD6;--surf:#0B0F13;--sl0:#14181D;--sl1:#191D22;--sl2:#1D2126;--sl3:#272B31;--sl4:#32363C;--on:#E0E2E8;--onv:#C2C7CF;--out:#8C9199;--outv:#42474E;--inv:#E0E2E8;--on-inv:#2D3135;--amber:#F2C744;--amberc:#514000;--green:#9BD6A4;--greenc:#005227;--scrim:rgba(0,0,0,.62);--e3:0 6px 16px rgba(0,0,0,.6);--p:var(--ac);--on-p:#071019;--pc:color-mix(in srgb,var(--ac) 30%,#12161A);--on-pc:color-mix(in srgb,var(--ac) 30%,#FFFFFF)}
.m3 *{box-sizing:border-box}
.m3 button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
.m3 input{font:inherit;color:inherit}
.m3 h1,.m3 h2,.m3 p{margin:0}
.m3 :focus-visible{outline:2px solid var(--p);outline-offset:2px}
.ic{width:24px;height:24px;fill:currentColor;flex:none;display:block}
.ic.s{width:20px;height:20px}
.ic.l{width:40px;height:40px}
.tl{font-size:22px;line-height:28px;font-weight:500}
.tm{font-size:16px;line-height:24px;font-weight:500}
.bl{font-size:16px;line-height:24px}
.sub{font-size:13px;line-height:18px;color:var(--onv)}
.lm{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.4px;color:var(--onv)}
.mono{font-family:'Roboto Mono',ui-monospace,Menlo,monospace}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:8px}
.ib{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;color:var(--onv);flex:none;transition:background-color .2s}
.ib:hover{background:var(--sl3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:24px;font-size:14px;font-weight:600;white-space:nowrap;transition:filter .2s,transform .2s cubic-bezier(.2,0,0,1)}
.m3 .btn.fill{background:var(--p);color:var(--on-p)}
.m3 .btn.tonal{background:var(--sc);color:var(--on-sc)}
.m3 .btn.text{color:var(--p);padding:0 14px}
.m3 .btn.off{background:var(--sl4);color:var(--out);cursor:not-allowed}
.btn:hover{filter:brightness(1.07)}
.m3 .chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--outv);color:var(--onv);font-size:14px;font-weight:600;white-space:nowrap;flex:none;position:relative}
.m3 .chip::after{content:"";position:absolute;inset:-6px 0}
.m3 .chip.sel{background:var(--sc);box-shadow:none;color:var(--on-sc)}
.lead{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--sc);color:var(--on-sc);flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 10px;border-radius:12px;background:var(--sl3);color:var(--onv);font-size:12px;line-height:16px;font-weight:600}
.tag.p{background:var(--pc);color:var(--on-pc)}
.tag.g{background:var(--greenc);color:var(--green)}
.tag.e{background:var(--errc);color:var(--on-errc)}
.note{display:flex;gap:12px;padding:12px 14px;border-radius:16px;background:var(--sl2);color:var(--onv);font-size:13px;line-height:18px}
.note.bad{background:var(--errc);color:var(--on-errc)}
.field{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 8px 6px 16px;border-radius:16px;background:var(--sl2);box-shadow:inset 0 -2px 0 var(--out);width:100%}
.field.bad{box-shadow:inset 0 -3px 0 var(--err)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;min-height:44px}
.sk{display:block;border-radius:12px;background:linear-gradient(90deg,var(--sl2) 25%,var(--sl4) 50%,var(--sl2) 75%);background-size:200% 100%;animation:shim 1.4s linear infinite}
.in{animation:rise .35s cubic-bezier(.2,0,0,1) both}
.pop{animation:pop .28s cubic-bezier(.2,0,0,1) both}
.up{animation:up .32s cubic-bezier(.2,0,0,1) both}
.spin{animation:spin 1s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
.lin{height:4px;border-radius:2px;background:var(--sl4);overflow:hidden}
.lin span{display:block;width:36%;height:100%;border-radius:2px;background:var(--p);animation:slide 1.4s cubic-bezier(.4,0,.2,1) infinite}
.ph{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.wd{min-height:var(--wh,860px);position:relative;overflow:hidden;padding:20px clamp(16px,3vw,40px) 32px;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;align-items:center;gap:4px;min-height:64px;padding:8px 8px 8px 4px;flex:none}
.bar h1{flex:1;min-width:0;font-size:22px;line-height:28px;font-weight:500}
.stagebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px 24px;color:var(--onv)}
.stagebox .big{width:72px;height:72px;border-radius:36px;display:grid;place-items:center;background:var(--sl2);color:var(--onv)}
.toast{position:absolute;left:12px;right:12px;bottom:16px;z-index:8;background:var(--inv);color:var(--on-inv);border-radius:16px;padding:10px 6px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--e3)}
.toast .btn.text{color:inherit;text-decoration:underline}
.still *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){.m3 *{animation:none!important;transition:none!important}}
.tdy{display:inline-flex;align-items:center;min-height:24px;padding:2px 12px;border-radius:12px;background:var(--amberc);color:var(--amber);font-size:12px;line-height:16px;font-weight:700;letter-spacing:.4px;flex:none;white-space:nowrap}
.ph{background:var(--surf)}
.frame{height:860px;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--surf);container-type:inline-size}
.abar{display:flex;align-items:center;gap:8px;min-height:64px;padding:8px 12px 8px 4px;flex:none}
.abar h1{flex:1;min-width:0;font-size:22px;line-height:28px;font-weight:500;overflow-wrap:anywhere}
.foot{flex:none;height:40px;display:flex;align-items:center;gap:20px;padding:0 20px;font-size:12px;line-height:16px;color:var(--onv);box-shadow:inset 0 1px 0 var(--outv);white-space:nowrap;overflow:hidden}
.foot span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.navp{position:absolute;left:12px;right:12px;bottom:12px;height:64px;border-radius:32px;background:var(--sl3);box-shadow:var(--e3);display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:6}
.m3 .ni{min-width:64px;min-height:48px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;line-height:14px;font-weight:600;color:var(--onv);padding:0 10px}
.m3 .ni.sel{background:var(--pc);color:var(--on-pc)}
.sw{width:52px;height:32px;border-radius:16px;box-shadow:inset 0 0 0 2px var(--out);background:var(--sl4);display:flex;align-items:center;padding:0 8px;flex:none;transition:background-color .2s;position:relative}
.sw::after{content:"";position:absolute;inset:-8px 0}
.sw i{display:block;width:16px;height:16px;border-radius:12px;background:var(--out);transition:all .2s cubic-bezier(.2,0,0,1)}
.sw.on{box-shadow:none;background:var(--p);justify-content:flex-end;padding:0 4px}
.sw.on i{width:24px;height:24px;background:var(--on-p)}
.demo{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 16px 4px;padding:8px 12px;border-radius:16px;border:1.5px dashed var(--outv);flex:none}
.m3 .tile{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--pc);color:var(--on-pc);flex:none}
.crumb{padding:0 16px 8px;flex:none;overflow-wrap:anywhere}
.m3 .mrow{display:flex;align-items:center;gap:12px;min-height:60px;padding:6px 12px;border-radius:16px;width:100%;transition:background-color .2s}
.m3 .mrow:hover{background:var(--sl2)}
.m3 .mrow.on{background:var(--pc);color:var(--on-pc)}
.m3 .mrow.on .sub{color:inherit;opacity:.85}
.mrow .bl{font-size:15px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art{border-radius:12px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 60%,#3b2a66),color-mix(in srgb,var(--ac) 30%,#0c1b2b));color:#fff}
.m3 .rb{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;flex:none;background:var(--sc);color:var(--on-sc);transition:filter .2s}
.m3 .rb.fill{background:var(--p);color:var(--on-p)}
.rb:hover{filter:brightness(1.08)}
.prog{height:4px;border-radius:2px;background:var(--sl4);overflow:hidden}
.prog b{display:block;height:100%;width:32%;border-radius:2px;background:var(--p)}

.mscroll{flex:1;min-height:0;overflow-y:auto;padding:0 clamp(12px,2vw,24px) 124px}
.mscroll.old{padding-bottom:16px;margin-bottom:60px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-bottom:16px}
.m3 .fcard{background:var(--sl0);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:background-color .2s}
.m3 .fcard:hover{background:var(--sl2)}
.fcard .art{aspect-ratio:1.6;border-radius:14px;width:100%}
.fcard .bl{font-size:14px;line-height:20px;font-weight:500;overflow-wrap:anywhere}
.tlist{background:var(--sl0);border-radius:24px;padding:6px;display:flex;flex-direction:column;gap:2px}
.dk{position:absolute;left:12px;right:12px;bottom:52px;height:88px;border-radius:28px;background:var(--sl2);box-shadow:var(--e3);display:flex;align-items:center;gap:12px;padding:8px 16px 8px 12px;z-index:5}
.dk .art{width:64px;height:64px;border-radius:16px}
.dk .meta{flex:1 1 180px;min-width:0;display:flex;flex-direction:column}
.dk .meta .bl{font-size:16px;line-height:22px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk .meta .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk .mid{flex:2 1 260px;min-width:0;display:flex;align-items:center;gap:10px}
.dk .mid .prog{flex:1}
.dk .mid .sub{font-variant-numeric:tabular-nums;white-space:nowrap}
.band{position:absolute;left:0;right:0;bottom:0;height:100px;background:var(--sl0);box-shadow:inset 0 1px 0 var(--outv);display:flex;align-items:center;z-index:5}
.band .art{width:68px;height:68px;border-radius:0;margin:16px 0 16px 16px}
.band .meta{flex:1;min-width:0;padding-left:16px;white-space:nowrap;overflow:hidden}
.band .meta b{display:block;font-size:17px;line-height:24px;font-weight:400;overflow:hidden;text-overflow:ellipsis}
.band .meta span{display:block;color:var(--onv);overflow:hidden;text-overflow:ellipsis}
.band .mid{flex:2;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.band .mid .pr{display:flex;align-items:center;gap:8px;width:100%;color:var(--onv);font-size:14px}
.band .mid .prog{flex:1;border-radius:0}
.band .end{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:16px}
.band .end span{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@container (max-width: 980px){.dk .plabel{display:none}.band .end span{display:none}}
</style>
</helmet>
<div class="{{shell}}" style="--ac: {{accent}}">
<div class="frame">
<div class="abar">
<button class="ib" aria-label="Open the sidebar"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"></path></svg></button>
<h1>Media</h1>
<sc-if value="{{isBefore}}" hint-placeholder-val="{{ false }}"><span class="tdy">Today</span></sc-if>
<button class="btn tonal" aria-label="Player: Living room speaker. Change player"><svg class="ic s" aria-hidden="true" viewBox="0 0 24 24"><path d="M12,12A3,3 0 0,0 9,15A3,3 0 0,0 12,18A3,3 0 0,0 15,15A3,3 0 0,0 12,12M12,20A5,5 0 0,1 7,15A5,5 0 0,1 12,10A5,5 0 0,1 17,15A5,5 0 0,1 12,20M12,4A2,2 0 0,1 14,6A2,2 0 0,1 12,8C10.89,8 10,7.1 10,6C10,4.89 10.89,4 12,4M17,2H7C5.89,2 5,2.89 5,4V20A2,2 0 0,0 7,22H17A2,2 0 0,0 19,20V4C19,2.89 18.1,2 17,2Z"></path></svg>Living room speaker</button>
</div>
<div class="{{scrollCls}}" tabindex="0" aria-label="Media browser">
<div class="crumb sub" style="padding-left: 4px">Local media, Music</div>
<div class="mgrid">
<sc-for list="{{folders}}" as="f" hint-placeholder-count="6">
<button class="fcard"><span class="art"><svg class="ic l" aria-hidden="true" viewBox="0 0 24 24"><path d="M10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6H12L10,4Z"></path></svg></span><span class="bl">{{f.name}}</span><span class="sub">{{f.meta}}</span></button>
</sc-for>
</div>
<div class="lm" style="padding: 4px 4px 8px">EVENING MIX</div>
<div class="tlist">
<sc-for list="{{tracks}}" as="t" hint-placeholder-count="9">
<button class="{{t.cls}}" aria-label="{{t.label}}" onClick="{{ t.pick }}">
<span class="lead"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12,3V12.26C11.5,12.09 11,12 10.5,12C8,12 6,14 6,16.5C6,19 8,21 10.5,21C13,21 15,19 15,16.5V6H19V3H12Z"></path></svg></span>
<span class="grow"><span class="bl" title="{{t.name}}">{{t.name}}</span><span class="sub" title="{{t.artist}}">{{t.artist}}</span></span>
<span class="sub">{{t.len}}</span>
</button>
</sc-for>
</div>
</div>
<div class="foot"><span>Home Assistant 2026.11</span><span>Frontend build 46</span><span>English</span><span>Unlocked</span><span style="flex: 1; text-align: right">Press M to open the menu</span></div>
<sc-if value="{{isAfter}}" hint-placeholder-val="{{ true }}">
<div class="dk up" role="region" aria-label="Now playing">
<span class="art"><svg class="ic l" aria-hidden="true" viewBox="0 0 24 24"><path d="M12,11A1,1 0 0,0 11,12A1,1 0 0,0 12,13A1,1 0 0,0 13,12A1,1 0 0,0 12,11M12,16.5C9.5,16.5 7.5,14.5 7.5,12C7.5,9.5 9.5,7.5 12,7.5C14.5,7.5 16.5,9.5 16.5,12C16.5,14.5 14.5,16.5 12,16.5M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"></path></svg></span>
<span class="meta"><span class="bl" title="{{title}}">{{title}}</span><span class="sub" title="{{artist}}">{{artist}}</span></span>
<button class="rb" aria-label="Previous track" onClick="{{ back }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z"></path></svg></button>
<button class="rb fill" aria-label="{{playLabel}}" onClick="{{ toggle }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="{{playIcon}}"></path></svg></button>
<button class="rb" aria-label="Next track" onClick="{{ skip }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z"></path></svg></button>
<span class="mid"><span class="sub">1:41</span><span class="prog" role="progressbar" aria-label="Track position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="32"><b></b></span><span class="sub">{{len}}</span></span>
<button class="ib" aria-label="Volume"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.76 16.5,12M3,9V15H7L12,20V4L7,9H3Z"></path></svg></button>
<span class="sub plabel">{{state}}</span>
</div>
</sc-if>
<sc-if value="{{isBefore}}" hint-placeholder-val="{{ false }}">
<div class="band" role="region" aria-label="Now playing">
<span class="art"><svg class="ic l" aria-hidden="true" viewBox="0 0 24 24"><path d="M12,11A1,1 0 0,0 11,12A1,1 0 0,0 12,13A1,1 0 0,0 13,12A1,1 0 0,0 12,11M12,16.5C9.5,16.5 7.5,14.5 7.5,12C7.5,9.5 9.5,7.5 12,7.5C14.5,7.5 16.5,9.5 16.5,12C16.5,14.5 14.5,16.5 12,16.5M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"></path></svg></span>
<div class="meta"><b>{{title}}</b><span>{{artist}}</span></div>
<div class="mid"><div class="hrow" style="gap: 0"><button class="ib" aria-label="Previous track" onClick="{{ back }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z"></path></svg></button><button class="ib" aria-label="{{playLabel}}" onClick="{{ toggle }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="{{playIcon}}"></path></svg></button><button class="ib" aria-label="Next track" onClick="{{ skip }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z"></path></svg></button></div>
<div class="pr"><span>1:41</span><span class="prog"><b></b></span><span>{{len}}</span></div></div>
<div class="end"><button class="ib" aria-label="Volume"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.76 16.5,12M3,9V15H7L12,20V4L7,9H3Z"></path></svg></button><span>Living room speaker</span><button class="ib" aria-label="Choose a player"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12,12A3,3 0 0,0 9,15A3,3 0 0,0 12,18A3,3 0 0,0 15,15A3,3 0 0,0 12,12M12,20A5,5 0 0,1 7,15A5,5 0 0,1 12,10A5,5 0 0,1 17,15A5,5 0 0,1 12,20M12,4A2,2 0 0,1 14,6A2,2 0 0,1 12,8C10.89,8 10,7.1 10,6C10,4.89 10.89,4 12,4M17,2H7C5.89,2 5,2.89 5,4V20A2,2 0 0,0 7,22H17A2,2 0 0,0 19,20V4C19,2.89 18.1,2 17,2Z"></path></svg></button></div>
</div>
</sc-if>
</div>
