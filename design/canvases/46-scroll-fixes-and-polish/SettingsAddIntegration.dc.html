      brands: shown.map((b) => ({ name: b[0], meta: b[1], letter: b[0].charAt(0), pick: () => say('Starts the setup for ' + b[0]) })),
      guided: () => say('Opens the guided setup'),
      hasToast: !!this.toast, toast: this.toast || '', hideToast: () => { this.toast = null; this.bump(); }
    });
  }
}
</script>
</body>
</html>
