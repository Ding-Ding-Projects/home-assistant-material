<div class="{{root}}">
<sc-if value="{{isBefore}}" hint-placeholder-val="{{ false }}"><div class="today" style="top: 60px"><span class="tag e">Today</span><span class="tag">The outlined list is a 240 px scroller inside the scrolling drawer. Dismiss all is below both.</span></div></sc-if>

<div class="nbody" tabindex="0" aria-label="Notifications and running activity">
<sc-if value="{{hasAct}}" hint-placeholder-val="{{ true }}">
<div class="act">
<span class="lm" style="padding: 8px 4px 2px">RUNNING NOW</span>
<sc-for list="{{acts}}" as="a" hint-placeholder-count="7">
<div class="arow"><span class="lead"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="{{a.icon}}"></path></svg></span><span class="grow"><span class="bl">{{a.name}}</span><span class="sub">{{a.meta}}</span><span class="{{a.lin}}" style="--pw: {{a.pw}}"><span></span></span></span></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{hasNotes}}" hint-placeholder-val="{{ true }}">
<p class="sub sum" role="status">{{countText}}</p>
<div class="nlist">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
<div class="ncard">
<span class="tm">{{n.title}}</span>
<span class="bl" style="color: var(--onv); font-size: 14px; line-height: 20px">{{n.text}}</span>
<span class="hrow"><span class="sub" style="flex: 1">{{n.time}}</span><button class="btn text" aria-label="Dismiss {{n.title}}" onClick="{{ n.dismiss }}">Dismiss</button></span>
</div>
</sc-for>
</div>
<sc-if value="{{many}}" hint-placeholder-val="{{ true }}"><div class="nact"><button class="btn tonal" onClick="{{ dismissAll }}"><svg class="ic s" aria-hidden="true" viewBox="0 0 24 24"><path d="M0.41,13.41L6,19L7.41,17.58L1.83,12M22.24,5.58L11.66,16.17L7.5,12L6.07,13.41L11.66,19L23.66,7M18,7L16.59,5.58L10.24,11.93L11.66,13.34L18,7Z"></path></svg>Dismiss all</button></div></sc-if>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<div class="stagebox in"><span class="big"><svg class="ic l" aria-hidden="true" viewBox="0 0 24 24"><path d="M22.11,21.46L2.39,1.73L1.11,3L5.83,7.72C5.29,8.73 5,9.86 5,11V17L3,19V20H18.11L20.84,22.73L22.11,21.46M7,18V11C7,10.39 7.11,9.79 7.34,9.23L16.11,18H7M10,21H14A2,2 0 0,1 12,23A2,2 0 0,1 10,21M8.29,5.09C8.82,4.75 9.4,4.5 10,4.29C10,4.19 10,4.1 10,4A2,2 0 0,1 12,2A2,2 0 0,1 14,4C14,4.1 14,4.19 14,4.29C16.97,5.17 19,7.9 19,11V15.8L17,13.8V11A5,5 0 0,0 12,6C11.22,6 10.45,6.2 9.76,6.56L8.29,5.09Z"></path></svg></span><span class="tm" style="color: var(--on)">No notifications</span><span class="sub">Nothing needs you right now. Anything that is running also shows up here.</span><button class="btn tonal" onClick="{{ restore }}">Show the sample notifications</button></div>
</sc-if>
</div>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast up" role="status"><span style="flex: 1">{{toast}}</span></div></sc-if>
</div>
</div>
