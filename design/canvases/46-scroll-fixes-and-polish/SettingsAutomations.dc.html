<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Automations list: menus and the selection bar, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m3{--ac:#98CBFF;--s:#51606F;--sc:#D5E4F6;--on-sc:#3A4857;--err:#BA1A1A;--errc:#FFDAD6;--on-errc:#93000A;--surf:#EEF1F6;--sl0:#FFFFFF;--sl1:#F7F9FD;--sl2:#F1F4F9;--sl3:#E9EDF3;--sl4:#E1E5EC;--on:#181C20;--onv:#42474E;--out:#72777F;--outv:#C2C7CF;--inv:#2D3135;--on-inv:#EFF1F6;--amber:#6B5200;--amberc:#FFE08B;--green:#1F6A3B;--greenc:#B6F2BE;--scrim:rgba(24,28,32,.42);--e3:0 4px 8px 3px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.2);--p:color-mix(in srgb,var(--ac) 55%,#00131f);--on-p:#FFFFFF;--pc:color-mix(in srgb,var(--ac) 34%,#FFFFFF);--on-pc:color-mix(in srgb,var(--ac) 30%,#000000);font-family:Roboto,system-ui,sans-serif;color:var(--on);background:var(--surf);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.m3.dark{--s:#B9C8DA;--sc:#3A4857;--on-sc:#D5E4F6;--err:#FFB4AB;--errc:#93000A;--on-errc:#FFDAD6;--surf:#0B0F13;--sl0:#14181D;--sl1:#191D22;--sl2:#1D2126;--sl3:#272B31;--sl4:#32363C;--on:#E0E2E8;--onv:#C2C7CF;--out:#8C9199;--outv:#42474E;--inv:#E0E2E8;--on-inv:#2D3135;--amber:#F2C744;--amberc:#514000;--green:#9BD6A4;--greenc:#005227;--scrim:rgba(0,0,0,.62);--e3:0 6px 16px rgba(0,0,0,.6);--p:var(--ac);--on-p:#071019;--pc:color-mix(in srgb,var(--ac) 30%,#12161A);--on-pc:color-mix(in srgb,var(--ac) 30%,#FFFFFF)}
.m3 *{box-sizing:border-box}
.m3 button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
.m3 input{font:inherit;color:inherit}
.m3 h1,.m3 h2,.m3 p{margin:0}
.m3 :focus-visible{outline:2px solid var(--p);outline-offset:2px}
.ic{width:24px;height:24px;fill:currentColor;flex:none;display:block}
.ic.s{width:20px;height:20px}
.ic.l{width:40px;height:40px}
.tl{font-size:22px;line-height:28px;font-weight:500}
.tm{font-size:16px;line-height:24px;font-weight:500}
.bl{font-size:16px;line-height:24px}
.sub{font-size:13px;line-height:18px;color:var(--onv)}
.lm{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.4px;color:var(--onv)}
.mono{font-family:'Roboto Mono',ui-monospace,Menlo,monospace}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:8px}
.ib{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;color:var(--onv);flex:none;transition:background-color .2s}
.ib:hover{background:var(--sl3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:24px;font-size:14px;font-weight:600;white-space:nowrap;transition:filter .2s,transform .2s cubic-bezier(.2,0,0,1)}
.m3 .btn.fill{background:var(--p);color:var(--on-p)}
.m3 .btn.tonal{background:var(--sc);color:var(--on-sc)}
.m3 .btn.text{color:var(--p);padding:0 14px}
.m3 .btn.off{background:var(--sl4);color:var(--out);cursor:not-allowed}
.btn:hover{filter:brightness(1.07)}
.m3 .chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--outv);color:var(--onv);font-size:14px;font-weight:600;white-space:nowrap;flex:none;position:relative}
.m3 .chip::after{content:"";position:absolute;inset:-6px 0}
.m3 .chip.sel{background:var(--sc);box-shadow:none;color:var(--on-sc)}
.lead{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--sc);color:var(--on-sc);flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 10px;border-radius:12px;background:var(--sl3);color:var(--onv);font-size:12px;line-height:16px;font-weight:600}
.tag.p{background:var(--pc);color:var(--on-pc)}
.tag.g{background:var(--greenc);color:var(--green)}
.tag.e{background:var(--errc);color:var(--on-errc)}
.note{display:flex;gap:12px;padding:12px 14px;border-radius:16px;background:var(--sl2);color:var(--onv);font-size:13px;line-height:18px}
.note.bad{background:var(--errc);color:var(--on-errc)}
.field{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 8px 6px 16px;border-radius:16px;background:var(--sl2);box-shadow:inset 0 -2px 0 var(--out);width:100%}
.field.bad{box-shadow:inset 0 -3px 0 var(--err)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;min-height:44px}
.sk{display:block;border-radius:12px;background:linear-gradient(90deg,var(--sl2) 25%,var(--sl4) 50%,var(--sl2) 75%);background-size:200% 100%;animation:shim 1.4s linear infinite}
.in{animation:rise .35s cubic-bezier(.2,0,0,1) both}
.pop{animation:pop .28s cubic-bezier(.2,0,0,1) both}
.up{animation:up .32s cubic-bezier(.2,0,0,1) both}
.spin{animation:spin 1s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
.lin{height:4px;border-radius:2px;background:var(--sl4);overflow:hidden}
.lin span{display:block;width:36%;height:100%;border-radius:2px;background:var(--p);animation:slide 1.4s cubic-bezier(.4,0,.2,1) infinite}
.ph{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.wd{min-height:var(--wh,860px);position:relative;overflow:hidden;padding:20px clamp(16px,3vw,40px) 32px;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;align-items:center;gap:4px;min-height:64px;padding:8px 8px 8px 4px;flex:none}
.bar h1{flex:1;min-width:0;font-size:22px;line-height:28px;font-weight:500}
.stagebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px 24px;color:var(--onv)}
.stagebox .big{width:72px;height:72px;border-radius:36px;display:grid;place-items:center;background:var(--sl2);color:var(--onv)}
.toast{position:absolute;left:12px;right:12px;bottom:16px;z-index:8;background:var(--inv);color:var(--on-inv);border-radius:16px;padding:10px 6px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--e3)}
.toast .btn.text{color:inherit;text-decoration:underline}
.still *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){.m3 *{animation:none!important;transition:none!important}}
.m3 .btn{padding:0 24px}
.m3 .btn.text{padding:0 14px}
.tod{background:var(--amberc);color:var(--amber);flex:none;white-space:nowrap}
.pbar{position:absolute;left:12px;right:12px;bottom:calc(12px + var(--inset,0px));height:64px;border-radius:32px;background:var(--sl3);box-shadow:var(--e3);z-index:7;display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.pbar span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;line-height:14px;font-weight:600;color:var(--onv);min-width:60px}
.pbar span.on{color:var(--on)}
.pbar span.on .ic{background:var(--pc);color:var(--on-pc);border-radius:14px;width:52px;height:28px;padding:2px 14px}
.homei{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:var(--on);opacity:.55;transform:translateX(-50%);z-index:8}
.card{background:var(--sl0);border-radius:20px}
.box{width:20px;height:20px;border-radius:4px;box-shadow:inset 0 0 0 2px var(--out);display:grid;place-items:center;flex:none;transition:background-color .2s}
.box svg{width:16px;height:16px;fill:var(--on-p);opacity:0}
.box.on{background:var(--p);box-shadow:none}
.box.on svg{opacity:1}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--sl2);border-radius:24px;padding:4px;gap:4px}
.m3 .seg button{min-height:40px;padding:0 16px;border-radius:20px;font-size:14px;font-weight:600;color:var(--onv);position:relative;white-space:nowrap}
.m3 .seg button::after{content:"";position:absolute;inset:-4px 0}
.m3 .seg button.sel{background:var(--pc);color:var(--on-pc)}
.wrapany{overflow-wrap:anywhere}
.menu{position:absolute;z-index:6;background:var(--sl3);border-radius:16px;box-shadow:var(--e3);padding:8px 0;display:flex;flex-direction:column;width:max-content;max-width:370px;max-height:430px;overflow-y:auto}
.menu.cap{max-width:179px}
.m3 .mi{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 16px;font-size:16px;line-height:22px;width:100%;flex:none}
.m3 .mi:hover{background:var(--sl4)}
.m3 .mi.danger{color:var(--err)}
.mi span.t{flex:1;min-width:0}
.mhead{padding:6px 16px 4px}
.m3 .catch{position:absolute;inset:0;z-index:5;width:100%;height:100%;cursor:default}

.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 8px;flex:none;scrollbar-width:none}
.sumline{padding:0 16px 8px;flex:none}
.pg{flex:1;min-height:0;overflow-y:auto;padding:0 8px;display:flex;flex-direction:column}
.aw{position:relative;flex:none}
.arow{display:flex;align-items:center;border-radius:16px;min-height:64px}
.arow.on{background:var(--pc);color:var(--on-pc)}
.arow.on .sub{color:inherit;opacity:.85}
.arow.on .ib{color:inherit}
.m3 .amain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 0 8px 8px;min-height:64px;border-radius:16px}
.m3 .bulk{position:absolute;left:12px;right:12px;z-index:4;min-height:56px;border-radius:28px;background:var(--pc);color:var(--on-pc);display:flex;align-items:center;padding:0 4px;box-shadow:var(--e3)}
.bulk .ib{color:inherit}
.m3 .fab{position:absolute;right:16px;bottom:calc(92px + var(--inset));z-index:4;min-height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--pc);color:var(--on-pc);display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;box-shadow:var(--e3)}
</style>
</helmet>
<div class="{{shell}}" style="--ac: {{accent}}">
<div class="ph" style="--inset: 34px">
<div class="bar">
<button class="ib" aria-label="Back to settings"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"></path></svg></button>

</div>
<div class="sumline sub" role="status">{{sumText}}</div>
<div class="pg" style="padding-bottom: {{padBottom}}">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div class="aw">
<div class="{{r.cls}}">
<button class="amain" onClick="{{ r.tap }}" aria-label="{{r.tapLabel}}">
<sc-if value="{{r.selecting}}" hint-placeholder-val="{{ false }}"><span class="{{r.box}}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z"></path></svg></span></sc-if>

</button>

21.41,14.41C21.78,14.05 22,13.55 22,13C22,12.44 21.77,11.94 21.41,11.58Z"></path></svg><span class="t">Assign category</span></button><button class="mi" role="menuitem" onClick="{{ r.m3 }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M8,5.14V19.14L19,12.14L8,5.14Z"></path></svg><span class="t">Run actions</span></button><button class="mi" role="menuitem" onClick="{{ r.m4 }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M15,12C15,10.7 14.16,9.6 13,9.18V6.82C14.16,6.4 15,5.3 15,4A3,3 0 0,0 12,1A3,3 0 0,0 9,4C9,5.3 9.84,6.4 11,6.82V9.19C9.84,9.6 9,10.7 9,12C9,13.3 9.84,14.4 11,14.82V17.18C9.84,17.6 9,18.7 9,20A3,3 0 0,0 12,23A3,3 0 0,0 15,20C15,18.7 14.16,17.6 13,17.18V14.82C14.16,14.4 15,13.3 15,12M12,3A1,1 0 0,1 13,4A1,1 0 0,1 12,5A1,1 0 0,1 11,4A1,1 0 0,1 12,3M12,21A1,1 0 0,1 11,20A1,1 0 0,1 12,19A1,1 0 0,1 13,20A1,1 0 0,1 12,21Z"></path></svg><span class="t">Show trace</span></button><button class="mi" role="menuitem" onClick="{{ r.m5 }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M11,17H4A2,2 0 0,1 2,15V3A2,2 0 0,1 4,1H16V3H4V15H11V13L15,16L11,19V17M19,21V7H8V13H6V7A2,2 0 0,1 8,5H19A2,2 0 0,1 21,7V21A2,2 0 0,1 19,23H8A2,2 0 0,1 6,21V19H8V21H19Z"></path></svg><span class="t">Duplicate</span></button><button class="mi" role="menuitem" onClick="{{ r.m6 }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M17 6H7c-3.31 0-6 2.69-6 6s2.69 6 6 6h10c3.31 0 6-2.69 6-6s-2.69-6-6-6zm0 10H7c-2.21 0-4-1.79-4-4s1.79-4 4-4h10c2.21 0 4 1.79 4 4s-1.79 4-4 4zM7 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"></path></svg><span class="t">Disable</span></button><button class="mi danger" role="menuitem" onClick="{{ r.m7 }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"></path></svg><span class="t">Delete</span></button></div></sc-if>

</div>
<sc-if value="{{topMenu}}" hint-placeholder-val="{{ false }}"><div class="{{topCls}}" role="menu" aria-label="{{topTitle}}" style="{{topStyle}}">
<div class="mhead lm">{{topTitle}}</div>
<sc-for list="{{topItems}}" as="m" hint-placeholder-count="5"><button class="mi" role="{{m.role}}" aria-checked="{{m.aria}}" onClick="{{ m.pick }}"><sc-if value="{{m.check}}" hint-placeholder-val="{{ false }}"><span class="{{m.box}}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z"></path></svg></span></sc-if><sc-if value="{{m.plain}}" hint-placeholder-val="{{ false }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="{{m.icon}}"></path></svg></sc-if><span class="t">{{m.name}}</span></button></sc-for>
</div></sc-if>
<sc-if value="{{anyMenu}}" hint-placeholder-val="{{ false }}"><button class="catch" aria-label="Close the menu" onClick="{{ closeMenu }}"></button></sc-if>
<sc-if value="{{selecting}}" hint-placeholder-val="{{ false }}"><div class="bulk" role="toolbar" aria-label="Actions for the selection" style="bottom: {{bulkBottom}}">

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#98CBFF","options":["#98CBFF","#9BD6A4","#F2C744","#D4BEE6"]},"motion":{"editor":"boolean","default":true},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"stage":{"editor":"enum","default":"menu","options":["menu","bulk","before"]},"$preview":{"width":390,"height":844}}'>
const AUTO_ICON = "M12,2A2,2 0 0,1 14,4C14,4.74 13.6,5.39 13,5.73V7H14A7,7 0 0,1 21,14H22A1,1 0 0,1 23,15V18A1,1 0 0,1 22,19H21V20A2,2 0 0,1 19,22H5A2,2 0 0,1 3,20V19H2A1,1 0 0,1 1,18V15A1,1 0 0,1 2,14H3A7,7 0 0,1 10,7H11V5.73C10.4,5.39 10,4.74 10,4A2,2 0 0,1 12,2M7.5,13A2.5,2.5 0 0,0 5,15.5A2.5,2.5 0 0,0 7.5,18A2.5,2.5 0 0,0 10,15.5A2.5,2.5 0 0,0 7.5,13M16.5,13A2.5,2.5 0 0,0 14,15.5A2.5,2.5 0 0,0 16.5,18A2.5,2.5 0 0,0 19,15.5A2.5,2.5 0 0,0 16.5,13Z";
const AUTOS = [
  ['Morning lights', 'Last triggered 06:30 today', 1],
  ['Turn on the hallway lights when someone comes home after sunset', 'Last triggered 19:49 today', 1],
  ['Water the seedling shelf', 'Last triggered 08:00 today', 1],
  ['Notify when the washing machine is finished', 'Last triggered yesterday 21:12', 1],
  ['Close the blinds at dusk', 'Last triggered 17:04 today', 1],
  ['Away mode: lower the heating', 'Never triggered', 0],
  ['Night light in the upstairs corridor', 'Last triggered 02:15 today', 1],
  ['Greenhouse fan above 28 degrees', 'Last triggered 14 Nov 13:40', 1],
  ['Porch camera snapshot on motion', 'Last triggered 18:22 today', 1],
  ['Low filament reminder', 'Last triggered 9 Nov 10:05', 0]
];
const ROWMENU = ["Show info","Show settings","Assign category","Run actions","Show trace","Duplicate","Disable","Delete"];
const AREAS = ['Kitchen', 'Living room and dining area', 'Upstairs hallway and landing', 'Garage and workshop', 'Back garden greenhouse'];
const LABELS = ['Lighting', 'Energy saving and heating', 'Plants and watering schedule', 'Security and cameras', 'Notifications'];
const GROUPS = ['Daily routines', 'Away and holiday mode', 'Garden and greenhouse', 'Maintenance reminders'];
const PATHS = { grp: "M20,18H4V8H20M20,6H12L10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6Z", label: "M16,17H5V7H16L19.55,12M17.63,5.84C17.27,5.33 16.67,5 16,5H5A2,2 0 0,0 3,7V17A2,2 0 0,0 5,19H16C16.67,19 17.27,18.66 17.63,18.15L22,12L17.63,5.84Z", area: "M20 2H4C2.9 2 2 2.9 2 4V20C2 21.11 2.9 22 4 22H20C21.11 22 22 21.11 22 20V4C22 2.9 21.11 2 20 2M4 6L6 4H10.9L4 10.9V6M4 13.7L13.7 4H18.6L4 18.6V13.7M20 18L18 20H13.1L20 13.1V18M20 10.3L10.3 20H5.4L20 5.4V10.3Z" };
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 0 }; this._p = null; this._s = 'menu'; this.reset('menu'); }

  base() {
    const accent = this.props.accent ?? '#98CBFF';
    const motion = this.props.motion ?? true;
    const theme = this.props.theme ?? 'dark';
    return { accent, shell: 'm3' + (theme === 'dark' ? ' dark' : '') + (motion ? '' : ' still') };
  }
  bump() { this.setState({ n: this.state.n + 1 }); }
  stage() {
    const p = this.props.stage ?? 'menu';
    if (p !== this._p) { this._p = p; this._s = p; this.reset(p); }
    return this._s;
  }
  go(s) { this._s = s; this.reset(s); this.bump(); }

reset(s) {
    this.selecting = s !== 'menu';
    this.sel = s === 'menu' ? {} : { 0: 1, 2: 1 };
    this.menu = s === 'bulk' ? null : 'f-area';
    this.fsel = { area: { 1: 1 }, label: {} };
    this.toast = null;
  }
  renderVals() {
    const v = this.base();
    const s = this.stage();
    const cap = s === 'before';
    const n = Object.keys(this.sel).length;
    const open = (m) => { this.menu = this.menu === m ? null : m; this.toast = null; this.bump(); };
    const say = (t) => { this.menu = null; this.toast = t; this.bump(); };
    const menuCls = 'menu pop' + (cap ? ' cap' : '');
    const m = this.menu;
    let topItems = [], topTitle = '', topStyle = '';
    const bulkPx = cap ? 92 : 126;
    if (m === 'f-area' || m === 'f-label') {
      const key = m === 'f-area' ? 'area' : 'label';
      const src = key === 'area' ? AREAS : LABELS;
      topTitle = key === 'area' ? 'FILTER BY AREA' : 'FILTER BY LABEL';
      topStyle = 'top: 114px; left: 12px';
      topItems = src.map((name, i) => {
        const on = !!this.fsel[key][i];
        return { name, check: true, plain: false, icon: '', role: 'menuitemcheckbox', aria: on ? 'true' : 'false', box: on ? 'box on' : 'box',
          pick: () => { const c = Object.assign({}, this.fsel[key]); if (c[i]) delete c[i]; else c[i] = 1; this.fsel[key] = c; this.bump(); } };
      });
    } else if (m === 'b-grp' || m === 'b-label' || m === 'b-area') {
      const key = m.slice(2);
      const src = key === 'grp' ? GROUPS : key === 'label' ? LABELS : AREAS;
      const verb = key === 'label' ? 'Added the label ' : 'Moved to ';
      topTitle = key === 'grp' ? 'MOVE TO CATEGORY' : key === 'label' ? 'ADD LABEL' : 'MOVE TO AREA';
      topStyle = 'bottom: ' + (bulkPx + 64) + 'px; right: 12px';
      topItems = src.map((name) => ({ name, check: false, plain: true, icon: PATHS[key], role: 'menuitem', aria: 'false', box: 'box',
        pick: () => say(verb + name + ' for ' + n + (n === 1 ? ' automation' : ' automations')) }));
    }
    const fcount = (k) => Object.keys(this.fsel[k]).length;
    return Object.assign(v, {
      isBefore: cap, selecting: this.selecting, showFab: !this.selecting,
      selLabel: this.selecting ? 'Leave selection' : 'Select automations', selAria: this.selecting ? 'true' : 'false',
      toggleSelect: () => { this.selecting = !this.selecting; this.sel = this.selecting ? { 0: 1, 2: 1 } : {}; this.menu = null; this.toast = null; this.bump(); },
      filters: [
        { name: 'Area' + (fcount('area') ? ' · ' + fcount('area') : ''), cls: fcount('area') ? 'chip sel' : 'chip', exp: m === 'f-area' ? 'true' : 'false', open: () => open('f-area') },
        { name: 'Label' + (fcount('label') ? ' · ' + fcount('label') : ''), cls: fcount('label') ? 'chip sel' : 'chip', exp: m === 'f-label' ? 'true' : 'false', open: () => open('f-label') },
        { name: 'Category', cls: 'chip', exp: 'false', open: () => say('Category filter: same menu, same width rule') },
        { name: 'Blueprint', cls: 'chip', exp: 'false', open: () => say('Blueprint filter: same menu, same width rule') }
      ],
      sumText: this.selecting ? n + ' of ' + AUTOS.length + ' selected' : AUTOS.length + ' automations · 8 on',
      padBottom: (this.selecting ? bulkPx + 72 : 198) + 'px',
      rows: AUTOS.map((a, i) => {
        const on = !!this.sel[i];
        const r = {
          name: a[0], meta: a[2] ? a[1] : a[1] + ' · Off', icon: AUTO_ICON, selecting: this.selecting,
          cls: this.selecting && on ? 'arow on' : 'arow', box: on ? 'box on' : 'box',
          tapLabel: (this.selecting ? (on ? 'Deselect ' : 'Select ') : 'Open ') + a[0],
          tap: () => { if (!this.selecting) { say('Opens the editor for ' + a[0]); return; } const c = Object.assign({}, this.sel); if (c[i]) delete c[i]; else c[i] = 1; this.sel = c; this.bump(); },
          moreLabel: 'More actions for ' + a[0], exp: m === 'row' + i ? 'true' : 'false', menu: m === 'row' + i, menuCls,
          more: () => open('row' + i)
        };
        ROWMENU.forEach((label, k) => { r['m' + k] = () => say(label + ': ' + a[0]); });
        return r;
      }),
      topMenu: topItems.length > 0, topItems, topTitle, topStyle, topCls: menuCls,
      anyMenu: m !== null, closeMenu: () => { this.menu = null; this.bump(); },
      bulkBottom: bulkPx + 'px', selCount: n + ' selected',
      openGroup: () => open('b-grp'), openLabel: () => open('b-label'), openArea: () => open('b-area'),
      delSel: () => say('Asks before deleting ' + n + (n === 1 ? ' automation' : ' automations')),
      hasToast: !!this.toast, toast: this.toast || '', hideToast: () => { this.toast = null; this.bump(); },
      toastBottom: (this.selecting ? bulkPx + 68 : 190) + 'px'
    });
  }
}
</script>
