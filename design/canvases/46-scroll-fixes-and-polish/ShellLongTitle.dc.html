  }
  go(s) { this._s = s; this.reset(s); this.bump(); }

  reset(s) { const o = {}; AUTOS.forEach((a) => { if (a[2]) o[a[0]] = 1; }); this.on = o; }
  renderVals() {
    const v = this.base();
    const s = this.stage();
    const old = s === 'before';
    const onCount = AUTOS.filter((a) => this.on[a[0]]).length;
    return Object.assign(v, {
      isOld: old,
      barCls: 'bar lt' + (old ? ' old' : ''),
      titleCls: old ? 'old' : 'fix',
      titleAttr: old ? '' : 'Automations & scenes',
      sumText: AUTOS.length + ' items, ' + onCount + ' turned on',
      rows: AUTOS.map((a) => {
        const on = !!this.on[a[0]];
        return {
          name: a[0], meta: a[1], sw: on ? 'sw on' : 'sw', aria: on ? 'true' : 'false', label: 'Turn ' + a[0] + (on ? ' off' : ' on'),
          toggle: () => { const o = Object.assign({}, this.on); if (on) delete o[a[0]]; else o[a[0]] = 1; this.on = o; this.bump(); }
        };
      })
    });
  }
}
</script>
</body>
