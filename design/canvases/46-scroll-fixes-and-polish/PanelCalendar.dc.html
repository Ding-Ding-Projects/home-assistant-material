  base() {
    const accent = this.props.accent ?? '#98CBFF';
    const motion = this.props.motion ?? true;
    const theme = this.props.theme ?? 'dark';
    return { accent, shell: 'm3' + (theme === 'dark' ? ' dark' : '') + (motion ? '' : ' still') };
  }
  bump() { this.setState({ n: this.state.n + 1 }); }
  stage() {
    const p = this.props.stage ?? 'after';
    if (p !== this._p) { this._p = p; this._s = p; this.reset(p); }
    return this._s;
  }
  go(s) { this._s = s; this.reset(s); this.bump(); }
  reset(s) { this.toast = ''; }
  renderVals() {
    const v = this.base();
    const s = this.stage();
    const before = s === 'before';
    const shown = EVENTS.filter((e) => !this.off[e[2]]);
    const cells = [];
    for (let n = 1; n <= 35; n++) {
      const day = n <= 30 ? n : n - 30;
      const ev = n <= 30 ? shown.filter((e) => e[0] === n) : [];
      cells.push({
        n: day, cls: 'cell' + (n === 25 ? ' now' : ''),
        has1: ev.length > 0, t1: ev[0] ? ev[0][1] : '', h1: ev[0] ? CALS[ev[0][2]][1] : '#000',
        has2: ev.length > 1, t2: ev[1] ? ev[1][1] : '', h2: ev[1] ? CALS[ev[1][2]][1] : '#000',
        hasMore: ev.length > 2, more: '+' + (ev.length - 2) + ' more', moreTitle: ev.slice(2).map((e) => e[1]).join(', ')
      });
    }
    return Object.assign(v, {
      isAfter: !before, isBefore: before,
      contentCls: before ? 'content old' : 'content',
      summary: shown.length + ' events this month',
      cells,
      cals: CALS.map((c, i) => {
        const on = !this.off[i];
        const count = EVENTS.filter((e) => e[2] === i).length;
        return {
          name: c[0], hex: c[1], meta: on ? count + ' events this month' : 'Hidden',
          cls: on ? 'prow' : 'prow off', box: on ? 'cbx on' : 'cbx', aria: on ? 'true' : 'false',
          old: on ? 'orow on' : 'orow', oldIcon: on ? BOX_ON : BOX_OFF,
          toggle: () => { const o = Object.assign({}, this.off); if (o[i]) delete o[i]; else o[i] = 1; this.off = o; this.bump(); }
        };
      }),
      newCal: () => { this.toast = 'This would open the new calendar dialog.'; this.bump(); },
      addEvent: () => { this.toast = 'This would open the new event dialog for 25 November.'; this.bump(); },
      toast: this.toast !== '', toastText: this.toast,
      hideToast: () => { this.toast = ''; this.bump(); }
    });
  }
}
</script>
</body>
