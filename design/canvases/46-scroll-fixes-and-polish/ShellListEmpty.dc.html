<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#98CBFF","options":["#98CBFF","#9BD6A4","#F2C744","#D4BEE6"]},"motion":{"editor":"boolean","default":true},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"stage":{"editor":"enum","default":"after","options":["after","before","long-text","pattern","pattern-invalid"]},"$preview":{"width":390,"height":844}}'>
const TEXT = [["eh","Start automating","Set up your first automation to get started"],["ep","Automations make Home Assistant automatically respond to things happening in and around your home.","An automation lets Home Assistant act on its own whenever something changes inside your home or close to it."],["ep","Automations connect triggers to actions in a 'when trigger then action' fashion with optional conditions. For example: 'When the sun sets and if Alex is home, then turn on the lights'.","Each automation joins a trigger to one or more actions, and you can add conditions that must be true first. For example: 'When the sun goes down, and only if Alex is at home, switch on the lights'."]];
// Pattern (regular expression) helpers shared by every search field on this board.

const RX_WORDS = { d: 'any digit', D: 'anything but a digit', w: 'a letter, digit or underscore', W: 'anything but a letter, digit or underscore', s: 'a space or tab', S: 'anything but a space', b: 'the edge of a word', n: 'a new line', t: 'a tab' };

function rxQuery(pat, fl) { return '/' + (fl.w ? '\\b(?:' + pat + ')\\b' : pat) + '/' + rxTail(fl); }

  const m = /^\/(.+)\/([ims]*)$/.exec((q || '').trim());
  if (!m) return null;
  const fl = {}; m[2].split('').forEach((c) => { fl[c] = 1; });

  if (pat.length > 8 && pat.slice(0, 5) === '\\b(?:' && pat.slice(-3) === ')\\b') { fl.w = 1; pat = pat.slice(5, -3); }
  return { pat, fl };
}
function rxWhy(pat) {
  let depth = 0, list = false;
  for (let i = 0; i < pat.length; i++) {
    const c = pat[i];
    if (c === '\\') { if (i === pat.length - 1) return 'The pattern ends with a backslash. Add the character it stands for.'; i++; continue; }
    if (list) { if (c === ']') list = false; continue; }
    if (c === '[') list = true; else if (c === '(') depth++; else if (c === ')') depth--;
    if (depth < 0) return 'There is a closing bracket ) with no opening bracket ( before it.';
  }
  if (list) return 'A list that starts with [ is never closed. Add ] to finish it.';
  if (depth > 0) return 'A group that starts with ( is never closed. Add ) to finish it.';
  if (/^[*+?]/.test(pat)) return 'A pattern cannot start with * + or ?. Put something before it to repeat.';
  return 'This pattern cannot be read. Check the last thing you typed.';
}

  if (/\([^()]*[*+][^()]*\)[*+{]/.test(pat)) return { re: null, err: 'This pattern repeats a repeat, which can take too long to run. Make it simpler.' };
  try { return { re: new RegExp(fl.w ? '\\b(?:' + pat + ')\\b' : pat, 'g' + rxTail(fl)), err: '' }; }
  catch (e) { return { re: null, err: rxWhy(pat) }; }

function rxHas(text, re) { try { re.lastIndex = 0; return re.test(String(text).slice(0, 400)); } catch (e) { return false; } }
function rxSegs(text, re) {
  text = String(text).slice(0, 400);
  const segs = []; let last = 0, n = 0, m;

    re.lastIndex = 0;
    while (n < 20 && (m = re.exec(text))) {

      if (m.index > last) segs.push({ t: text.slice(last, m.index), cls: '' });

    }

  return segs;
}
function rxMatcher(q) {
  const t = (q || '').trim();
  if (!t) return null;
  const p = rxParse(t);
  if (p) { const b = rxBuild(p.pat, p.fl); if (b.re) return (x) => rxHas(x, b.re); }

function rxExplain(pat) {
  const out = []; let i = 0, lit = '';
  const flush = () => { if (lit) { out.push({ tok: lit, text: 'the text "' + lit + '"' }); lit = ''; } };
  const add = (tok, text, step) => { flush(); out.push({ tok, text }); i += step; };
  while (i < pat.length && out.length < 12) {
    const c = pat[i], two = pat.substr(i, 2);

    else if (two === '.+') add('.+', 'any text, at least one character', 2);
    else if (c === '.') add('.', 'any one character', 1);
    else if (c === '^') add('^', 'the start', 1);
    else if (c === '$') add('$', 'the end', 1);
    else if (c === '|') add('|', 'or', 1);
    else if (pat.substr(i, 3) === '(?:') add('(?:', 'start of a group', 3);
    else if (c === '(') add('(', 'start of a group', 1);
    else if (c === ')') add(')', 'end of the group', 1);
    else if (c === '*') add('*', 'the piece before it, any number of times', 1);

  constructor(p) { super(p); this.state = { n: 0 }; this._p = null; this._s = 'after';  }

  reset(s) { this.sq = {}; this.wb = null; this.sOpen = s === 'pattern' || s === 'pattern-invalid'; if (s === 'pattern') this.wb = { id: 's', pat: "light|sunset", fl: { i: 1 } }; if (s === 'pattern-invalid') this.wb = { id: 's', pat: "(light", fl: { i: 1 } }; }

  // ---- pattern workbench: one draft at a time, one saved query per search field ----
  rxFocus(sel) { const root = this._root; setTimeout(() => { try { const el = (root || document).querySelector(sel); if (el) el.focus(); } catch (e) {} }, 60); }
  rxOpen(id, e) {
    try { if (e && e.currentTarget && e.currentTarget.getRootNode) this._root = e.currentTarget.getRootNode(); } catch (err) {}

  }
  rxClose() { const id = this.wb && this.wb.id; this.wb = null; this.bump(); if (id) this.rxFocus('[data-rx="' + id + '"]'); }

  }

    const q = this.sq[id] || '';
    const pq = rxParse(q);
    const on = !!pq && !!rxBuild(pq.pat, pq.fl).re;
    v[p + 'Q'] = q;
    v[p + 'Set'] = (e) => { const n = Object.assign({}, this.sq); n[id] = e.target.value; this.sq = n; this.bump(); };
    v[p + 'RxCls'] = on ? 'rxb on' : 'rxb';
    v[p + 'RxOn'] = on ? 'true' : 'false';
    v[p + 'RxOpen'] = (e) => this.rxOpen(id, e);
  }
  rxVals(v, fields) {
    this.rxEscape();
    const w = this.wb, f = w ? fields[w.id] : null;
    const open = !!f;
    const pat = open ? w.pat : '', fl = open ? w.fl : {};

    const hits = b.re ? rows.filter((t) => rxHas(t, b.re)) : [];
    const sample = open && !rows.length && f.sample ? f.sample : '';

    const ok = !!b.re;

      wbTitle: open ? 'Pattern workbench for: ' + f.label : '', wbFor: open ? 'Opened from: ' + f.label + '. The pattern is kept for this search only.' : '',
      wbPat: pat, wbTail: '/' + rxTail(fl), wbFieldCls: b.err ? 'wbfield bad' : 'wbfield', wbInvalid: b.err ? 'true' : 'false',
      wbSet: (e) => { if (this.wb) { this.wb = Object.assign({}, this.wb, { pat: e.target.value }); this.bump(); } },
      wbBad: !!b.err, wbErr: b.err,

  }
