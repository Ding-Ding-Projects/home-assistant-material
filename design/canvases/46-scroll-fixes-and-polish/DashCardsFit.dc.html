</div>
</div>

<div class="card al">
<h2>Route alerts</h2>
<sc-for list="{{alerts}}" as="a" hint-placeholder-count="2">
<sc-if value="{{isAfter}}" hint-placeholder-val="{{ true }}">
<button class="arow" aria-expanded="{{a.aria}}" title="{{a.text}}" onClick="{{ a.tap }}">
<span class="rb" style="background: {{a.color}}">{{a.route}}</span>
<span class="grow"><span class="{{a.cls}}">{{a.text}}</span><span class="ts">{{a.meta}}</span></span>
<span class="ast" style="color: {{a.tone}}">{{a.status}}</span>
<span style="color: var(--onv); margin-top: 2px"><svg class="ic s" aria-hidden="true" viewBox="0 0 24 24"><path d="{{a.chev}}"></path></svg></span>
</button>
</sc-if>
<sc-if value="{{isBefore}}" hint-placeholder-val="{{ false }}">
<div class="arow old">
<span class="rb" style="background: {{a.color}}">{{a.route}}</span>
<span class="grow"><span class="atx one">{{a.text}}</span><span class="ts">{{a.meta}}</span></span>
<span class="ast" style="color: {{a.tone}}">{{a.status}}</span>
</div>
</sc-if>
</sc-for>
</div>
</div>
<sc-if value="{{hasMsg}}" hint-placeholder-val="{{ false }}"><div class="toast pop" role="status" style="{{toastStyle}}"><span style="flex: 1">{{msg}}</span><button class="btn text" onClick="{{ dismiss }}">Dismiss</button></div></sc-if>
<sc-if value="{{isBefore}}" hint-placeholder-val="{{ false }}"><span class="today">Today</span></sc-if>
</div>
</div>

    const motion = this.props.motion ?? true;
    const theme = this.props.theme ?? 'dark';
    return { accent, shell: 'm3' + (theme === 'dark' ? ' dark' : '') + (motion ? '' : ' still') };
  }
  bump() { this.setState({ n: this.state.n + 1 }); }
  stage() {
    const p = this.props.stage ?? DEF;
    if (p !== this._p) { this._p = p; this._s = p; this.reset(p); }
    return this._s;
  }
  say(m) { this.msg = m; this.bump(); }

  reset() { this.msg = ''; this.target = [21, 19]; this.tog = [true, false, false, true]; this.open = [false, false]; }
  renderVals() {
    const v = this.base();
    const s = this.stage();
    const before = s === 'before';
    const off = 'var(--onv)';
    const deg = (n) => n.toFixed(1) + ' °C';
    const step = (i, d) => () => { this.target[i] = Math.max(10, Math.min(28, this.target[i] + d)); this.bump(); };
    const NAMES = ['Living room', 'Bedroom'];
    const NOW = ['21.5 °C', '19.0 °C'];
    const AL = [
      { route: '29', color: '#C4352B', status: 'Detour', tone: 'var(--amber)', meta: 'Signal fault · 19:42', text: 'No service between Maple Square and Harbour Road because of a signal fault. Shuttle buses run every 6 minutes from stop B on Cedar Street. Allow 15 to 20 minutes more for your trip. Regular service is expected to resume by 21:30.' },
      { route: '510', color: '#1F6A3B', status: 'Delay', tone: 'var(--amber)', meta: 'Road works · 19:20', text: 'Cars are held for up to 8 minutes near Orchard Loop.' }
    ];
    const TG = [['Porch light', P.bulb], ['Path lights', P.bulb], ['Garage light', P.bulb], ['Recording', P.power]];
    const INF = [['Motion: clear', P.refresh], ['Front door: locked', P.lock], ['Porch temperature: 9 °C', P.thermo], ['Doorbell: idle', P.tv], ['Camera settings', P.dotsV]];
    return Object.assign(v, {
      isAfter: !before, isBefore: before,
      thermos: NAMES.map((n, i) => ({ name: n, state: 'Heat · target ' + deg(this.target[i]), target: deg(this.target[i]), now: NOW[i], cls: before ? 'card thermo old' : 'card thermo', up: step(i, 0.5), down: step(i, -0.5) })),
      tiles: [
        { name: 'Floor heating', state: 'Idle', icon: P.thermo, color: off },
        { name: 'Air purifier', state: 'Auto', icon: P.power, color: '#4CAF6A' },
        { name: 'Bathroom fan', state: 'Off', icon: P.power, color: off },
        { name: 'Humidifier', state: 'On · 45%', icon: P.power, color: '#3FB7B0' }
      ],
      boxCls: before ? 'box old' : 'box',
      infos: INF.map((e) => ({ label: e[0], icon: e[1], tap: () => this.say(e[0]) })),
      toggles: TG.map((e, i) => ({ label: e[0] + (this.tog[i] ? ', on' : ', off'), icon: e[1], cls: this.tog[i] ? 'w on' : 'w', aria: String(this.tog[i]), tap: () => { this.tog[i] = !this.tog[i]; this.bump(); } })),
      alerts: AL.map((a, i) => Object.assign({}, a, { cls: this.open[i] ? 'atx open' : 'atx', aria: String(this.open[i]), chev: this.open[i] ? P.up : P.down, tap: () => { this.open[i] = !this.open[i]; this.bump(); } })),
      hasMsg: !!this.msg, msg: this.msg, toastStyle: '', dismiss: () => this.say('')
    });
  }
}
</script>
</body>
</html>
