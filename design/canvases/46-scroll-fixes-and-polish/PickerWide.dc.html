    const loading = s === 'loading' && pan.id === 'integrations';
    const kind = before ? (pan.legacy ? ' mw' : ' t3') : '';
    const sel = this.sel[pan.id];
    const nSel = Object.keys(sel).length;
    const toggle = (name) => { const c = Object.assign({}, sel); if (c[name]) delete c[name]; else c[name] = 1; this.sel = Object.assign({}, this.sel, { [pan.id]: c }); this.menuFor = ''; this.bump(); };
    const none = !loading && shown.length === 0;
    return {
      headsAbove: PANELS.slice(0, idx).map(head), headsBelow: PANELS.slice(idx + 1).map(head),
      openName: pan.name, openHas: nSel > 0, openSel: String(nSel),
      fsrCls: before ? 'fsr old' : 'fsr', fquery: this.fq, hasFQuery: this.fq.length > 0,
      fPlaceholder: 'Search ' + pan.name.toLowerCase(),
      fCount: loading || !q ? '' : shown.length + ' of ' + pan.rows.length,
      setFQuery: (e) => { this.fq = e.target.value; this.bump(); },
      clearFQuery: () => { this.fq = ''; this.bump(); },
      clearAll: () => { this.sel = { areas: {}, domains: {}, integrations: {}, devices: {}, categories: {} }; this.bump(); },
      isList: !loading && shown.length > 0, isNoMatch: none && !before, isBlank: none && before, isLoading: loading,
      blankText: pan.hidden ? pan.rows.length + ' of ' + pan.rows.length + ' options hidden' : '',
      noMatchTitle: 'No ' + pan.noun + ' matches "' + this.fq + '"',
      loadingText: 'Loading ' + pan.name.toLowerCase(),
      skel: ['62%', '48%', '70%', '40%', '56%'].map((w) => ({ w })),
      hasAdd: !!pan.add, addText: pan.add || '', addCls: before ? 'addrow mw' : 'addrow',
      frows: shown.map((r) => {
        const on = !!sel[r[1]];
        return {
          icon: r[0], name: r[1], meta: r[3], hasMeta: !before,
          cls: 'frow' + kind + (on ? ' on' : ''), aria: String(on), leadCls: before ? 'bare' : 'lead', box: on ? 'box on' : 'box',
          toggle: () => toggle(r[1]),
          more: !!pan.more, moreLabel: 'Options for ' + r[1], menu: this.menuFor === r[1], menuAria: String(this.menuFor === r[1]),
          openMenu: () => { this.menuFor = this.menuFor === r[1] ? '' : r[1]; this.bump(); }
        };
      }),
      applyText: 'Show ' + this.accTotal() + ' entities'
    };
  }

  renderVals() {
    const v = this.base();
    const s = this.stage();
    const before = s === 'before';
    const q = this.q.trim().toLowerCase();
    const shown = AREAS.map((a, i) => ({ a, i })).filter((x) => !q || x.a[1].toLowerCase().includes(q));
    const a = AREAS[this.area];
    const nPicked = Object.keys(this.picked).length;
    return Object.assign(v, this.accVals(s, before), {
      isBefore: before,
      tableText: this.accTotal() + ' entities match. ' + TROWS.length + ' sample rows shown.',
      selText: nPicked + ' selected',
      pfCls: 'pf' + (this.popOpen ? ' foc' : '') + (before ? ' old' : ''),
      popCls: before ? 'pp old' : 'pp pop', psrCls: before ? 'psr old' : 'psr',
      popOpen: this.popOpen, popAria: String(this.popOpen),
      togglePop: () => { this.popOpen = !this.popOpen; this.bump(); },
      areaName: a[1], areaFloor: a[2], areaIcon: a[0], areaTitle: before ? '' : a[1] + ', ' + a[2],
      query: this.q, hasQuery: this.q.length > 0,
      setQuery: (e) => { this.q = e.target.value; this.bump(); },
      clearQuery: () => { this.q = ''; this.bump(); },
      noAreas: shown.length === 0,
      arows: shown.map((x) => {
        const on = x.i === this.area;
        return { icon: x.a[0], name: x.a[1], floor: x.a[2], cls: 'prow' + (before ? ' old' : '') + (on ? ' on' : ''), aria: String(on), pick: () => { this.area = x.i; this.popOpen = false; this.q = ''; this.bump(); } };
      }),
      menuOpen: this.menuOpen, menuAria: String(this.menuOpen),
      toggleMenu: () => { this.menuOpen = !this.menuOpen; this.bump(); },
      trows: TROWS.map((e, i) => {
        const on = !!this.picked[i];
        return { name: e.name, id: e.id, area: e.area, dom: e.dom, aria: String(on), box: on ? 'box on' : 'box', label: 'Select ' + e.name, toggle: () => { const n = Object.assign({}, this.picked); if (n[i]) delete n[i]; else n[i] = 1; this.picked = n; this.bump(); } };
      })
    });
  }
}
</script>
