<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile setting rows, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m3{--ac:#98CBFF;--s:#51606F;--sc:#D5E4F6;--on-sc:#3A4857;--err:#BA1A1A;--errc:#FFDAD6;--on-errc:#93000A;--surf:#EEF1F6;--sl0:#FFFFFF;--sl1:#F7F9FD;--sl2:#F1F4F9;--sl3:#E9EDF3;--sl4:#E1E5EC;--on:#181C20;--onv:#42474E;--out:#72777F;--outv:#C2C7CF;--inv:#2D3135;--on-inv:#EFF1F6;--amber:#6B5200;--amberc:#FFE08B;--green:#1F6A3B;--greenc:#B6F2BE;--scrim:rgba(24,28,32,.42);--e3:0 4px 8px 3px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.2);--p:color-mix(in srgb,var(--ac) 55%,#00131f);--on-p:#FFFFFF;--pc:color-mix(in srgb,var(--ac) 34%,#FFFFFF);--on-pc:color-mix(in srgb,var(--ac) 30%,#000000);font-family:Roboto,system-ui,sans-serif;color:var(--on);background:var(--surf);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.m3.dark{--s:#B9C8DA;--sc:#3A4857;--on-sc:#D5E4F6;--err:#FFB4AB;--errc:#93000A;--on-errc:#FFDAD6;--surf:#0B0F13;--sl0:#14181D;--sl1:#191D22;--sl2:#1D2126;--sl3:#272B31;--sl4:#32363C;--on:#E0E2E8;--onv:#C2C7CF;--out:#8C9199;--outv:#42474E;--inv:#E0E2E8;--on-inv:#2D3135;--amber:#F2C744;--amberc:#514000;--green:#9BD6A4;--greenc:#005227;--scrim:rgba(0,0,0,.62);--e3:0 6px 16px rgba(0,0,0,.6);--p:var(--ac);--on-p:#071019;--pc:color-mix(in srgb,var(--ac) 30%,#12161A);--on-pc:color-mix(in srgb,var(--ac) 30%,#FFFFFF)}
.m3 *{box-sizing:border-box}
.m3 button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
.m3 input{font:inherit;color:inherit}
.m3 h1,.m3 h2,.m3 p{margin:0}
.m3 :focus-visible{outline:2px solid var(--p);outline-offset:2px}
.ic{width:24px;height:24px;fill:currentColor;flex:none;display:block}
.ic.s{width:20px;height:20px}
.ic.l{width:40px;height:40px}
.tl{font-size:22px;line-height:28px;font-weight:500}
.tm{font-size:16px;line-height:24px;font-weight:500}
.bl{font-size:16px;line-height:24px}
.sub{font-size:13px;line-height:18px;color:var(--onv)}
.lm{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.4px;color:var(--onv)}
.mono{font-family:'Roboto Mono',ui-monospace,Menlo,monospace}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:8px}
.ib{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;color:var(--onv);flex:none;transition:background-color .2s}
.ib:hover{background:var(--sl3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:24px;font-size:14px;font-weight:600;white-space:nowrap;transition:filter .2s,transform .2s cubic-bezier(.2,0,0,1)}
.m3 .btn.fill{background:var(--p);color:var(--on-p)}
.m3 .btn.tonal{background:var(--sc);color:var(--on-sc)}
.m3 .btn.text{color:var(--p);padding:0 14px}
.m3 .btn.off{background:var(--sl4);color:var(--out);cursor:not-allowed}
.btn:hover{filter:brightness(1.07)}
.m3 .chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--outv);color:var(--onv);font-size:14px;font-weight:600;white-space:nowrap;flex:none;position:relative}
.m3 .chip::after{content:"";position:absolute;inset:-6px 0}
.m3 .chip.sel{background:var(--sc);box-shadow:none;color:var(--on-sc)}
.lead{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--sc);color:var(--on-sc);flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 10px;border-radius:12px;background:var(--sl3);color:var(--onv);font-size:12px;line-height:16px;font-weight:600}
.tag.p{background:var(--pc);color:var(--on-pc)}
.tag.g{background:var(--greenc);color:var(--green)}
.tag.e{background:var(--errc);color:var(--on-errc)}
.note{display:flex;gap:12px;padding:12px 14px;border-radius:16px;background:var(--sl2);color:var(--onv);font-size:13px;line-height:18px}
.note.bad{background:var(--errc);color:var(--on-errc)}
.field{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 8px 6px 16px;border-radius:16px;background:var(--sl2);box-shadow:inset 0 -2px 0 var(--out);width:100%}
.field.bad{box-shadow:inset 0 -3px 0 var(--err)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;min-height:44px}
.sk{display:block;border-radius:12px;background:linear-gradient(90deg,var(--sl2) 25%,var(--sl4) 50%,var(--sl2) 75%);background-size:200% 100%;animation:shim 1.4s linear infinite}
.in{animation:rise .35s cubic-bezier(.2,0,0,1) both}
.pop{animation:pop .28s cubic-bezier(.2,0,0,1) both}
.up{animation:up .32s cubic-bezier(.2,0,0,1) both}
.spin{animation:spin 1s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
.lin{height:4px;border-radius:2px;background:var(--sl4);overflow:hidden}
.lin span{display:block;width:36%;height:100%;border-radius:2px;background:var(--p);animation:slide 1.4s cubic-bezier(.4,0,.2,1) infinite}
.ph{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.wd{min-height:var(--wh,860px);position:relative;overflow:hidden;padding:20px clamp(16px,3vw,40px) 32px;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;align-items:center;gap:4px;min-height:64px;padding:8px 8px 8px 4px;flex:none}
.bar h1{flex:1;min-width:0;font-size:22px;line-height:28px;font-weight:500}
.stagebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px 24px;color:var(--onv)}
.stagebox .big{width:72px;height:72px;border-radius:36px;display:grid;place-items:center;background:var(--sl2);color:var(--onv)}
.toast{position:absolute;left:12px;right:12px;bottom:16px;z-index:8;background:var(--inv);color:var(--on-inv);border-radius:16px;padding:10px 6px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--e3)}
.toast .btn.text{color:inherit;text-decoration:underline}
.still *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){.m3 *{animation:none!important;transition:none!important}}
.tdy{display:inline-flex;align-items:center;min-height:24px;padding:2px 12px;border-radius:12px;background:var(--amberc);color:var(--amber);font-size:12px;line-height:16px;font-weight:700;letter-spacing:.4px;flex:none;white-space:nowrap}
.ph{background:var(--surf)}
.frame{height:860px;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--surf);container-type:inline-size}
.abar{display:flex;align-items:center;gap:8px;min-height:64px;padding:8px 12px 8px 4px;flex:none}
.abar h1{flex:1;min-width:0;font-size:22px;line-height:28px;font-weight:500;overflow-wrap:anywhere}
.foot{flex:none;height:40px;display:flex;align-items:center;gap:20px;padding:0 20px;font-size:12px;line-height:16px;color:var(--onv);box-shadow:inset 0 1px 0 var(--outv);white-space:nowrap;overflow:hidden}
.foot span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.navp{position:absolute;left:12px;right:12px;bottom:12px;height:64px;border-radius:32px;background:var(--sl3);box-shadow:var(--e3);display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:6}
.m3 .ni{min-width:64px;min-height:48px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;line-height:14px;font-weight:600;color:var(--onv);padding:0 10px}
.m3 .ni.sel{background:var(--pc);color:var(--on-pc)}
.sw{width:52px;height:32px;border-radius:16px;box-shadow:inset 0 0 0 2px var(--out);background:var(--sl4);display:flex;align-items:center;padding:0 8px;flex:none;transition:background-color .2s;position:relative}
.sw::after{content:"";position:absolute;inset:-8px 0}
.sw i{display:block;width:16px;height:16px;border-radius:12px;background:var(--out);transition:all .2s cubic-bezier(.2,0,0,1)}
.sw.on{box-shadow:none;background:var(--p);justify-content:flex-end;padding:0 4px}
.sw.on i{width:24px;height:24px;background:var(--on-p)}
.demo{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 16px 4px;padding:8px 12px;border-radius:16px;border:1.5px dashed var(--outv);flex:none}
.m3 .tile{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--pc);color:var(--on-pc);flex:none}
.ptabs{display:flex;flex:none;box-shadow:inset 0 -1px 0 var(--outv)}
.m3 .ptab{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--onv);position:relative}
.m3 .ptab.sel{color:var(--p)}
.m3 .ptab.sel::after{content:"";position:absolute;left:28%;right:28%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--p)}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 100px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--sl0);border-radius:20px;padding:6px 0 8px;display:flex;flex-direction:column;position:relative}
.card h2{font-size:16px;line-height:24px;font-weight:500;padding:10px 16px 4px}
.srow{display:flex;align-items:center;gap:8px 16px;min-height:56px;padding:10px 16px;flex-wrap:wrap}
.srow .tx{flex:1 1 180px;min-width:0;display:flex;flex-direction:column}
.srow .tx b{font-size:16px;line-height:22px;font-weight:400;color:var(--on);overflow-wrap:anywhere}
.srow .tx span{font-size:13px;line-height:18px;color:var(--onv);overflow-wrap:anywhere}
.srow .selw{flex:1 1 100%;position:relative}
.m3 .sel{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;padding:6px 8px 6px 14px;border-radius:12px;background:var(--sl2);box-shadow:inset 0 -2px 0 var(--out)}
.sel .grow .lm{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.2px}
.sel .grow .bl{font-size:15px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smenu{position:absolute;left:0;right:0;top:56px;z-index:7;background:var(--sl3);border-radius:16px;box-shadow:var(--e3);padding:6px;display:flex;flex-direction:column}
.m3 .smenu button{min-height:48px;padding:0 14px;border-radius:12px;font-size:15px;display:flex;align-items:center;gap:10px}
.m3 .smenu button:hover{background:var(--sl4)}
.m3 .smenu button.on{background:var(--pc);color:var(--on-pc)}
.old .srow{flex-wrap:nowrap}
.old .srow .tx{flex:1 1 0}
.old .srow .tx b,.old .srow .tx span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}
.old .srow .selw{flex:0 0 200px}
</style>
</helmet>
<div class="{{shell}}" style="--ac: {{accent}}">
<div class="ph">
<div class="bar">
<button class="ib" aria-label="Open the sidebar"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"></path></svg></button>
<h1>Profile</h1>
<sc-if value="{{isBefore}}" hint-placeholder-val="{{ false }}"><span class="tdy">Today</span></sc-if>
</div>
<div class="ptabs" role="tablist" aria-label="Profile sections"><button class="ptab sel" role="tab" aria-selected="true">General</button><button class="ptab" role="tab" aria-selected="false">Security</button></div>
<div class="{{bodyCls}}" tabindex="0" aria-label="Profile settings">
<div class="card in">
<h2>Tabs and navigation</h2>
<div class="srow">
<div class="tx"><b>Tab strip position</b><span>Where the strip of open pages sits.</span></div>
<div class="selw">
<button class="sel" aria-haspopup="listbox" aria-expanded="{{menuAria}}" aria-label="Tab strip position: {{edge}}" onClick="{{ toggleMenu }}"><span class="grow"><span class="lm">Tab strip position</span><span class="bl">{{edge}}</span></span><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M7,10L12,15L17,10H7Z"></path></svg></button>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div class="smenu pop" role="listbox" aria-label="Tab strip position">
<sc-for list="{{edges}}" as="e" hint-placeholder-count="4"><button class="{{e.cls}}" role="option" aria-selected="{{e.aria}}" onClick="{{ e.pick }}">{{e.name}}</button></sc-for>
</div>
</sc-if>
</div>
</div>
<sc-for list="{{tabRows}}" as="r" hint-placeholder-count="2">
<div class="srow"><div class="tx"><b>{{r.head}}</b><span>{{r.desc}}</span></div><button class="{{r.sw}}" role="switch" aria-checked="{{r.aria}}" aria-label="{{r.head}}" onClick="{{ r.toggle }}"><i></i></button></div>
</sc-for>
</div>
<div class="card in">
<h2>This browser</h2>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div class="srow"><div class="tx"><b>{{r.head}}</b><span>{{r.desc}}</span></div><button class="{{r.sw}}" role="switch" aria-checked="{{r.aria}}" aria-label="{{r.head}}" onClick="{{ r.toggle }}"><i></i></button></div>
</sc-for>
</div>
</div>
<nav class="navp" aria-label="Main pages"><button class="ni"><svg class="ic s" aria-hidden="true" viewBox="0 0 24 24"><path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z"></path></svg>Overview</button><button class="ni"><svg class="ic s" aria-hidden="true" viewBox="0 0 24 24"><path d="M7,2V13H10V22L17,10H13L17,2H7Z"></path></svg>Energy</button><button class="ni"><svg class="ic s" aria-hidden="true" viewBox="0 0 24 24"><path d="M12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22C6.47,22 2,17.5 2,12A10,10 0 0,1 12,2M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z"></path></svg>Activity</button><button class="ni sel" aria-current="page"><svg class="ic s" aria-hidden="true" viewBox="0 0 24 24"><path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"></path></svg>More</button></nav>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#98CBFF","options":["#98CBFF","#9BD6A4","#F2C744","#D4BEE6"]},"motion":{"editor":"boolean","default":true},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"stage":{"editor":"enum","default":"after","options":["after","before"]},"$preview":{"width":390,"height":844}}'>
const EDGES = ['Dock to top', 'Dock to bottom', 'Dock to left', 'Dock to right'];
const TAB_ROWS = [['collapse', 'Collapse the tab strip', 'Shows each tab as its icon only. The name shows when you point at a tab.'], ['merge', 'One navigation pane', 'Adds settings, developer tools, notifications and your profile to the tab strip and hides the side rail.']];
const ROWS = [['suspend', 'Suspend background connections', 'For hidden windows or background tabs, close the server connection after 5 minutes.'], ['narrow', 'Always hide the sidebar', 'This will hide the sidebar by default, similar to the mobile experience.'], ['keys', 'Keyboard shortcuts', 'Enable or disable keyboard shortcuts for performing various actions in the UI.'], ['vibrate', 'Vibrate', 'Enable or disable vibration on this device when controlling devices.'], ['push', 'Receive notifications', 'Enable HTML5 browser notifications on this device.']];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 0 }; this._p = null; this._s = 'after'; this.on = { suspend: 1, keys: 1, vibrate: 1 }; this.edge = 0; this.menu = false; }

  base() {
    const accent = this.props.accent ?? '#98CBFF';
    const motion = this.props.motion ?? true;
    const theme = this.props.theme ?? 'dark';
    return { accent, shell: 'm3' + (theme === 'dark' ? ' dark' : '') + (motion ? '' : ' still') };
  }
  bump() { this.setState({ n: this.state.n + 1 }); }
  stage() {
    const p = this.props.stage ?? 'after';
    if (p !== this._p) { this._p = p; this._s = p; this.reset(p); }
    return this._s;
  }
  go(s) { this._s = s; this.reset(s); this.bump(); }
  reset(s) { this.menu = false; }
  renderVals() {
    const v = this.base();
    const s = this.stage();
    const before = s === 'before';
    const row = (r) => {
      const on = !!this.on[r[0]];
      return { head: r[1], desc: r[2], sw: on ? 'sw on' : 'sw', aria: on ? 'true' : 'false', toggle: () => { const o = Object.assign({}, this.on); if (o[r[0]]) delete o[r[0]]; else o[r[0]] = 1; this.on = o; this.bump(); } };
    };
    return Object.assign(v, {
      isBefore: before,
      bodyCls: before ? 'pbody old' : 'pbody',
      edge: EDGES[this.edge], menuOpen: this.menu, menuAria: this.menu ? 'true' : 'false',
      toggleMenu: () => { this.menu = !this.menu; this.bump(); },
      edges: EDGES.map((name, i) => ({ name, cls: i === this.edge ? 'on' : '', aria: i === this.edge ? 'true' : 'false', pick: () => { this.edge = i; this.menu = false; this.bump(); } })),
      tabRows: TAB_ROWS.map(row), rows: ROWS.map(row)
    });
  }
}
</script>
</body>
</html>
