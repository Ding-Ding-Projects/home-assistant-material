<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crop picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#9ad0a0}a:hover{color:#c6ebc9}
.gl-in{animation:glin .35s cubic-bezier(.2,0,0,1) both}
@keyframes glin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gl-still .gl-in{animation:none}
@media (prefers-reduced-motion: reduce){.gl-in{animation:none}}
input[type=range]{width:100%}
</style>
</helmet>
<div class="{{rootClass}}" style="box-sizing: border-box; min-height: 844px; background: #121412; color: #e3e6e1; font-family: Roboto, system-ui, sans-serif; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 22px; font-weight: 500">Add grow light</h1>
<span style="font-size: 14px; color: #a9b0a7">Crop</span>
<input type="search" value="{{query}}" onInput="{{ setQuery }}" placeholder="Search crops" aria-label="Search crops" style="min-height: 48px; border-radius: 24px; border: 1px solid {{accent}}; background: #1a1d1a; color: #e3e6e1; padding: 0 18px; font-size: 16px">
<span style="font-size: 13px; color: #8d948b">{{countText}}</span>
<div style="display: flex; flex-direction: column; background: #1a1d1a; border-radius: 20px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<button class="gl-in" onClick="{{ r.pick }}" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 8px 14px; border: none; border-top: 1px solid #2a2e2a; background: {{r.bg}}; color: #e3e6e1; text-align: left">
<img src="{{r.photo}}" alt="" style="flex: none; width: 56px; height: 56px; border-radius: 14px; object-fit: cover">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 16px">{{r.name}}</span><span style="font-size: 12px; color: #a9b0a7">{{r.meta}}</span><span style="font-size: 11px; color: #8d948b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Photo: {{r.credit}}</span></span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="sown" style="font-size: 13px; color: #a9b0a7">Sown or planted on</label>
<input id="sown" type="date" value="2026-11-23" style="min-height: 44px; border-radius: 12px; border: 1px solid #4a514a; background: #121412; color: #e3e6e1; padding: 0 12px; font-size: 15px">
</div>
<span style="font-size: 13px; color: #a9b0a7">{{chosenText}}</span>
</div>
</x-dc>

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { query: 'bean', chosen: 'mung_bean' }; }
  renderVals() {
    const accent = this.props.accent ?? '#7cc483';
    const motion = this.props.motion ?? true;
    const q = this.state.query.trim().toLowerCase();
    const shown = ALL.filter((c) => !q || c.name.toLowerCase().includes(q) || c.group.toLowerCase().includes(q));
    const chosen = ALL.find((c) => c.id === this.state.chosen);
    return {
      accent, rootClass: motion ? '' : 'gl-still', query: this.state.query,
      setQuery: (e) => this.setState({ query: e.target.value }),
      countText: shown.length + ' of ' + ALL.length + ' crops',
      rows: shown.slice(0, 8).map((c) => ({ ...c, meta: c.group + ' · ' + c.period + ' · ' + c.total + ' days', bg: c.id === this.state.chosen ? '#243324' : 'transparent', pick: () => this.setState({ chosen: c.id }) })),
      chosenText: chosen ? 'Picked: ' + chosen.name + '. Its light hours and watering follow its growth stage from the sowing date.' : ''
    };
  }
}
