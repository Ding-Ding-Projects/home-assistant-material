<style>
body{margin:0}
.m3{--ac:#98CBFF;--s:#51606F;--sc:#D5E4F6;--on-sc:#3A4857;--err:#BA1A1A;--errc:#FFDAD6;--on-errc:#93000A;--surf:#EEF1F6;--sl0:#FFFFFF;--sl1:#F7F9FD;--sl2:#F1F4F9;--sl3:#E9EDF3;--sl4:#E1E5EC;--on:#181C20;--onv:#42474E;--out:#72777F;--outv:#C2C7CF;--inv:#2D3135;--on-inv:#EFF1F6;--amber:#6B5200;--amberc:#FFE08B;--green:#1F6A3B;--greenc:#B6F2BE;--scrim:rgba(24,28,32,.42);--e3:0 4px 8px 3px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.2);--p:color-mix(in srgb,var(--ac) 55%,#00131f);--on-p:#FFFFFF;--pc:color-mix(in srgb,var(--ac) 34%,#FFFFFF);--on-pc:color-mix(in srgb,var(--ac) 30%,#000000);font-family:Roboto,system-ui,sans-serif;color:var(--on);background:var(--surf);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.m3.dark{--s:#B9C8DA;--sc:#3A4857;--on-sc:#D5E4F6;--err:#FFB4AB;--errc:#93000A;--on-errc:#FFDAD6;--surf:#0B0F13;--sl0:#14181D;--sl1:#191D22;--sl2:#1D2126;--sl3:#272B31;--sl4:#32363C;--on:#E0E2E8;--onv:#C2C7CF;--out:#8C9199;--outv:#42474E;--inv:#E0E2E8;--on-inv:#2D3135;--amber:#F2C744;--amberc:#514000;--green:#9BD6A4;--greenc:#005227;--scrim:rgba(0,0,0,.62);--e3:0 6px 16px rgba(0,0,0,.6);--p:var(--ac);--on-p:#071019;--pc:color-mix(in srgb,var(--ac) 30%,#12161A);--on-pc:color-mix(in srgb,var(--ac) 30%,#FFFFFF)}
.m3 *{box-sizing:border-box}
.m3 button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
.m3 input{font:inherit;color:inherit}
.m3 h1,.m3 h2,.m3 p{margin:0}
.m3 :focus-visible{outline:2px solid var(--p);outline-offset:2px}
.ic{width:24px;height:24px;fill:currentColor;flex:none;display:block}
.ic.s{width:20px;height:20px}
.ic.l{width:40px;height:40px}
.tl{font-size:22px;line-height:28px;font-weight:500}
.tm{font-size:16px;line-height:24px;font-weight:500}
.bl{font-size:16px;line-height:24px}
.sub{font-size:13px;line-height:18px;color:var(--onv)}
.lm{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.4px;color:var(--onv)}
.mono{font-family:'Roboto Mono',ui-monospace,Menlo,monospace}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:8px}
.ib{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;color:var(--onv);flex:none;transition:background-color .2s}
.ib:hover{background:var(--sl3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:24px;font-size:14px;font-weight:600;white-space:nowrap;transition:filter .2s,transform .2s cubic-bezier(.2,0,0,1)}
.m3 .btn.fill{background:var(--p);color:var(--on-p)}
.m3 .btn.tonal{background:var(--sc);color:var(--on-sc)}
.m3 .btn.text{color:var(--p);padding:0 14px}
.m3 .btn.off{background:var(--sl4);color:var(--out);cursor:not-allowed}
.btn:hover{filter:brightness(1.07)}
.m3 .chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--outv);color:var(--onv);font-size:14px;font-weight:600;white-space:nowrap;flex:none;position:relative}
.m3 .chip::after{content:"";position:absolute;inset:-6px 0}
.m3 .chip.sel{background:var(--sc);box-shadow:none;color:var(--on-sc)}
.lead{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--sc);color:var(--on-sc);flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 10px;border-radius:12px;background:var(--sl3);color:var(--onv);font-size:12px;line-height:16px;font-weight:600}
.tag.p{background:var(--pc);color:var(--on-pc)}
.tag.g{background:var(--greenc);color:var(--green)}
.tag.e{background:var(--errc);color:var(--on-errc)}
.note{display:flex;gap:12px;padding:12px 14px;border-radius:16px;background:var(--sl2);color:var(--onv);font-size:13px;line-height:18px}
.note.bad{background:var(--errc);color:var(--on-errc)}
.field{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 8px 6px 16px;border-radius:16px;background:var(--sl2);box-shadow:inset 0 -2px 0 var(--out);width:100%}
.field.bad{box-shadow:inset 0 -3px 0 var(--err)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;min-height:44px}
.sk{display:block;border-radius:12px;background:linear-gradient(90deg,var(--sl2) 25%,var(--sl4) 50%,var(--sl2) 75%);background-size:200% 100%;animation:shim 1.4s linear infinite}
.in{animation:rise .35s cubic-bezier(.2,0,0,1) both}
.pop{animation:pop .28s cubic-bezier(.2,0,0,1) both}
.up{animation:up .32s cubic-bezier(.2,0,0,1) both}
.spin{animation:spin 1s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
.lin{height:4px;border-radius:2px;background:var(--sl4);overflow:hidden}
.lin span{display:block;width:36%;height:100%;border-radius:2px;background:var(--p);animation:slide 1.4s cubic-bezier(.4,0,.2,1) infinite}
.ph{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.wd{min-height:var(--wh,860px);position:relative;overflow:hidden;padding:20px clamp(16px,3vw,40px) 32px;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;align-items:center;gap:4px;min-height:64px;padding:8px 8px 8px 4px;flex:none}
.bar h1{flex:1;min-width:0;font-size:22px;line-height:28px;font-weight:500}
.stagebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px 24px;color:var(--onv)}
.stagebox .big{width:72px;height:72px;border-radius:36px;display:grid;place-items:center;background:var(--sl2);color:var(--onv)}
.toast{position:absolute;left:12px;right:12px;bottom:16px;z-index:8;background:var(--inv);color:var(--on-inv);border-radius:16px;padding:10px 6px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--e3)}
.toast .btn.text{color:inherit;text-decoration:underline}
.still *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){.m3 *{animation:none!important;transition:none!important}}
.ph{background:var(--surf)}
.pl{width:844px;height:390px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--surf)}
.dash{position:absolute;inset:0;padding:72px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.pl .dash{grid-template-columns:repeat(4,1fr)}
.dash span{height:84px;border-radius:20px;background:var(--sl2)}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--sl0);border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--e3)}
.grab{width:32px;height:4px;border-radius:2px;background:var(--out);opacity:.5;margin:10px auto;flex:none}
.sbody{flex:1;min-height:0;overflow-y:auto}
.sfoot{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:8px 16px 16px;background:var(--sl0)}
.today{position:absolute;left:8px;top:8px;right:8px;z-index:40;display:flex;align-items:center;gap:6px;flex-wrap:wrap;pointer-events:none}
.today>*{pointer-events:auto}
.today .tag{box-shadow:var(--e3)}
.m3 .mini{min-height:28px;padding:0 10px;border-radius:14px;background:var(--sl3);color:var(--onv);font-size:12px;font-weight:600;position:relative;box-shadow:var(--e3)}
.m3 .mini::after{content:"";position:absolute;inset:-10px -2px}
.m3 .mini.sel{background:var(--pc);color:var(--on-pc)}
.sw{width:52px;height:32px;border-radius:16px;box-shadow:inset 0 0 0 2px var(--out);background:var(--sl4);display:flex;align-items:center;padding:0 8px;flex:none;transition:background-color .2s}
.sw i{display:block;width:16px;height:16px;border-radius:12px;background:var(--out);transition:all .2s cubic-bezier(.2,0,0,1)}
.sw.on{box-shadow:none;background:var(--p);justify-content:flex-end;padding:0 4px}
.sw.on i{width:24px;height:24px;background:var(--on-p)}
.es{--t:48px;--dr:48px;--rr:48px}
.es.old{--t:44px;--dr:40px;--rr:44px}
.ehd{display:flex;align-items:center;gap:12px;padding:0 4px 4px 16px;min-height:56px;flex:none}
.ehd h1{overflow-wrap:anywhere}
.tilei{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--pc);color:var(--on-pc);transition:all .2s}
.ebd{padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px}
.foot{flex:none;padding:8px 12px 8px;box-shadow:0 -1px 0 var(--outv);background:var(--sl0)}
.ftabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.ftabs::-webkit-scrollbar{display:none}
.m3 .ftab{flex:1 0 auto;min-width:48px;min-height:48px;padding:0 10px;border-radius:24px;font-size:14px;font-weight:500;color:var(--on);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap;line-height:1.2;transition:background-color .2s}
.ftab .alt{font-size:12px;font-weight:400;opacity:.8}
.m3 .ftab.sel{background:var(--inv);color:var(--on-inv)}
.old .ftabs{overflow:visible}
.m3 .old .ftab{flex:1 1 0;min-width:0;padding:0 4px}
.px{font-size:11px;line-height:14px;font-weight:600;color:var(--out);text-align:center;padding-top:4px}
.twrap{position:absolute;left:12px;right:12px;bottom:16px;z-index:50;display:flex;justify-content:center;pointer-events:none}
.twrap .toast{position:static;width:min(420px,100%);pointer-events:auto;min-height:48px}
.shows .ta{outline:2px dashed var(--amber);outline-offset:-2px}
.vstate{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.vstate .big{font-size:40px;line-height:48px;font-weight:400}
.modes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.m3 .mode{width:56px;height:56px;border-radius:28px;display:grid;place-items:center;background:var(--sl2);color:var(--on);transition:background-color .2s}
.m3 .mode.sel{background:var(--pc);color:var(--on-pc)}
.segmented{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:4px;border-radius:28px;background:var(--sl3);align-self:center;max-width:100%}
.m3 .segmented button{color:var(--onv);font-weight:500;font-size:14px;padding:8px 16px;min-height:var(--t);border-radius:24px;transition:background-color .2s}
.m3 .segmented button[aria-pressed="true"]{background:var(--sl0);color:var(--on);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-self:center}
.m3 .vchip{display:inline-flex;align-items:center;gap:8px;min-height:var(--t);padding:0 16px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--outv);color:var(--on);font-weight:500;font-size:14px;transition:background-color .2s}
.m3 .vchip[aria-pressed="true"]{background:var(--pc);color:var(--on-pc);box-shadow:none}
.m3 .old .vchip[aria-pressed="true"]{background:rgba(3,169,244,.2);color:var(--on)}
.bslide{height:56px;border-radius:20px;background:var(--sl3);position:relative;overflow:hidden;flex:1;min-width:0}
.bslide b{position:absolute;left:0;top:0;bottom:0;border-radius:20px;background:var(--p)}
.bslide b::after{content:"";position:absolute;right:8px;top:16px;bottom:16px;width:4px;border-radius:2px;background:rgba(0,0,0,.5)}
.bslide input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}

.favhd{display:flex;align-items:center;gap:8px;min-height:48px}
.favhd .lm{flex:1}
.favs{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;max-width:250px;align-self:center;user-select:none}
.fav{position:relative;display:block}
.fav.shake{animation:shake .45s linear infinite}
.fav.shake:nth-child(3n+1){animation-delay:.15s}
.fav.shake:nth-child(3n+2){animation-delay:.3s}
@keyframes shake{0%{transform:rotateZ(0deg) translateX(-1px)}20%{transform:rotateZ(-3deg)}40%{transform:rotateZ(0deg) translateX(1px)}60%{transform:rotateZ(3deg)}100%{transform:rotateZ(0deg) translateX(-1px)}}
.m3 .fbub{display:block;width:48px;height:48px;border-radius:24px;box-shadow:inset 0 0 0 1px var(--outv);transition:transform .2s cubic-bezier(.2,0,0,1)}
.m3 .fbub[aria-pressed="true"]{box-shadow:0 0 0 2px var(--sl0),0 0 0 4px var(--on)}
.m3 .fdel{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:8px;background:var(--sl4);color:var(--on);display:grid;place-items:center;z-index:1;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.fdel .ic{width:16px;height:16px;pointer-events:none}
.fdel::before{content:"";position:absolute;inset:-12px}
.m3 .old .fdel{width:20px;height:20px;z-index:auto;box-shadow:none}
.old .fdel .ic{width:12px;height:12px}
.old .fdel::before{inset:0}
.shows .fdel::before{outline:2px dashed var(--amber)}
.m3 .obtn{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--out);color:var(--on)}
.femp{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:8px 16px;color:var(--onv)}
</style>
</helmet>
<div class="{{shell}}" style="--ac: {{accent}}">
<div class="{{root}}">
<div class="today"><sc-if value="{{isBefore}}" hint-placeholder-val="{{ false }}"><span class="tag e">Today</span><span class="tag">{{todayText}}</span></sc-if><sc-for list="{{minis}}" as="m" hint-placeholder-count="2"><button class="{{m.cls}}" aria-pressed="{{m.aria}}" onClick="{{ m.pick }}">{{m.name}}</button></sc-for></div>

</div>
<div class="sbody ebd" role="tabpanel" tabindex="0">
<div class="hrow"><div class="bslide"><b style="{{briStyle}}"></b><input type="range" min="1" max="100" value="{{bri}}" onInput="{{ setBri }}" aria-label="Brightness"/></div></div>

<sc-if value="{{hasFavs}}" hint-placeholder-val="{{ true }}">
<div class="favs" role="group" aria-label="Favourite colours">
<sc-for list="{{favs}}" as="f" hint-placeholder-count="8"><div class="{{f.wrap}}"><button class="fbub" style="{{f.style}}" aria-label="{{f.label}}" aria-pressed="{{f.aria}}" onClick="{{ f.pick }}"></button><sc-if value="{{f.edit}}" hint-placeholder-val="{{ true }}"><button class="fdel" aria-label="{{f.delLabel}}" title="{{f.delLabel}}" onClick="{{ f.del }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M19,13H5V11H19V13Z"></path></svg></button></sc-if></div></sc-for>

</div>
<sc-if value="{{isEdit}}" hint-placeholder-val="{{ true }}"><span class="sub" style="text-align: center">Tap the minus badge to remove a colour. Drag a colour to move it.</span></sc-if>
</sc-if>
<sc-if value="{{noFavs}}" hint-placeholder-val="{{ false }}"><div class="femp"><span class="bl" style="color: var(--on)">No favourite colours yet</span><span class="sub">Pick a colour, then save it here to get back to it with one tap.</span><button class="btn tonal" onClick="{{ add }}"><svg class="ic s" aria-hidden="true" viewBox="0 0 24 24"><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"></path></svg>Add the current colour</button></div></sc-if>
</div>
<div class="foot">
<div class="ftabs" role="tablist" aria-label="Sections">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button class="{{t.cls}}" role="tab" aria-selected="{{t.aria}}" onClick="{{ t.pick }}"><span>{{t.main}}</span><sc-if value="{{t.hasAlt}}" hint-placeholder-val="{{ false }}"><span class="alt">{{t.alt}}</span></sc-if></button></sc-for>
</div>
<sc-if value="{{hasSize}}" hint-placeholder-val="{{ false }}"><div class="px" aria-hidden="true">{{sizeText}}</div></sc-if>
</div>
</div>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="twrap"><div class="toast up" role="status"><span style="flex: 1">{{toast}}</span></div></div></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#98CBFF","options":["#98CBFF","#9BD6A4","#F2C744","#D4BEE6"]},"motion":{"editor":"boolean","default":true},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"stage":{"editor":"enum","default":"after","options":["after","view","empty","before"]},"$preview":{"width":390,"height":844}}'>
const MDI = {"mdiLightbulb":"M12,2A7,7 0 0,0 5,9C5,11.38 6.19,13.47 8,14.74V17A1,1 0 0,0 9,18H15A1,1 0 0,0 16,17V14.74C17.81,13.47 19,11.38 19,9A7,7 0 0,0 12,2M9,21A1,1 0 0,0 10,22H14A1,1 0 0,0 15,21V20H9V21Z"};
const DEFAULT_STAGE = 'after';
const FAVS = [['Warm white', '#FFD9A8'], ['Daylight', '#F2F6FF'], ['Sunset', '#FF8A4C'], ['Rose', '#F26B8A'], ['Violet', '#9B7BEA'], ['Sky', '#5DB7F5'], ['Mint', '#6FD6A6'], ['Lime', '#C7E05A']];
const EXTRA = [['Amber', '#FFB300'], ['Teal', '#2BB5A8'], ['Coral', '#FF6F61']];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 0 }; this._p = null; this._s = DEFAULT_STAGE; this.toast = ''; this.reset(DEFAULT_STAGE); }

  base() {
    const accent = this.props.accent ?? '#98CBFF';
    const motion = this.props.motion ?? true;
    const theme = this.props.theme ?? 'dark';
    return { accent, shell: 'm3' + (theme === 'dark' ? ' dark' : '') + (motion ? '' : ' still') };
  }
  bump() { this.setState({ n: this.state.n + 1 }); }
  stage() {
    const p = this.props.stage ?? DEFAULT_STAGE;
    if (p !== this._p) { this._p = p; this._s = p; this.reset(p); }
    return this._s;
  }
  go(s) { this._s = s; this.reset(s); this.bump(); }
  say(t) { this.toast = t; this.bump(); clearTimeout(this._tt); this._tt = setTimeout(() => { this.toast = ''; this.bump(); }, 3600); }
  minis(list) { return list.map((m) => ({ name: m[0], cls: m[1] ? 'mini sel' : 'mini', aria: m[1] ? 'true' : 'false', pick: m[2] })); }
  flip(k) { return () => { this[k] = !this[k]; this.bump(); }; }
  head(v, title, stateText, icon, style) {
    Object.assign(v, { title, stateText, tileIcon: icon, tileStyle: style || '', toast: this.toast || '', hasToast: !!this.toast,
      moreAct: () => this.say('More actions open here'), closeAct: () => this.say('The sheet closes here') });
  }
  plainTabs(names) { return names.map((n, i) => ({ main: n, alt: '', hasAlt: false, cls: i === 0 ? 'ftab sel' : 'ftab', aria: i === 0 ? 'true' : 'false', pick: () => { if (i) this.say(n + ' is drawn on the tabs and rows board'); } })); }

  reset(s) { this.favs = s === 'empty' ? [] : FAVS.slice(); this.edit = s === 'after' || s === 'before'; this.sel = 'Warm white'; this.hex = '#FFD9A8'; this.bri = 71; this.show = s === 'after' || s === 'before'; this.added = 0; this.toast = ''; }
  renderVals() {
    const v = this.base();
    const s = this.stage();
    const old = s === 'before';
    const ed = this.edit && this.favs.length > 0;
    this.head(v, 'Ceiling lights', 'On · ' + this.bri + '% · ' + (this.sel || 'Custom colour'), MDI.mdiLightbulb, 'background: color-mix(in srgb, ' + this.hex + ' 26%, transparent); color: ' + this.hex);
    return Object.assign(v, {
      root: 'ph es' + (old ? ' old' : '') + (this.show ? ' shows' : ''), isBefore: old,
      todayText: 'The remove badge is a 20 px button with a 12 px icon.',
      minis: this.minis([['Touch areas', this.show, this.flip('show')]]),
      bri: String(this.bri), briStyle: 'width: ' + this.bri + '%; background: ' + this.hex,
      setBri: (e) => { this.bri = Number(e.target.value); this.bump(); },
      power: () => this.say('Ceiling lights turned off'),
      hasFavs: this.favs.length > 0, noFavs: this.favs.length === 0, isEdit: ed, canEdit: !ed && this.favs.length > 0,
      startEdit: () => { this.edit = true; this.bump(); }, done: () => { this.edit = false; this.bump(); },
      add: () => {
        const n = EXTRA[this.added % EXTRA.length]; this.added++;
        if (this.favs.some((f) => f[0] === n[0])) { this.say(n[0] + ' is already saved'); return; }
        this.favs = this.favs.concat([n]); this.sel = n[0]; this.hex = n[1]; this.edit = true; this.say('Saved ' + n[0]);
      },
      favs: this.favs.map((f) => ({
        wrap: ed ? 'fav shake' : 'fav', style: 'background: ' + f[1], label: f[0], aria: !ed && this.sel === f[0] ? 'true' : 'false', edit: ed,
        delLabel: 'Remove ' + f[0],
        pick: () => { if (this.edit && this.favs.length) { this.say('In edit mode a colour can be moved or removed'); return; } this.sel = f[0]; this.hex = f[1]; this.bump(); },
        del: () => { this.favs = this.favs.filter((x) => x[0] !== f[0]); if (!this.favs.length) this.edit = false; this.say('Removed ' + f[0]); }
      })),
      tabs: this.plainTabs(['Overview', 'History', 'Settings', 'Related']),
      hasSize: old || this.show,
      sizeText: old ? 'Remove badge 20 px, touch area 20 px, under the colour bubble' : 'Remove badge 24 px, touch area 48 px, above the colour bubble'
    });
  }
}
</script>
</body>
</html>
