const NUMS = [['wait', 'Wait before reminding again', 0, 86400, 0.5, 's', 'Between 0 and 86400 seconds.'], ['low', 'Lowest reading to accept', -273.15, 100, 0.01, '°C', 'Readings below this are treated as a broken sensor.'], ['port', 'Port of the door controller', 0, 65535, 1, '', 'Between 0 and 65535.']];

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 0 }; this._p = null; this._s = 'after'; this.sq = {}; this.wb = null; this.reset('after'); }

  base() {
    const accent = this.props.accent ?? '#98CBFF';
    const motion = this.props.motion ?? true;
    const theme = this.props.theme ?? 'dark';
    return { accent, shell: 'm3' + (theme === 'dark' ? ' dark' : '') + (motion ? '' : ' still') };
  }
  bump() { this.setState({ n: this.state.n + 1 }); }
  stage() {
    const p = this.props.stage ?? 'after';
    if (p !== this._p) { this._p = p; this._s = p; this.reset(p); }
    return this._s;
  }
  go(s) { this._s = s; this.reset(s); this.bump(); }

reset(s) { this.items = s === 'empty' ? [] : BUTTONS0.slice(); this.nums = Object.assign({}, NUM0); }

  objRows(old) {
    return this.items.map((b, i) => {
      const label = b[0] + ' · ' + b[1] + ' · ' + b[2];
      return { label, desc: b[3], cls: old ? 'orow old' : 'orow', tipL: old ? '' : label, tipD: old ? '' : b[3], editLabel: 'Edit ' + b[0], delLabel: 'Delete ' + b[0],
        del: () => { this.items = this.items.filter((x, j) => j !== i); this.bump(); } };
    });
  }
  numRows(old) {
    return NUMS.map((n) => {
      const val = this.nums[n[0]];
      const set = (e) => { const m = Object.assign({}, this.nums); m[n[0]] = e.target.value; this.nums = m; this.bump(); };
      const f = parseFloat(val);
      return { label: n[1], help: n[6], unit: n[5], min: String(n[2]), max: String(n[3]), step: String(n[4]), val, range: isNaN(f) ? String(n[2]) : String(f), cls: old ? 'nin old' : 'nin', set, slide: set, inLabel: n[1] + ', typed value', slLabel: n[1] + ', slider' };
    });
  }

renderVals() {
    const v = this.base();
    const s = this.stage();
    const old = s === 'before';
    return Object.assign(v, {
      isOld: old, hasItems: this.items.length > 0, noItems: this.items.length === 0,
      items: this.objRows(old), nums: this.numRows(old),
      addItem: () => { this.items = this.items.concat([BUTTON_NEW]); this.bump(); }
    });
  }
}
