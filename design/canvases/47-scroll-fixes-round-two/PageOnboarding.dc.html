.obh{color:var(--onv);font-size:14px;line-height:20px;font-weight:500;margin-bottom:12px}
.stp{list-style:none;display:grid;grid-template-columns:1fr;gap:4px;margin:0 0 20px;padding:0}
.stp.old{grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-bottom:24px}
.sti{display:flex;align-items:center;gap:12px;min-width:0;min-height:48px;padding:6px 10px;border-radius:16px;color:var(--onv);text-align:start}
.stp.old .sti{flex-direction:column;text-align:center;gap:8px;padding:8px;min-height:0}
.sti.current{background:var(--sl2);color:var(--on)}
.mk{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:14px;border:2px solid var(--p);color:var(--p);font-size:14px;font-weight:500}
.mk .ic{width:18px;height:18px}
.sti.done .mk{background:var(--p);color:var(--on-p)}
.sti.current .mk{background:var(--on);border-color:var(--on);color:var(--sl0)}
.stx{display:flex;flex-direction:column;min-width:0;flex:1}
.stp.old .stx{flex:none;max-width:100%}
.snm{font-size:14px;line-height:20px;font-weight:500;overflow-wrap:break-word}
.stp.old .snm{overflow-wrap:anywhere}
.sst{font-size:12px;line-height:16px;color:var(--onv)}
.ssum{font-size:12px;line-height:16px;color:var(--onv);overflow-wrap:anywhere}
.stp.old .ssum{display:none}
.lockn{margin:-8px 0 16px!important;color:var(--onv);font-size:13px;line-height:18px}
.stp.old + .lockn{margin-top:-12px!important;font-size:14px;line-height:20px}
.obt{font-size:22px;line-height:28px;font-weight:500;margin:0 0 4px}
.obform{display:flex;flex-direction:column;gap:12px}
.ofl{display:flex;flex-direction:column;gap:2px;min-height:56px;padding:8px 16px;border-radius:16px;background:var(--sl2);box-shadow:inset 0 -1px 0 var(--out);justify-content:center}
.ofl .lm{font-weight:500;letter-spacing:0}
.ofl input{border:0;background:transparent;outline:none;font-size:16px;line-height:24px;min-height:24px;padding:0;width:100%}
.ofl:focus-within{box-shadow:inset 0 -2px 0 var(--p)}
.dvr{display:flex;align-items:center;gap:12px;min-height:56px}
.oba{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.savedn{color:var(--onv);font-size:13px;line-height:18px;margin-top:12px!important}
.obfoot{padding-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.lpw{position:relative;flex:1;min-width:0;display:flex}
.m3 .lp{display:flex;align-items:center;gap:8px;width:min(100%,240px);min-height:48px;padding:0 8px 0 16px;border-radius:24px;background:var(--sl2);font-size:16px;color:var(--on)}
.m3 .lp.old{width:200px;min-height:40px;height:40px;border-radius:4px;overflow:hidden;padding:0 4px 0 12px}
.lp .lv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmenu{position:absolute;left:0;bottom:calc(100% + 6px);z-index:6;width:min(100%,240px);max-height:280px;overflow-y:auto}
.m3 .oblink{color:var(--on);font-size:14px;min-height:48px;display:inline-flex;align-items:center;padding:0 8px;border-radius:24px;flex:none}
.m3 .oblink.old{min-height:0;padding:0;margin-right:16px}
.okbig{width:72px;height:72px;border-radius:36px;display:grid;place-items:center;background:var(--greenc);color:var(--green);margin:8px auto}
</style>
</helmet>
<div class="{{shell}}" style="--ac: {{accent}}">
<div class="ph">
<div class="sbar"><span>19:49</span><span class="mid"><sc-if value="{{isOld}}" hint-placeholder-val="{{ false }}"><span class="tag td">Today</span></sc-if></span><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12,21L15.6,16.2C14.6,15.45 13.35,15 12,15C10.65,15 9.4,15.45 8.4,16.2L12,21M12,3C7.95,3 4.21,4.34 1.2,6.6L3,9C5.5,7.12 8.62,6 12,6C15.38,6 18.5,7.12 21,9L22.8,6.6C19.79,4.34 16.05,3 12,3M12,9C9.3,9 6.81,9.89 4.8,11.4L6.6,13.8C8.1,12.67 9.97,12 12,12C14.03,12 15.9,12.67 17.4,13.8L19.2,11.4C17.19,9.89 14.7,9 12,9Z"></path></svg><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M16,10H8V6H16M16.67,4H15V2H9V4H7.33A1.33,1.33 0 0,0 6,5.33V20.67C6,21.4 6.6,22 7.33,22H16.67A1.33,1.33 0 0,0 18,20.67V5.33C18,4.6 17.4,4 16.67,4Z"></path></svg></div>
<sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}"><div class="lin obl" role="progressbar" aria-label="Saving this step"><span></span></div></sc-if>
<div class="obscr" tabindex="0" role="region" aria-label="Set up Home Assistant">
<div class="obcard">
<div class="obh" role="status">{{stepOf}}</div>
<ol class="{{stpCls}}" aria-label="{{stepsLabel}}">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<li class="{{s.cls}}" aria-current="{{s.cur}}">
<span class="mk" aria-hidden="true"><sc-if value="{{s.done}}" hint-placeholder-val="{{ false }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z"></path></svg></sc-if><sc-if value="{{s.open}}" hint-placeholder-val="{{ true }}">{{s.n}}</sc-if></span>
<span class="stx"><span class="snm">{{s.name}}</span><span class="sst">{{s.state}}</span><sc-if value="{{s.hasSum}}" hint-placeholder-val="{{ false }}"><span class="ssum">{{s.sum}}</span></sc-if></span>
</li>
</sc-for>
</ol>
<p class="lockn">{{locked}}</p>
<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<div class="obform in">
<h1 class="obt">{{title}}</h1>
<p class="sub">{{hint}}</p>
<label class="ofl"><span class="lm">{{lblName}}</span><input type="text" value="{{home}}" onInput="{{ setHome }}" autocomplete="off"/></label>
<div class="ofl"><span class="lm">{{lblCountry}}</span><span class="bl">Canada</span></div>
<div class="ofl"><span class="lm">{{lblZone}}</span><span class="bl">Toronto · 19:49</span></div>
<div class="oba"><button class="btn fill" onClick="{{ next }}">{{nextText}}</button></div>
</div>
</sc-if>
<sc-if value="{{isDevices}}" hint-placeholder-val="{{ false }}">
<div class="obform in">
<h1 class="obt">{{title}}</h1>
<p class="sub">{{hint}}</p>
<sc-for list="{{found}}" as="d" hint-placeholder-count="3"><div class="dvr"><span class="lead"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="{{d.icon}}"></path></svg></span><span class="grow"><span class="bl">{{d.name}}</span><span class="sub">{{d.meta}}</span></span></div></sc-for>
<div class="oba"><button class="btn fill" onClick="{{ next }}">{{nextText}}</button></div>
</div>
</sc-if>
<sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
<div class="obform in" style="text-align: center">
<span class="okbig pop"><svg class="ic l" aria-hidden="true" viewBox="0 0 24 24"><path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z"></path></svg></span>
<h1 class="obt">{{title}}</h1>
<p class="sub">{{hint}}</p>
<div class="oba" style="justify-content: center"><button class="btn tonal" onClick="{{ again }}">{{againText}}</button></div>
</div>
</sc-if>
<sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
<div class="obform" aria-busy="true">
<span class="sub" role="status">Saving your home. This takes a moment.</span>
<span class="sk" style="height: 28px; width: 70%"></span>
<span class="sk" style="height: 56px; border-radius: 16px"></span>
<span class="sk" style="height: 56px; border-radius: 16px"></span>
<span class="sk" style="height: 56px; border-radius: 16px"></span>
</div>
</sc-if>
<p class="savedn">{{saved}}</p>
<div class="obfoot">
<div class="lpw">
<button class="{{lpCls}}" aria-haspopup="listbox" aria-expanded="{{langAria}}" aria-label="{{langLabel}}" onClick="{{ toggleLang }}"><svg class="ic s" aria-hidden="true" viewBox="0 0 24 24"><path d="M12.87,15.07L10.33,12.56L10.36,12.53C12.1,10.59 13.34,8.36 14.07,6H17V4H10V2H8V4H1V6H12.17C11.5,7.92 10.44,9.75 9,11.35C8.07,10.32 7.3,9.19 6.69,8H4.69C5.42,9.63 6.42,11.17 7.67,12.56L2.58,17.58L4,19L9,14L12.11,17.11L12.87,15.07M18.5,10H16.5L12,22H14L15.12,19H19.87L21,22H23L18.5,10M15.88,17L17.5,12.67L19.12,17H15.88Z"></path></svg><span class="lv">{{langName}}</span><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M7,10L12,15L17,10H7Z"></path></svg></button>
<sc-if value="{{langOpen}}" hint-placeholder-val="{{ false }}"><div class="menu pop lmenu" role="listbox" aria-label="Language"><sc-for list="{{langs}}" as="g" hint-placeholder-count="5"><button class="{{g.cls}}" role="option" aria-selected="{{g.aria}}" onClick="{{ g.pick }}">{{g.name}}</button></sc-for></div></sc-if>
</div>
<button class="{{linkCls}}">{{help}}</button>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#98CBFF","options":["#98CBFF","#9BD6A4","#F2C744","#D4BEE6"]},"motion":{"editor":"boolean","default":true},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"stage":{"editor":"enum","default":"after","options":["after","before","language","loading"]},"$preview":{"width":390,"height":844}}'>
// Sample wording in two languages. The longer German step names are what break in the middle of a word today.
const TEXT = {
  en: {
    stepOf: 'Step {c} of 3', stepsLabel: 'Setup steps',
    steps: ['Your account', 'Your home', 'Devices'],
    states: { done: 'Done', current: 'Current', todo: 'To do' },
    sums: ['Alex Sample · alex', '{home} · Canada · 24-hour clock', '3 devices added'],
    locked: 'Finished steps are saved and cannot be changed here. You can change them later in Settings.',
    titles: ['', 'Name your home', 'Add your devices', 'You are all set'],
    hints: ['', 'The name shows on dashboards and in notifications. The location is used for sunrise, sunset and the weather.', 'These were found on your network. You can add more at any time from Settings.', 'Home Assistant is ready. Your steps are saved.'],
    lblName: 'Home name', lblCountry: 'Country', lblZone: 'Time zone and local time',
    next: 'Next', finish: 'Finish', again: 'Show the steps again',
    saved: 'Saved. Close this window any time and setup resumes at this step.', help: 'Help', langLabel: 'Language'
  },
  de: {
    stepOf: 'Schritt {c} von 3', stepsLabel: 'Einrichtungsschritte',
    steps: ['Ihr Benutzerkonto', 'Ihr Zuhause', 'Geräteverwaltung'],
    states: { done: 'Erledigt', current: 'Aktuell', todo: 'Offen' },
    sums: ['Alex Sample · alex', '{home} · Kanada · 24-Stunden-Uhr', '3 Geräte hinzugefügt'],
    locked: 'Abgeschlossene Schritte sind gespeichert und können hier nicht geändert werden. Später geht das in den Einstellungen.',
    titles: ['', 'Benennen Sie Ihr Zuhause', 'Geräte hinzufügen', 'Alles ist bereit'],
    hints: ['', 'Der Name erscheint auf Dashboards und in Benachrichtigungen. Der Standort dient für Sonnenaufgang, Sonnenuntergang und Wetter.', 'Diese Geräte wurden in Ihrem Netzwerk gefunden. Weitere lassen sich jederzeit in den Einstellungen hinzufügen.', 'Home Assistant ist bereit. Ihre Schritte sind gespeichert.'],
    lblName: 'Name des Zuhauses', lblCountry: 'Land', lblZone: 'Zeitzone und Ortszeit',
    next: 'Weiter', finish: 'Fertig', again: 'Schritte noch einmal zeigen',
    saved: 'Gespeichert. Schließen Sie das Fenster jederzeit, die Einrichtung geht bei diesem Schritt weiter.', help: 'Hilfe', langLabel: 'Sprache'
  }
};
const LANGS = [['en', 'English'], ['de', 'Deutsch'], ['nl', 'Nederlands'], ['fr', 'Français'], ['es', 'Español']];
const FOUND = [
  ['Living room speaker', 'Media player', 'M12,12A3,3 0 0,0 9,15A3,3 0 0,0 12,18A3,3 0 0,0 15,15A3,3 0 0,0 12,12M12,20A5,5 0 0,1 7,15A5,5 0 0,1 12,10A5,5 0 0,1 17,15A5,5 0 0,1 12,20M12,4A2,2 0 0,1 14,6A2,2 0 0,1 12,8C10.89,8 10,7.1 10,6C10,4.89 10.89,4 12,4M17,2H7C5.89,2 5,2.89 5,4V20A2,2 0 0,0 7,22H17A2,2 0 0,0 19,20V4C19,2.89 18.1,2 17,2Z'],
  ['Hallway light bridge', '4 lights', 'M12,2A7,7 0 0,1 19,9C19,11.38 17.81,13.47 16,14.74V17A1,1 0 0,1 15,18H9A1,1 0 0,1 8,17V14.74C6.19,13.47 5,11.38 5,9A7,7 0 0,1 12,2M9,21V20H15V21A1,1 0 0,1 14,22H10A1,1 0 0,1 9,21M12,4A5,5 0 0,0 7,9C7,11.05 8.23,12.81 10,13.58V16H14V13.58C15.77,12.81 17,11.05 17,9A5,5 0 0,0 12,4Z'],
  ['Kitchen thermostat', 'Climate', 'M15 13V5A3 3 0 0 0 9 5V13A5 5 0 1 0 15 13M12 4A1 1 0 0 1 13 5V8H11V5A1 1 0 0 1 12 4Z']
];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 0 }; this._p = null; this._s = 'after'; this.lang = 'en'; this.step = 1; this.langOpen = false; this.home = 'Sample House'; }
  base() {
    const accent = this.props.accent ?? '#98CBFF';
    const motion = this.props.motion ?? true;
    const theme = this.props.theme ?? 'dark';
    return { accent, shell: 'm3' + (theme === 'dark' ? ' dark' : '') + (motion ? '' : ' still') };
  }
  bump() { this.setState({ n: this.state.n + 1 }); }
  stage() {
    const p = this.props.stage ?? 'after';
    if (p !== this._p) { this._p = p; this._s = p; this.reset(p); }
    return this._s;
  }
  go(s) { this._s = s; this.reset(s); this.bump(); }
  reset(s) { this.lang = s === 'before' ? 'de' : 'en'; this.step = 1; this.langOpen = s === 'language'; this.home = 'Sample House'; }
  renderVals() {
    const v = this.base();
    const s = this.stage();
    const old = s === 'before';
    const loading = s === 'loading';
    const t = TEXT[this.lang] || TEXT.en;
    const step = this.step;
    const steps = t.steps.map((name, i) => {
      const st = i < step ? 'done' : i === step ? 'current' : 'todo';
      const sum = st === 'done' ? t.sums[i].replace('{home}', this.home || 'Home') : '';
      return { cls: 'sti ' + st, cur: st === 'current' ? 'step' : 'false', done: st === 'done', open: st !== 'done', n: String(i + 1), name, state: t.states[st], hasSum: !!sum, sum };
    });
    const langName = (LANGS.find((g) => g[0] === this.lang) || LANGS[0])[1];
    return Object.assign(v, {
      isOld: old, isLoading: loading,
      stepOf: t.stepOf.replace('{c}', String(Math.min(step + 1, 3))), stepsLabel: t.stepsLabel,
      stpCls: old ? 'stp old' : 'stp', steps, locked: t.locked,
      isHome: !loading && step === 1, isDevices: !loading && step === 2, isDone: !loading && step === 3,
      title: t.titles[step], hint: t.hints[step],
      lblName: t.lblName, lblCountry: t.lblCountry, lblZone: t.lblZone,
      home: this.home, setHome: (e) => { this.home = e.target.value; this.bump(); },
      nextText: step === 2 ? t.finish : t.next,
      next: () => { this.step = Math.min(3, this.step + 1); this.langOpen = false; this.bump(); },
      againText: t.again, again: () => { this.step = 1; this.bump(); },
      found: FOUND.map((d) => ({ name: d[0], meta: d[1], icon: d[2] })),
      saved: t.saved, help: t.help, linkCls: old ? 'oblink old' : 'oblink',
      lpCls: old ? 'lp old' : 'lp', langLabel: t.langLabel + ': ' + langName, langName,

      toggleLang: () => { this.langOpen = !this.langOpen; this.bump(); },
      langs: LANGS.map((g) => ({ name: g[1], cls: g[0] === this.lang ? 'mi sel' : 'mi', aria: g[0] === this.lang ? 'true' : 'false', pick: () => { this.lang = g[0]; this.langOpen = false; this.bump(); } }))
    });
  }
}
</script>
