<div class="fgrp"><span class="flab">Shown under the name</span><div class="{{contF.cls}}"><span class="cs"><sc-for list="{{contF.chips}}" as="c" hint-placeholder-count="2"><span class="ich"><span class="lt">{{c.name}}</span><button class="x" aria-label="{{c.rmLabel}}" onClick="{{ c.rm }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"></path></svg></button></span></sc-for><sc-if value="{{contF.empty}}" hint-placeholder-val="{{ false }}"><span class="ph2">Nothing is shown</span></sc-if><sc-if value="{{contF.canAdd}}" hint-placeholder-val="{{ true }}"><button class="ich add" aria-label="{{contF.addLabel}}" onClick="{{ contF.add }}"><svg class="ic s" aria-hidden="true" viewBox="0 0 24 24"><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"></path></svg>Add</button></sc-if></span><button class="rst" aria-label="Restore the default content" title="Restore the default content" onClick="{{ contF.restore }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M13,3A9,9 0 0,0 4,12H1L4.89,15.89L4.96,16.03L9,12H6A7,7 0 0,1 13,5A7,7 0 0,1 20,12A7,7 0 0,1 13,19C11.07,19 9.32,18.21 8.06,16.94L6.64,18.36C8.27,20 10.5,21 13,21A9,9 0 0,0 22,12A9,9 0 0,0 13,3Z"></path></svg></button></div><span class="sub">For example: 21.4 °C · 5 minutes ago</span></div>
<div>
<span class="{{slabCls}}">Statistics to include</span>
<sc-for list="{{stats}}" as="t" hint-placeholder-count="2"><div class="pf spk"><span class="txt"><span class="bl">{{t.name}}</span><span class="sub mono">{{t.id}}</span></span><button class="ib" aria-label="{{t.rmLabel}}" onClick="{{ t.rm }}"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"></path></svg></button></div></sc-for>
<sc-if value="{{canAddStat}}" hint-placeholder-val="{{ true }}"><button class="pf spk" aria-haspopup="dialog" onClick="{{ addStat }}"><span class="txt"><span class="bl" style="color: var(--onv)">Add a statistic</span></span><span class="ib"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M7,10L12,15L17,10H7Z"></path></svg></span></button></sc-if>
<span class="sub" style="display: block; margin-top: 8px">{{statNote}}</span>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#98CBFF","options":["#98CBFF","#9BD6A4","#F2C744","#D4BEE6"]},"motion":{"editor":"boolean","default":true},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"stage":{"editor":"enum","default":"after","options":["after","before","empty"]},"$preview":{"width":390,"height":844}}'>
const NAME_OPTS = ['Device name', 'Entity name', 'Area name', 'Floor name'];
const NAME0 = ['Area name', 'Device name', 'Entity name'];
const CONTENT_OPTS = ['State', 'Last changed', 'Last updated', 'Battery level'];
const CONTENT0 = ['State', 'Last changed'];
const STATS = [['Home energy used', 'sensor.home_energy_used'], ['Solar energy produced', 'sensor.solar_energy_produced'], ['Car charger energy', 'sensor.car_charger_energy'], ['Heat pump energy', 'sensor.heat_pump_energy']];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 0 }; this._p = null; this._s = 'after'; this.sq = {}; this.wb = null; this.reset('after'); }

  base() {
    const accent = this.props.accent ?? '#98CBFF';
    const motion = this.props.motion ?? true;
    const theme = this.props.theme ?? 'dark';
    return { accent, shell: 'm3' + (theme === 'dark' ? ' dark' : '') + (motion ? '' : ' still') };
  }
  bump() { this.setState({ n: this.state.n + 1 }); }
  stage() {
    const p = this.props.stage ?? 'after';
    if (p !== this._p) { this._p = p; this._s = p; this.reset(p); }
    return this._s;
  }
  go(s) { this._s = s; this.reset(s); this.bump(); }

reset(s) { const e = s === 'empty'; this.nameV = e ? [] : NAME0.slice(); this.contV = e ? [] : CONTENT0.slice(); this.stats = e ? [] : [0, 1]; this.tg = false; }

  chipField(id, opts, base, old) {
    const cur = this[id];
    const next = opts.filter((o) => cur.indexOf(o) < 0)[0];
    return {
      cls: old ? 'nf old' : 'nf', empty: cur.length === 0, canAdd: !!next, addLabel: next ? 'Add ' + next : '',
      add: () => { if (next) { this[id] = cur.concat([next]); this.bump(); } },
      restore: () => { this[id] = base.slice(); this.bump(); },
      chips: cur.map((c) => ({ name: c, rmLabel: 'Remove ' + c, rm: () => { this[id] = this[id].filter((x) => x !== c); this.bump(); } }))
    };
  }

renderVals() {
    const v = this.base();
    const s = this.stage();
    const old = s === 'before';
    const free = STATS.map((x, i) => i).filter((i) => this.stats.indexOf(i) < 0);
    return Object.assign(v, {
      isOld: old, formCls: this.tg ? 'form tg' : 'form',
      tgCls: this.tg ? 'chip sel tgl' : 'chip tgl', tgAria: this.tg ? 'true' : 'false', tgToggle: () => { this.tg = !this.tg; this.bump(); },
      nameF: this.chipField('nameV', NAME_OPTS, NAME0, old), contF: this.chipField('contV', CONTENT_OPTS, CONTENT0, old),
      slabCls: old ? 'slab' : 'slab fix',
      stats: this.stats.map((i) => ({ name: STATS[i][0], id: STATS[i][1], rmLabel: 'Remove ' + STATS[i][0], rm: () => { this.stats = this.stats.filter((x) => x !== i); this.bump(); } })),
      canAddStat: free.length > 0, addStat: () => { if (free.length) { this.stats = this.stats.concat([free[0]]); this.bump(); } },
      statNote: this.stats.length ? this.stats.length + ' of ' + STATS.length + ' statistics are in the report.' : 'No statistics chosen yet. The report will be empty.'
    });
  }
}
</script>
