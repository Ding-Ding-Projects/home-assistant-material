      // so the dialog is one toolbar (56 px here) taller than what can be seen. The fix sizes it from 100dvh.
      dlgCls: old ? 'dlg tall' : 'dlg',
      dTitle: helper ? 'Create helper' : 'Expose entities', hasSub: !helper, dSub: 'Expose to Assist and Sample Cloud',
      sPh: ph, sId: id, sRxLabel: 'Build a pattern search for: ' + ph,
      isLoading: loading, showList: !loading, listLabel: helper ? 'Helper types' : 'Entities',
      rows, isEmpty: !loading && rows.length === 0, emptyText: 'Nothing matches "' + (this.sq[id] || '') + '". Check the spelling or clear the search.',
      clearQ: () => { this.sq = {}; this.bump(); },
      hasEnd: !loading && rows.length > 0, endText: 'End of the list · ' + (hit ? rows.length + ' of ' + all : all) + noun,
      hasFoot: !helper, goCls: n ? 'btn fill' : 'btn off', goOff: n ? 'false' : 'true', goText: n === 1 ? 'Expose 1 entity' : 'Expose ' + n + ' entities'
    });
  }
}
</script>
</body>
</html>
