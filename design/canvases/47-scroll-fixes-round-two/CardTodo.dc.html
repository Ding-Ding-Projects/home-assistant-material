<style>
body{margin:0}
.m3{--ac:#98CBFF;--s:#51606F;--sc:#D5E4F6;--on-sc:#3A4857;--err:#BA1A1A;--errc:#FFDAD6;--on-errc:#93000A;--surf:#EEF1F6;--sl0:#FFFFFF;--sl1:#F7F9FD;--sl2:#F1F4F9;--sl3:#E9EDF3;--sl4:#E1E5EC;--on:#181C20;--onv:#42474E;--out:#72777F;--outv:#C2C7CF;--inv:#2D3135;--on-inv:#EFF1F6;--amber:#6B5200;--amberc:#FFE08B;--green:#1F6A3B;--greenc:#B6F2BE;--scrim:rgba(24,28,32,.42);--e3:0 4px 8px 3px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.2);--p:color-mix(in srgb,var(--ac) 55%,#00131f);--on-p:#FFFFFF;--pc:color-mix(in srgb,var(--ac) 34%,#FFFFFF);--on-pc:color-mix(in srgb,var(--ac) 30%,#000000);font-family:Roboto,system-ui,sans-serif;color:var(--on);background:var(--surf);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.m3.dark{--s:#B9C8DA;--sc:#3A4857;--on-sc:#D5E4F6;--err:#FFB4AB;--errc:#93000A;--on-errc:#FFDAD6;--surf:#0B0F13;--sl0:#14181D;--sl1:#191D22;--sl2:#1D2126;--sl3:#272B31;--sl4:#32363C;--on:#E0E2E8;--onv:#C2C7CF;--out:#8C9199;--outv:#42474E;--inv:#E0E2E8;--on-inv:#2D3135;--amber:#F2C744;--amberc:#514000;--green:#9BD6A4;--greenc:#005227;--scrim:rgba(0,0,0,.62);--e3:0 6px 16px rgba(0,0,0,.6);--p:var(--ac);--on-p:#071019;--pc:color-mix(in srgb,var(--ac) 30%,#12161A);--on-pc:color-mix(in srgb,var(--ac) 30%,#FFFFFF)}
.m3 *{box-sizing:border-box}
.m3 button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
.m3 input{font:inherit;color:inherit}
.m3 h1,.m3 h2,.m3 p{margin:0}
.m3 :focus-visible{outline:2px solid var(--p);outline-offset:2px}
.ic{width:24px;height:24px;fill:currentColor;flex:none;display:block}
.ic.s{width:20px;height:20px}
.ic.l{width:40px;height:40px}
.tl{font-size:22px;line-height:28px;font-weight:500}
.tm{font-size:16px;line-height:24px;font-weight:500}
.bl{font-size:16px;line-height:24px}
.sub{font-size:13px;line-height:18px;color:var(--onv)}
.lm{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.4px;color:var(--onv)}
.mono{font-family:'Roboto Mono',ui-monospace,Menlo,monospace}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:8px}
.ib{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;color:var(--onv);flex:none;transition:background-color .2s}
.ib:hover{background:var(--sl3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:24px;font-size:14px;font-weight:600;white-space:nowrap;transition:filter .2s,transform .2s cubic-bezier(.2,0,0,1)}
.m3 .btn.fill{background:var(--p);color:var(--on-p)}
.m3 .btn.tonal{background:var(--sc);color:var(--on-sc)}
.m3 .btn.text{color:var(--p);padding:0 14px}
.m3 .btn.off{background:var(--sl4);color:var(--out);cursor:not-allowed}
.btn:hover{filter:brightness(1.07)}
.m3 .chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--outv);color:var(--onv);font-size:14px;font-weight:600;white-space:nowrap;flex:none;position:relative}
.m3 .chip::after{content:"";position:absolute;inset:-6px 0}
.m3 .chip.sel{background:var(--sc);box-shadow:none;color:var(--on-sc)}
.lead{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--sc);color:var(--on-sc);flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 10px;border-radius:12px;background:var(--sl3);color:var(--onv);font-size:12px;line-height:16px;font-weight:600}
.tag.p{background:var(--pc);color:var(--on-pc)}
.tag.g{background:var(--greenc);color:var(--green)}
.tag.e{background:var(--errc);color:var(--on-errc)}
.note{display:flex;gap:12px;padding:12px 14px;border-radius:16px;background:var(--sl2);color:var(--onv);font-size:13px;line-height:18px}
.note.bad{background:var(--errc);color:var(--on-errc)}
.field{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 8px 6px 16px;border-radius:16px;background:var(--sl2);box-shadow:inset 0 -2px 0 var(--out);width:100%}
.field.bad{box-shadow:inset 0 -3px 0 var(--err)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;min-height:44px}
.sk{display:block;border-radius:12px;background:linear-gradient(90deg,var(--sl2) 25%,var(--sl4) 50%,var(--sl2) 75%);background-size:200% 100%;animation:shim 1.4s linear infinite}
.in{animation:rise .35s cubic-bezier(.2,0,0,1) both}
.pop{animation:pop .28s cubic-bezier(.2,0,0,1) both}
.up{animation:up .32s cubic-bezier(.2,0,0,1) both}
.spin{animation:spin 1s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
.lin{height:4px;border-radius:2px;background:var(--sl4);overflow:hidden}
.lin span{display:block;width:36%;height:100%;border-radius:2px;background:var(--p);animation:slide 1.4s cubic-bezier(.4,0,.2,1) infinite}
.ph{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.wd{min-height:var(--wh,860px);position:relative;overflow:hidden;padding:20px clamp(16px,3vw,40px) 32px;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;align-items:center;gap:4px;min-height:64px;padding:8px 8px 8px 4px;flex:none}
.bar h1{flex:1;min-width:0;font-size:22px;line-height:28px;font-weight:500}
.stagebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px 24px;color:var(--onv)}
.stagebox .big{width:72px;height:72px;border-radius:36px;display:grid;place-items:center;background:var(--sl2);color:var(--onv)}
.toast{position:absolute;left:12px;right:12px;bottom:16px;z-index:8;background:var(--inv);color:var(--on-inv);border-radius:16px;padding:10px 6px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--e3)}
.toast .btn.text{color:inherit;text-decoration:underline}
.still *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){.m3 *{animation:none!important;transition:none!important}}
.m3 .btn{padding:0 24px}
.m3 .btn.text{padding:0 14px}
.ph{background:var(--surf)}
.sbar{height:28px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:12px;line-height:16px;font-weight:600;color:var(--onv);position:relative;z-index:12;background:var(--surf)}
.sbar .mid{flex:1;display:flex;justify-content:center;gap:6px;min-width:0}
.sbar .ic{width:16px;height:16px}
.tag.td{background:var(--amberc);color:var(--amber);min-height:20px;padding:1px 10px}
.tag.nt{min-height:20px;padding:1px 10px}
.pbar{position:absolute;left:12px;right:12px;bottom:12px;height:64px;border-radius:32px;background:var(--sl3);box-shadow:var(--e3);display:flex;align-items:center;padding:0 6px;z-index:10}
.m3 .pbar button{flex:1;min-width:0;height:56px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;line-height:14px;font-weight:600;color:var(--onv)}
.pbar .pi{width:48px;height:28px;border-radius:14px;display:grid;place-items:center;transition:background-color .2s}
.m3 .pbar button.on{color:var(--on)}
.pbar button.on .pi{background:var(--sc);color:var(--on-sc)}
.ghost{display:flex;flex-direction:column;gap:8px;visibility:hidden;pointer-events:none}
.tstrip{position:absolute;left:12px;right:12px;bottom:92px;z-index:8;display:flex;flex-direction:column;gap:8px}
.tst{background:var(--inv);color:var(--on-inv);border-radius:16px;padding:0 4px 0 16px;display:flex;align-items:center;gap:4px;box-shadow:var(--e3);font-size:13px;line-height:18px;flex:none;min-height:48px}

.m3 .tst .ib:hover{background:transparent}
.hd{flex:none;background:var(--sl2);position:relative;z-index:3}

.tb{display:flex;align-items:center;min-height:56px;padding:0 4px}

.view{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 24px}
.sech{font-size:20px;line-height:28px;font-weight:400;padding:14px 4px 8px}

.card{background:var(--sl1);border-radius:12px;box-shadow:inset 0 0 0 1px var(--outv);position:relative;min-width:0}
.m3 .tilec{min-height:56px;padding:8px 10px;display:flex;align-items:center;gap:10px;width:100%}
.tdot{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;flex:none}
.tn{font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ph .toast{bottom:92px}

.endroom{flex:none}

.col{display:flex;flex-direction:column;gap:8px;min-width:0}

.td{padding-bottom:8px;--ab:48px;--rh:48px;--hh:48px;--hp:12px}

.td.old .cbx::after{inset:-11px}
.m3 .cbx.on{background:var(--p);box-shadow:none;color:var(--on-p)}
.cbx svg{width:16px;height:16px;fill:currentColor;display:block}
.tin{font-size:14px;line-height:20px;overflow-wrap:anywhere}
.ti.dn .tin{text-decoration:line-through;color:var(--onv)}
.m3 .hdl{height:var(--hh);padding:0 var(--hp);display:flex;align-items:center;cursor:grab;color:var(--onv);flex:none;border-radius:12px}
.td.old .hdl{display:block}
.m3 .del{width:var(--ab);height:var(--ab);border-radius:50%;display:grid;place-items:center;flex:none;color:var(--onv)}
.tdiv{height:1px;background:var(--outv);margin:8px 0 0}
.tload{min-height:96px;display:grid;place-items:center}
.tnone{min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px 32px;color:var(--onv);font-size:14px;line-height:20px;text-align:center}

.tbare{padding:16px 32px;display:inline-block;font-size:14px;line-height:20px;margin:0}
</style>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#98CBFF","options":["#98CBFF","#9BD6A4","#F2C744","#D4BEE6"]},"motion":{"editor":"boolean","default":true},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"stage":{"editor":"enum","default":"after","options":["after","before","reorder","loading","empty","error"]},"$preview":{"width":390,"height":844}}'>
const DEF = "after";
const ICON = {"SORT":"M18 21L14 17H17V7H14L18 3L22 7H19V17H22M2 19V17H12V19M2 13V11H9V13M2 7V5H6V7H2Z","CLOSE":"M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"};
function todoSeed() { return { items: [['Oat milk', ''], ['Spring onions and ginger', 'Due today'], ['Rice noodles, two packs', ''], ['Dish soap refill', 'Due Friday 27 November']], done: ['Eggs'], draft: '', re: false }; }
// mode: list | loading | empty | error | blank (today: nothing while loading) | bare (today: plain sentence)
function todoCard(self, key, title, mode, old) {
  const d = self.td[key] || (self.td[key] = todoSeed());
  const set = (o) => { self.td = Object.assign({}, self.td); self.td[key] = Object.assign({}, d, o); self.bump(); };
  let m = mode;
  if (m === 'list' && !d.items.length && !d.done.length) m = old ? 'bare' : 'empty';
  const add = () => { const t = (d.draft || '').trim(); if (!t || m === 'error') return; set({ items: d.items.concat([[t, '']]), draft: '' }); };
  return {
    cls: old ? 'card td old' : 'card td', title, draft: d.draft,
    setDraft: (e) => { d.draft = e.target.value; },
    key: (e) => { if (e && e.key === 'Enter') add(); },
    add,
    isLoading: m === 'loading', isEmpty: m === 'empty', isBare: m === 'bare', isError: m === 'error', isList: m === 'list',
    retry: () => self.say('Asked ' + title + ' to load again'),
    head: d.re ? 'Reorder items' : 'Active', reAria: String(d.re),
    menuLabel: d.re ? 'Exit reorder mode' : 'Reorder items', menuIcon: d.re ? ICON.CLOSE : ICON.SORT,
    toggleRe: () => set({ re: !d.re }),
    items: d.items.map((it, i) => ({
      name: it[0], hasDue: !!it[1], due: it[1], re: d.re,
      check: () => set({ items: d.items.filter((x, j) => j !== i), done: [it[0]].concat(d.done) }),
      up: () => { if (!i) return; const n = d.items.slice(); n[i - 1] = d.items[i]; n[i] = d.items[i - 1]; set({ items: n }); }
    })),
    hasDone: d.done.length > 0,
    done: d.done.map((n, i) => ({ name: n,
      check: () => set({ done: d.done.filter((x, j) => j !== i), items: d.items.concat([[n, '']]) }),
      del: () => set({ done: d.done.filter((x, j) => j !== i) }) })),
    clear: () => set({ done: [] })
  };
}

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 0 }; this._p = null; this._s = DEF; this.reset(DEF); }

  base() {
    const accent = this.props.accent ?? '#98CBFF';
    const motion = this.props.motion ?? true;
    const theme = this.props.theme ?? 'dark';
    return { accent, shell: 'm3' + (theme === 'dark' ? ' dark' : '') + (motion ? '' : ' still') };
  }
  bump() { this.setState({ n: this.state.n + 1 }); }
  stage() {
    const p = this.props.stage ?? DEF;
    if (p !== this._p) { this._p = p; this._s = p; this.reset(p); }
    return this._s;
  }
  say(m) { this.msg = m; this.bump(); }
  common(v, old) {
    Object.assign(v, { isOld: old, hasMsg: !!this.msg, msg: this.msg, dismiss: () => this.say(''), endStyle: 'height: ' + (this.msg ? 172 : 100) + 'px' });
  }

  reset(s) {
    this.msg = ''; this.td = { a: todoSeed(), b: todoSeed(), c: todoSeed() };
    if (s === 'reorder' || s === 'before') this.td.a.re = true;
    if (s === 'empty') { this.td.a.items = []; this.td.a.done = []; }
    this.td.c.items = []; this.td.c.done = [];
  }
  renderVals() {
    const v = this.base();
    const s = this.stage();
    const old = s === 'before';
    this.common(v, old);
    // Today (before): the first card is in reorder mode, the second is still waiting for its items and shows
    // nothing, the third has loaded with no items and shows one plain sentence.
    v.cards = old
      ? [todoCard(this, 'a', 'Shopping list', 'list', true), todoCard(this, 'b', 'Weekend chores', 'blank', true), todoCard(this, 'c', 'Garden', 'bare', true)]
      : [todoCard(this, 'a', 'Shopping list', s === 'loading' ? 'loading' : s === 'error' ? 'error' : 'list', false)];
    return v;
  }
}
</script>
