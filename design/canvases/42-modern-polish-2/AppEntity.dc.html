<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Entity sheet: a light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,300..900&display=swap">
<style>
body{margin:0;background:#0C1016}
@keyframes e-up{from{transform:translateY(90px);opacity:0}to{transform:none;opacity:1}}
@keyframes e-fill{from{height:0}to{height:62%}}
@keyframes e-ray{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.06)}}
.e-up{animation:e-up .5s cubic-bezier(.2,1.3,.3,1) both}
.e-fill{animation:e-fill .9s cubic-bezier(.2,1.3,.3,1) .25s both}
.e-ray{animation:e-ray 2.6s ease-in-out infinite;transform-origin:50% 50%}
.e-still *{animation:none !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
.e-pill{flex:1;min-width:0;height:52px;border:0;border-radius:26px;background:#222935;color:#E6E9EF;font-family:inherit;font-size:14px;font-weight:700}
.e-sw{flex:none;width:40px;height:40px;border-radius:20px;border:0}
</style>
</helmet>
<div class="{{motionClass}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C1016; color: #E6E9EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; font-size: 15px; line-height: 22px">
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.6)"></div>

<section class="e-up" role="dialog" aria-label="Hallway light" style="position: absolute; left: 0; right: 0; bottom: 0; height: 760px; box-sizing: border-box; border-radius: 44px 44px 0 0; background: #171C24; display: flex; flex-direction: column">
<div style="flex: none; border-radius: 44px 44px 36px 36px; background: #5A3E00; padding: 10px 10px 16px 22px; position: relative; overflow: hidden">
<svg aria-hidden="true" width="150" height="150" viewBox="0 0 150 150" style="position: absolute; right: -24px; top: -30px"><g class="e-ray"><circle cx="75" cy="75" r="44" fill="#F2B62E" stroke="#F2B62E" stroke-width="20" stroke-dasharray="0 23" stroke-linecap="round"/></g></svg>
<div aria-hidden="true" style="width: 36px; height: 4px; border-radius: 2px; background: #FFD77A; opacity: .6; margin: 0 auto 4px"></div>
<div style="display: flex; align-items: flex-start; gap: 8px; position: relative">
<div style="flex: 1; min-width: 0; padding-top: 8px"><div style="font-size: 12px; font-weight: 700; letter-spacing: .1em; color: #FFD77A">HALLWAY · LIGHT</div><h2 style="margin: 2px 0 0; font-size: 30px; line-height: 32px; font-weight: 900; font-stretch: 116%; letter-spacing: -0.02em; color: #FFFFFF">Hallway light</h2><p style="margin: 2px 0 0; font-size: 14px; color: #FFE7B0">On for 1 h 12 min</p></div>
<button type="button" aria-label="Close" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: rgba(30,20,0,.5); display: grid; place-items: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
</div>

<div style="flex: 1; min-height: 0; padding: 16px 16px 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="display: flex; align-items: flex-end; gap: 18px">
<div role="slider" aria-label="Brightness" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" tabindex="0" style="width: 132px; height: 300px; border-radius: 44px; background: #222935; position: relative; overflow: hidden">
<div class="e-fill" style="position: absolute; left: 0; right: 0; bottom: 0; height: 62%; background: #F2B62E; border-radius: 0 0 44px 44px"><div style="width: 44px; height: 5px; border-radius: 3px; background: #3A2A00; margin: 10px auto 0"></div></div>
<div style="position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 40px; line-height: 40px; font-weight: 900; font-stretch: 118%; color: #3A2A00">62<span style="font-size: 18px">%</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 6px">
<button type="button" class="e-sw" aria-label="Warm white" style="background: #FFD9A0; outline: 3px solid #FFFFFF; outline-offset: 2px"></button>
<button type="button" class="e-sw" aria-label="Daylight" style="background: #F4F7FF"></button>
<button type="button" class="e-sw" aria-label="Sunset" style="background: #FF8A65"></button>
<button type="button" class="e-sw" aria-label="Sea" style="background: #7FE0A2"></button>
<button type="button" class="e-sw" aria-label="Violet" style="background: #B9A2FF"></button>
</div>
</div>

<button type="button" style="width: 100%; height: 64px; border: 0; border-radius: 32px; background: {{accent}}; color: #06203A; font-family: inherit; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#06203A" stroke-width="2.8" stroke-linecap="round"><path d="M12 4v8"/><path d="M6.5 7.5a8 8 0 1 0 11 0"/></svg>Turn off</button>

<div style="width: 100%; display: flex; gap: 8px">
<button type="button" class="e-pill">History</button>
<button type="button" class="e-pill">Automations</button>
<button type="button" class="e-pill">Settings</button>
</div>

<div style="width: 100%; box-sizing: border-box; border-radius: 26px; background: #222935; padding: 12px 16px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: .08em; color: #B9C0CC">TODAY</div>
<svg role="img" aria-label="On from 07:00 to 08:10 and from 18:30 until now" width="326" height="28" viewBox="0 0 326 28" style="display: block; margin-top: 6px"><rect x="0" y="8" width="326" height="12" rx="6" fill="#0C1016"/><rect x="95" y="8" width="16" height="12" rx="6" fill="#F2B62E"/><rect x="251" y="8" width="18" height="12" rx="6" fill="#F2B62E"/></svg>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9CC8FF","options":["#9CC8FF","#7FE0A2","#F2B62E","#B9A2FF"]},"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#9CC8FF', motionClass: (this.props.motion ?? true) ? '' : 'e-still' };
}
}
</script>
</body>
</html>
