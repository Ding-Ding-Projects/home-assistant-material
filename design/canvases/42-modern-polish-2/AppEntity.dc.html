<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Entity sheet, today's look polished</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#1A1E25}
@keyframes s-up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes s-fill{from{width:0}to{width:71%}}
.s-up{animation:s-up .34s cubic-bezier(.2,.9,.3,1) both}
.s-fill{animation:s-fill .5s cubic-bezier(.2,.9,.3,1) .15s both}
.s-still .s-up,.s-still .s-fill{animation:none}
@media (prefers-reduced-motion:reduce){.s-up,.s-fill{animation:none}}
.s-ib{width:48px;height:48px;border:0;border-radius:24px;background:transparent;display:grid;place-items:center;flex:none}
.s-sw{width:48px;height:48px;border:0;border-radius:24px}
.s-tab{flex:1;min-width:0;height:48px;border:0;border-radius:24px;background:transparent;color:#E3E6EC;font-family:inherit;font-size:14px;font-weight:500}
</style>
</helmet>
<div class="{{motionClass}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #1A1E25; color: #E3E6EC; font-family: Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px">

<div aria-hidden="true" style="opacity: .45">
<div style="height: 56px; background: #14181E; display: flex; align-items: center; padding: 0 60px; font-size: 20px; font-weight: 700">Entities</div>
<div style="margin: 60px 8px 0; height: 44px; border-radius: 16px; background: #20252D"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.5)"></div>

<section class="s-up" role="dialog" aria-label="Ceiling lights" style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; box-sizing: border-box; border-radius: 28px 28px 0 0; background: #1A1E25; display: flex; flex-direction: column">
<div style="flex: none; padding: 8px 4px 0">
<div aria-hidden="true" style="width: 36px; height: 4px; border-radius: 2px; background: #5A6270; margin: 0 auto 2px"></div>
<div style="display: flex; align-items: center; gap: 4px">
<button type="button" class="s-ib" aria-label="Close"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E3E6EC" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #4A3A12; display: grid; place-items: center; transition: background .3s"><svg width="22" height="22" viewBox="0 0 24 24" fill="#FFC14D"><path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/><rect x="9.5" y="17.5" width="5" height="2.5" rx="1"/></svg></div>
<div style="flex: 1; min-width: 0; padding-left: 6px"><div style="font-size: 16px; line-height: 20px; font-weight: 700; color: #FFFFFF; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">Ceiling lights</div><div style="font-size: 13px; line-height: 18px; color: #B4BBC6">On · Living room</div></div>
<button type="button" class="s-ib" aria-label="History"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E3E6EC" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 16v-4M12 16V8M15 16v-6"/></svg></button>
<button type="button" class="s-ib" aria-label="Settings"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E3E6EC" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg></button>
<button type="button" class="s-ib" aria-label="More actions"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="#E3E6EC"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
</div>
</div>

<div style="flex: 1; min-height: 0; padding: 20px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 22px">
<div style="text-align: center"><div style="font-size: 30px; line-height: 36px; color: #FFFFFF">71%</div><div style="font-size: 14px; font-weight: 500; color: #E3E6EC">2 hours ago</div></div>

<div role="slider" aria-label="Brightness" aria-valuenow="71" aria-valuemin="0" aria-valuemax="100" tabindex="0" style="width: 100%; height: 56px; border-radius: 20px; background: #4A3A2A; position: relative; overflow: hidden"><div class="s-fill" style="position: absolute; left: 0; top: 0; bottom: 0; width: 71%; border-radius: 20px; background: #FFA94D"><div style="position: absolute; right: 8px; top: 14px; width: 4px; height: 28px; border-radius: 2px; background: #FFFFFF"></div></div></div>

<div style="display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 28px; background: #20252D">
<button type="button" class="s-ib" aria-label="Turn off"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E3E6EC" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v8"/><path d="M7 7.5a7 7 0 1 0 10 0"/></svg></button>
<div aria-hidden="true" style="width: 1px; height: 32px; background: #444A54"></div>
<button type="button" class="s-ib" aria-label="Brightness" aria-pressed="true" style="background: #E3E6EC"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="none" stroke="#1A1E25" stroke-width="2.2"/><path d="M12 6a6 6 0 0 1 0 12z" fill="#1A1E25"/></svg></button>
<button type="button" class="s-ib" aria-label="Colour"><div style="width: 26px; height: 26px; border-radius: 13px; background: conic-gradient(#FF5A5A, #FFD24D, #5AE08A, #5AB4FF, #B77DFF, #FF5A5A)"></div></button>
<button type="button" class="s-ib" aria-label="Colour temperature"><div style="width: 26px; height: 26px; border-radius: 13px; background: linear-gradient(180deg, #A9CBFF, #FFFFFF 50%, #FFB45A)"></div></button>
</div>

<div style="display: grid; grid-template-columns: repeat(4, 48px); gap: 16px 22px">
<button type="button" class="s-sw" aria-label="Orange" style="background: #FF8F1F"></button>
<button type="button" class="s-sw" aria-label="Peach" style="background: #FFC08A"></button>
<button type="button" class="s-sw" aria-label="Warm white" style="background: #FFE2C8"></button>
<button type="button" class="s-sw" aria-label="White" style="background: #FFFFFF"></button>
<button type="button" class="s-sw" aria-label="Blue" style="background: #86AEFF"></button>
<button type="button" class="s-sw" aria-label="Violet" style="background: #D09BFF"></button>
<button type="button" class="s-sw" aria-label="Pink" style="background: #FFA3F0"></button>
<button type="button" class="s-sw" aria-label="Coral" style="background: #FF6B5A"></button>
</div>
</div>

<div role="tablist" aria-label="Sections" style="flex: none; display: flex; gap: 4px; padding: 8px 12px 14px; border-top: 1px solid #2B313A">
<button type="button" role="tab" aria-selected="true" class="s-tab" style="background: #E3E6EC; color: #1A1E25">Details</button>
<button type="button" role="tab" aria-selected="false" class="s-tab">History</button>
<button type="button" role="tab" aria-selected="false" class="s-tab">Settings</button>
<button type="button" role="tab" aria-selected="false" class="s-tab">Related</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A8C7FA","options":["#A8C7FA","#A8E6B8","#F2C86B","#CDB8FF"]},"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#A8C7FA', motionClass: (this.props.motion ?? true) ? '' : 's-still' };
}
}
</script>
</body>
</html>
