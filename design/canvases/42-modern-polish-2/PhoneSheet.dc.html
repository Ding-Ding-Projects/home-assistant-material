<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A sheet over the page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,300..900&display=swap">
<style>
body{margin:0;background:#0C1016}
@keyframes sh-up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sh-up{animation:sh-up .4s cubic-bezier(.2,1.2,.3,1) both}
.sh-still .sh-up{animation:none}
@media (prefers-reduced-motion:reduce){.sh-up{animation:none}}
.sh-opt{min-height:56px;box-sizing:border-box;border-radius:16px;background:#222935;padding:8px 14px;display:flex;align-items:center;gap:12px}
.sh-box{flex:none;width:22px;height:22px;box-sizing:border-box;border-radius:6px;border:2px solid #8C9199}
</style>
</helmet>
<div class="{{motionClass}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C1016; color: #E0E2E8; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; font-size: 15px; line-height: 22px">

<div aria-hidden="true" style="padding: 64px 16px 0; opacity: .5">
<div style="font-size: 34px; line-height: 38px; font-weight: 800">Automations</div>
<div style="margin-top: 16px; height: 64px; border-radius: 20px; background: #171C24"></div>
<div style="margin-top: 8px; height: 64px; border-radius: 20px; background: #171C24"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.55)"></div>

<section class="sh-up" role="dialog" aria-label="Filter automations" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 742px; height: 640px; box-sizing: border-box; border-radius: 28px 28px 0 0; background: #171C24; display: flex; flex-direction: column">
<div style="flex: none; padding: 8px 8px 8px 20px">
<div aria-hidden="true" style="width: 36px; height: 4px; border-radius: 2px; background: #8C9199; margin: 0 auto 6px"></div>
<div style="display: flex; align-items: center; gap: 8px"><h2 style="flex: 1; min-width: 0; margin: 0; font-size: 22px; line-height: 28px; font-weight: 800">Filter</h2><button type="button" aria-label="Close" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; display: grid; place-items: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E0E2E8" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<label style="margin: 6px 12px 0 0; height: 48px; box-sizing: border-box; border-radius: 24px; background: #222935; display: flex; align-items: center; gap: 10px; padding: 0 16px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2C7CF" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" placeholder="Search areas and labels" aria-label="Search areas and labels" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #E0E2E8; font-family: inherit; font-size: 15px; outline: none"><button type="button" aria-label="Build a pattern" style="flex: none; width: 40px; height: 40px; margin-right: -8px; border: 0; border-radius: 20px; background: transparent; color: #C2C7CF; font-family: ui-monospace, Consolas, monospace; font-size: 14px; font-weight: 700">.*</button></label>
</div>

<div style="flex: 1; min-height: 0; position: relative">
<div style="height: 100%; box-sizing: border-box; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: .08em; color: #C2C7CF">AREA</div>
<div class="sh-opt"><div class="sh-box" style="border-color: {{accent}}; background: {{accent}}"></div><div style="flex: 1; min-width: 0">Living room</div><div style="color: #C2C7CF">4</div></div>
<div class="sh-opt"><div class="sh-box"></div><div style="flex: 1; min-width: 0">Kitchen</div><div style="color: #C2C7CF">3</div></div>
<div class="sh-opt"><div class="sh-box"></div><div style="flex: 1; min-width: 0; overflow-wrap: anywhere">Upstairs landing and the small storage room</div><div style="color: #C2C7CF">2</div></div>
<div style="margin-top: 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; color: #C2C7CF">LABEL</div>
<div class="sh-opt"><div class="sh-box"></div><div style="flex: 1; min-width: 0">Lighting</div><div style="color: #C2C7CF">5</div></div>
<div class="sh-opt"><div class="sh-box"></div><div style="flex: 1; min-width: 0">Heating</div><div style="color: #C2C7CF">2</div></div>
<div class="sh-opt"><div class="sh-box"></div><div style="flex: 1; min-width: 0">Security</div><div style="color: #C2C7CF">3</div></div>
<div class="sh-opt"><div class="sh-box"></div><div style="flex: 1; min-width: 0">Garden</div><div style="color: #C2C7CF">1</div></div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(180deg, rgba(28,32,36,0), #171C24)"></div>
</div>

<div style="flex: none; padding: 12px 16px 20px; display: flex; gap: 8px; border-top: 1px solid #2B3036">
<button type="button" style="flex: 1; min-width: 0; height: 52px; border: 1px solid #8C9199; border-radius: 26px; background: transparent; color: #E0E2E8; font-family: inherit; font-size: 15px; font-weight: 700">Clear</button>
<button type="button" style="flex: 2; min-width: 0; height: 52px; border: 0; border-radius: 26px; background: {{accent}}; color: #06203A; font-family: inherit; font-size: 15px; font-weight: 800">Show 4 automations</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9CC8FF","options":["#9CC8FF","#B7D086","#FFB870","#D6BAFF"]},"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#9CC8FF', motionClass: (this.props.motion ?? true) ? '' : 'sh-still' };
}
}
</script>
</body>
</html>
