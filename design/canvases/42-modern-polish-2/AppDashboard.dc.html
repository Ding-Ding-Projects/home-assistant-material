<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,300..900&display=swap">
<style>
body{margin:0;background:#0C1016}
@keyframes k-in{from{opacity:0;transform:translateY(36px) scale(.9)}to{opacity:1;transform:none}}
@keyframes k-draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
@keyframes k-arc{from{stroke-dashoffset:330}to{stroke-dashoffset:118}}
@keyframes k-wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.k-in{animation:k-in .55s cubic-bezier(.2,1.4,.3,1) both}
.k-draw{stroke-dasharray:520;animation:k-draw 1.4s ease-out .3s both}
.k-arc{stroke-dasharray:330;stroke-dashoffset:118;animation:k-arc 1.2s cubic-bezier(.2,1,.3,1) .3s both}
.k-wave{animation:k-wave 1s ease-in-out infinite;transform-origin:50% 100%}
.k-still *{animation:none !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
.k-card{border-radius:32px;padding:14px;position:relative;overflow:hidden;min-width:0}
.k-k{font-size:11px;font-weight:800;letter-spacing:.1em}
.k-big{font-size:44px;line-height:42px;font-weight:900;font-stretch:118%;letter-spacing:-.03em;color:#FFFFFF}
.k-round{flex:none;width:52px;height:52px;border:0;border-radius:26px;display:grid;place-items:center}
.k-nav{position:absolute;left:12px;right:12px;bottom:12px;height:68px;box-sizing:border-box;border-radius:34px;background:#1B212B;box-shadow:0 12px 30px rgba(0,0,0,.6);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px}
.k-nav a{display:grid;justify-items:center;align-content:center;gap:1px;color:#B9C0CC;text-decoration:none;font-size:12px;font-weight:600;border-radius:28px}
</style>
</helmet>
<div class="{{motionClass}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C1016; color: #E6E9EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; font-size: 15px; line-height: 22px; padding: 12px 10px 0">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 6px 8px"><h1 style="margin: 0; font-size: 30px; line-height: 34px; font-weight: 900; font-stretch: 116%; letter-spacing: -0.02em">Living room</h1><button type="button" aria-label="Edit this page" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: #1B212B; display: grid; place-items: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E6E9EF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16z"/></svg></button></div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">

<section class="k-card k-in" style="grid-column: span 2; background: #5A2A14; height: 176px">
<svg aria-hidden="true" width="370" height="176" viewBox="0 0 370 176" style="position: absolute; inset: 0"><path d="M0 130 C50 120 70 90 120 96 S190 140 240 112 S320 60 370 78 V176 H0 Z" fill="#7A3A1C"/><path class="k-draw" d="M0 130 C50 120 70 90 120 96 S190 140 240 112 S320 60 370 78" fill="none" stroke="#FF8A65" stroke-width="5" stroke-linecap="round"/><circle cx="240" cy="112" r="8" fill="#FFFFFF"/></svg>
<div style="position: relative"><div class="k-k" style="color: #FFD0BD">TEMPERATURE · 24 HOURS</div><div class="k-big">21.4°</div><div style="font-size: 13px; color: #FFD0BD">Heating to 22° · low 18.9° at 05:10</div></div>
<div style="position: absolute; right: 12px; top: 12px; display: flex; gap: 6px"><button type="button" class="k-round" aria-label="Cooler" style="background: rgba(40,10,0,.5)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button><button type="button" class="k-round" aria-label="Warmer" style="background: #FF8A65"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3A1200" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
</section>

<section class="k-card k-in" style="animation-delay: .08s; background: #5A3E00; height: 150px">
<svg aria-hidden="true" width="90" height="90" viewBox="0 0 90 90" style="position: absolute; right: -20px; top: -20px"><circle cx="45" cy="45" r="27" fill="#F2B62E" stroke="#F2B62E" stroke-width="14" stroke-dasharray="0 14.1" stroke-linecap="round"/></svg>
<div class="k-k" style="color: #FFD77A">LIGHTS</div><div class="k-big">2<span style="font-size: 20px; color: #FFD77A"> of 5</span></div>
<button type="button" style="position: absolute; left: 14px; right: 14px; bottom: 14px; height: 48px; border: 0; border-radius: 24px; background: #F2B62E; color: #3A2A00; font-family: inherit; font-size: 14px; font-weight: 900">All off</button>
</section>

<section class="k-card k-in" style="animation-delay: .14s; background: #0F4A2A; height: 150px">
<div class="k-k" style="color: #A8F5C2">POWER NOW</div>
<svg role="img" aria-label="640 watts of a usual 1000" width="150" height="86" viewBox="0 0 150 86" style="display: block; margin: 4px auto 0"><path d="M12 80 A63 63 0 0 1 138 80" fill="none" stroke="#0A3520" stroke-width="16" stroke-linecap="round"/><path class="k-arc" d="M12 80 A63 63 0 0 1 138 80" fill="none" stroke="#7FE0A2" stroke-width="16" stroke-linecap="round"/><text x="75" y="76" text-anchor="middle" font-family="Roboto Flex, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">640</text></svg>
<div style="text-align: center; font-size: 13px; color: #CFF9DD">watts · usual for now</div>
</section>

<section class="k-card k-in" style="animation-delay: .2s; grid-column: span 2; background: #3A1F66; display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="flex: none; width: 76px; height: 76px; border-radius: 26px; background: #B9A2FF; display: flex; align-items: flex-end; justify-content: center; gap: 5px; padding-bottom: 18px; box-sizing: border-box"><i class="k-wave" style="width: 7px; height: 36px; border-radius: 4px; background: #22104F"></i><i class="k-wave" style="width: 7px; height: 36px; border-radius: 4px; background: #22104F; animation-delay: .2s"></i><i class="k-wave" style="width: 7px; height: 36px; border-radius: 4px; background: #22104F; animation-delay: .4s"></i><i class="k-wave" style="width: 7px; height: 36px; border-radius: 4px; background: #22104F; animation-delay: .1s"></i></div>
<div style="flex: 1; min-width: 0"><div class="k-k" style="color: #DCC6FF">PLAYING · SPEAKER</div><div style="font-size: 18px; line-height: 22px; font-weight: 800; color: #FFFFFF; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Evening jazz mix</div><div style="margin-top: 8px; height: 6px; border-radius: 3px; background: #22104F"><div style="width: 42%; height: 6px; border-radius: 3px; background: #DCC6FF"></div></div></div>
<button type="button" class="k-round" aria-label="Pause" style="width: 60px; height: 60px; border-radius: 22px; background: #FFFFFF"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="#22104F"><rect x="6" y="5" width="4.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"/></svg></button>
</section>

<section class="k-card k-in" style="animation-delay: .26s; grid-column: span 2; background: #13337F; display: flex; align-items: center; gap: 12px; min-height: 84px">
<svg aria-hidden="true" width="56" height="56" viewBox="0 0 56 56" style="flex: none"><rect x="6" y="6" width="44" height="44" rx="16" fill="#9CC8FF" transform="rotate(10 28 28)"/><rect x="20" y="26" width="16" height="13" rx="3" fill="#06203A"/><path d="M23 26v-4a5 5 0 0 1 10 0v4" fill="none" stroke="#06203A" stroke-width="3"/></svg>
<div style="flex: 1; min-width: 0"><div class="k-k" style="color: #C9D8FF">FRONT DOOR</div><div style="font-size: 20px; line-height: 24px; font-weight: 900; color: #FFFFFF">Locked</div><div style="font-size: 13px; color: #C9D8FF">Since 18:05 · closed</div></div>
<button type="button" style="flex: none; height: 52px; border: 0; border-radius: 26px; background: rgba(6,16,40,.5); color: #FFFFFF; padding: 0 20px; font-family: inherit; font-size: 14px; font-weight: 800">Unlock</button>
</section>
</div>

<nav class="k-nav" aria-label="Main">
<a href="#"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</a>
<a href="#"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</a>
<a href="#" style="background: #13337F; color: #FFFFFF"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 10h16"/></svg>Pages</a>
<a href="#"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8.5"/></svg>Settings</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9CC8FF","options":["#9CC8FF","#7FE0A2","#F2B62E","#B9A2FF"]},"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#9CC8FF', motionClass: (this.props.motion ?? true) ? '' : 'k-still' };
}
}
</script>
</body>
</html>
