<!doctype html>

<head>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,300..900&display=swap">
<style>
body{margin:0;background:#0C1016}
@keyframes a-in{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:none}}
@keyframes a-spin{from{transform:rotate(-140deg) scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes a-num{0%{transform:translateY(60px) scale(.5);opacity:0}65%{transform:translateY(-6px) scale(1.12);opacity:1}100%{transform:none;opacity:1}}
@keyframes a-turn{to{transform:rotate(360deg)}}
@keyframes a-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.a-hero{animation:a-in .6s cubic-bezier(.2,1.4,.3,1) both}
.a-s1{animation:a-spin .9s cubic-bezier(.2,1.4,.3,1) .1s both}
.a-s2{animation:a-spin 1s cubic-bezier(.2,1.4,.3,1) .22s both}
.a-s3{animation:a-spin 1.1s cubic-bezier(.2,1.4,.3,1) .34s both}
.a-turn{animation:a-turn 26s linear infinite;transform-origin:50% 50%}
.a-bob{animation:a-bob 3.6s ease-in-out infinite}
.a-num{animation:a-num .8s cubic-bezier(.2,1.5,.3,1) .3s both}
.a-row{animation:a-in .5s cubic-bezier(.2,1.4,.3,1) both}
.a-still *{animation:none !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
.a-tile{flex:0 0 112px;height:92px;border:0;border-radius:28px;padding:12px 14px;text-align:left;font-family:inherit;position:relative;overflow:hidden}
.a-tile b{display:block;font-size:34px;line-height:34px;font-weight:800;font-stretch:112%}
.a-tile span{font-size:13px;font-weight:700}
.a-rowc{min-height:72px;box-sizing:border-box;border-radius:26px;background:#171C24;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:12px}
.a-name{font-weight:700;font-size:15px;line-height:20px}
.a-sub{font-size:13px;line-height:18px;color:#B9C0CC}
.a-on{flex:none;width:52px;height:32px;border-radius:16px;position:relative}
.a-on i{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:12px;background:#06203A}
.a-off{flex:none;width:52px;height:32px;box-sizing:border-box;border-radius:16px;border:2px solid #8A93A0;position:relative}
.a-off i{position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:8px;background:#8A93A0}
.a-nav{position:absolute;left:12px;right:12px;bottom:12px;height:68px;box-sizing:border-box;border-radius:34px;background:#1B212B;box-shadow:0 12px 30px rgba(0,0,0,.6);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px}
.a-nav a{display:grid;justify-items:center;align-content:center;gap:1px;color:#B9C0CC;text-decoration:none;font-size:12px;font-weight:600;border-radius:28px}
</style>
</helmet>
<div class="{{motionClass}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C1016; color: #E6E9EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; font-size: 15px; line-height: 22px; display: flex; flex-direction: column">

<section class="a-hero" style="flex: none; margin: 10px 10px 0; height: 262px; border-radius: 44px; background: #13337F; position: relative; overflow: hidden">
<svg aria-hidden="true" width="370" height="262" viewBox="0 0 370 262" style="position: absolute; inset: 0">
<g class="a-s1" style="transform-origin: 300px 60px"><g class="a-turn" style="transform-origin: 300px 60px"><circle cx="300" cy="60" r="62" fill="#F2B62E" stroke="#F2B62E" stroke-width="26" stroke-dasharray="0 32.46" stroke-linecap="round"/></g></g>
<g class="a-s2" style="transform-origin: 250px 190px"><rect x="196" y="150" width="150" height="76" rx="38" fill="#7FE0A2" transform="rotate(-24 271 188)"/></g>
<g class="a-s3" style="transform-origin: 340px 250px"><circle cx="350" cy="262" r="70" fill="none" stroke="{{accent}}" stroke-width="22"/></g>
<g class="a-bob"><rect x="268" y="34" width="64" height="50" rx="16" fill="#13337F"/><circle cx="288" cy="58" r="7" fill="#F2B62E"/><circle cx="312" cy="58" r="7" fill="#F2B62E"/><path d="M300 34 V22" stroke="#13337F" stroke-width="6" stroke-linecap="round"/><circle cx="300" cy="18" r="6" fill="#13337F"/></g>
</svg>
<div style="position: absolute; left: 8px; top: 8px; right: 8px; display: flex; justify-content: space-between">
<button type="button" aria-label="Back" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: rgba(6,16,40,.45); display: grid; place-items: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
</div>
<div style="position: absolute; left: 22px; bottom: 20px; right: 120px">
<div class="a-num" style="font-size: 104px; line-height: 88px; font-weight: 900; font-stretch: 125%; letter-spacing: -0.05em; color: #FFFFFF; transform-origin: 0 100%">12</div>
<h1 style="margin: 6px 0 0; font-size: 32px; line-height: 34px; font-weight: 800; font-stretch: 114%; letter-spacing: -0.02em; color: #FFFFFF">Automations</h1>
<p style="margin: 4px 0 0; font-size: 14px; line-height: 20px; color: #C9D8FF">9 are on. 1 needs you.</p>
</div>
</section>

<div style="flex: none; position: relative; margin-top: 10px">
<div style="display: flex; gap: 8px; padding: 0 10px; overflow: hidden">
<button type="button" class="a-tile" style="background: #0F4A2A; color: #A8F5C2"><b>9</b><span>On</span><svg aria-hidden="true" width="60" height="60" viewBox="0 0 60 60" style="position: absolute; right: -14px; top: -14px"><circle cx="30" cy="30" r="20" fill="#1C7A45"/></svg></button>
<button type="button" class="a-tile" style="background: #1B212B; color: #E6E9EF"><b>3</b><span style="color: #B9C0CC">Off</span><svg aria-hidden="true" width="60" height="60" viewBox="0 0 60 60" style="position: absolute; right: -14px; top: -14px"><rect x="10" y="10" width="40" height="40" rx="12" fill="#2B3340" transform="rotate(18 30 30)"/></svg></button>
<button type="button" class="a-tile" style="background: #5A3E00; color: #FFD77A"><b>1</b><span>Needs repair</span><svg aria-hidden="true" width="60" height="60" viewBox="0 0 60 60" style="position: absolute; right: -12px; top: -14px"><path d="M30 8 L54 50 H6 Z" fill="#8A6100" stroke="#8A6100" stroke-width="8" stroke-linejoin="round"/></svg></button>
<button type="button" class="a-tile" style="background: #3A1F66; color: #DCC6FF"><b>4</b><span>Ran today</span></button>
</div>
<div aria-hidden="true" style="position: absolute; top: 0; right: 0; width: 56px; height: 92px; background: linear-gradient(90deg, rgba(12,16,22,0), #0C1016)"></div>
</div>

<div style="flex: 1; min-height: 0; padding: 10px 10px 0; display: flex; flex-direction: column; gap: 8px">
<div class="a-rowc a-row" style="animation-delay: .35s"><svg aria-hidden="true" width="52" height="52" viewBox="0 0 52 52" style="flex: none"><circle cx="26" cy="26" r="17" fill="#F2B62E" stroke="#F2B62E" stroke-width="9" stroke-dasharray="0 10.68" stroke-linecap="round"/><path d="M26 17a7 7 0 0 0-4 12.6V33h8v-3.4A7 7 0 0 0 26 17z" fill="#3A2A00"/></svg><div style="flex: 1; min-width: 0"><div class="a-name" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Hallway light at dusk</div><div class="a-sub">Ran 18:42</div></div><div class="a-on" role="img" aria-label="On" style="background: {{accent}}"><i></i></div></div>
<div class="a-rowc a-row" style="animation-delay: .42s"><svg aria-hidden="true" width="52" height="52" viewBox="0 0 52 52" style="flex: none"><rect x="5" y="5" width="42" height="42" rx="15" fill="#FF8A65" transform="rotate(12 26 26)"/><path d="M26 15v14a5 5 0 1 0 0 0" fill="none" stroke="#4A1500" stroke-width="4" stroke-linecap="round"/></svg><div style="flex: 1; min-width: 0"><div class="a-name" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">Turn the heating down when every window sensor upstairs reports open</div><div class="a-sub">Ran yesterday, 07:10</div></div><div class="a-on" role="img" aria-label="On" style="background: {{accent}}"><i></i></div></div>
<div class="a-rowc a-row" style="animation-delay: .49s; background: #3A2A06"><svg aria-hidden="true" width="52" height="52" viewBox="0 0 52 52" style="flex: none"><path d="M26 7 L47 43 H5 Z" fill="#FFD77A" stroke="#FFD77A" stroke-width="7" stroke-linejoin="round"/><path d="M26 21v10" stroke="#3A2A00" stroke-width="4.5" stroke-linecap="round"/><circle cx="26" cy="38" r="2.8" fill="#3A2A00"/></svg><div style="flex: 1; min-width: 0"><div class="a-name" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Front door left open</div><div class="a-sub" style="color: #FFD77A">Needs repair: a device is missing</div></div><div class="a-off" role="img" aria-label="Off"><i></i></div></div>
<div class="a-rowc a-row" style="animation-delay: .56s"><svg aria-hidden="true" width="52" height="52" viewBox="0 0 52 52" style="flex: none"><rect x="4" y="12" width="44" height="28" rx="14" fill="#B9A2FF" transform="rotate(-18 26 26)"/><path d="M30 17a10 10 0 1 0 5 15 8 8 0 0 1-5-15z" fill="#22104F"/></svg><div style="flex: 1; min-width: 0"><div class="a-name" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Night mode at 23:00</div><div class="a-sub">Ran 23:00</div></div><div class="a-on" role="img" aria-label="On" style="background: {{accent}}"><i></i></div></div>
</div>

<button type="button" style="position: absolute; right: 14px; bottom: 92px; height: 60px; border: 0; border-radius: 30px; background: {{accent}}; color: #06203A; padding: 0 22px 0 16px; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 16px; font-weight: 800; box-shadow: 0 10px 26px rgba(0,0,0,.6)"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#06203A" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Create</button>

<nav class="a-nav" aria-label="Main">

<a href="#"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 10h16"/></svg>Pages</a>
<a href="#" style="background: #13337F; color: #FFFFFF"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8.5"/></svg>Settings</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9CC8FF","options":["#9CC8FF","#7FE0A2","#F2B62E","#B9A2FF"]},"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>

}
}
</script>
