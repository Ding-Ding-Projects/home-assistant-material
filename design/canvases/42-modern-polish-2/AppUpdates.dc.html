<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Updates and backups</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,300..900&display=swap">
<style>
body{margin:0;background:#0C1016}
@keyframes u-in{from{opacity:0;transform:translateY(36px) scale(.92)}to{opacity:1;transform:none}}
@keyframes u-ring{from{stroke-dashoffset:565}to{stroke-dashoffset:198}}
@keyframes u-turn{to{transform:rotate(360deg)}}
@keyframes u-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.u-in{animation:u-in .55s cubic-bezier(.2,1.4,.3,1) both}
.u-ring{stroke-dasharray:565;stroke-dashoffset:198;animation:u-ring 1.4s cubic-bezier(.2,1,.3,1) .2s both}
.u-turn{animation:u-turn 14s linear infinite;transform-origin:105px 105px}
.u-pulse{animation:u-pulse 1.6s ease-in-out infinite;transform-origin:50% 50%}
.u-still *{animation:none !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
.u-step{display:flex;align-items:center;gap:12px;min-height:52px}
.u-b{flex:none;width:30px;height:30px;border-radius:15px;display:grid;place-items:center}
</style>
</helmet>
<div class="{{motionClass}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C1016; color: #E6E9EF; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; font-size: 15px; line-height: 22px">

<section class="u-in" style="margin: 10px 10px 0; border-radius: 48px; background: #0F4A2A; padding: 10px 10px 18px; position: relative; overflow: hidden">
<button type="button" aria-label="Back" style="position: relative; width: 48px; height: 48px; border: 0; border-radius: 24px; background: rgba(0,20,10,.45); display: grid; place-items: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px">
<svg role="img" aria-label="Step 2 of 3, 65 percent" width="170" height="170" viewBox="0 0 210 210" style="flex: none">
<g class="u-turn"><circle cx="105" cy="105" r="90" fill="none" stroke="#1C7A45" stroke-width="26" stroke-dasharray="0 31.4" stroke-linecap="round"/></g>
<circle cx="105" cy="105" r="90" fill="none" stroke="#0A3520" stroke-width="14"/>
<circle class="u-ring" cx="105" cy="105" r="90" fill="none" stroke="#A8F5C2" stroke-width="14" stroke-linecap="round" transform="rotate(-90 105 105)"/>
<text x="105" y="122" text-anchor="middle" font-family="Roboto Flex, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">65</text>
</svg>
<div style="flex: 1; min-width: 0"><div style="font-size: 12px; font-weight: 800; letter-spacing: .1em; color: #A8F5C2">UPDATING · 2 OF 3</div><h1 style="margin: 2px 0 0; font-size: 28px; line-height: 30px; font-weight: 900; font-stretch: 114%; letter-spacing: -0.02em; color: #FFFFFF">Core to build 537</h1><p style="margin: 4px 0 0; font-size: 13px; line-height: 18px; color: #CFF9DD">Started 09:15 · about 2 min left</p></div>
</div>
</section>

<section class="u-in" style="animation-delay: .08s; margin: 10px 10px 0; border-radius: 32px; background: #171C24; padding: 10px 16px">
<div class="u-step"><div class="u-b" style="background: #7FE0A2"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0C1016" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div><div style="flex: 1; min-width: 0"><div style="font-weight: 700">Backup made and checked</div><div style="font-size: 13px; color: #B9C0CC">09:15 · 108 MB</div></div></div>
<div class="u-step"><div class="u-b" style="background: #7FE0A2"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0C1016" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div><div style="flex: 1; min-width: 0"><div style="font-weight: 700">Supervisor</div><div style="font-size: 13px; color: #B9C0CC">536 to 537 · took 0:41</div></div></div>
<div class="u-step"><div class="u-b u-pulse" style="background: {{accent}}"><div style="width: 10px; height: 10px; border-radius: 5px; background: #06203A"></div></div><div style="flex: 1; min-width: 0"><div style="font-weight: 800; color: #FFFFFF">Core</div><div style="font-size: 13px; color: #B9C0CC">Restarting now. This page comes back by itself.</div></div></div>
<div class="u-step"><div class="u-b" style="border: 2px solid #3A4352; box-sizing: border-box"></div><div style="flex: 1; min-width: 0; color: #8A93A0"><div style="font-weight: 700">Two apps</div><div style="font-size: 13px">Waiting</div></div></div>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 10px 10px 0">
<button type="button" class="u-in" style="animation-delay: .16s; height: 128px; border: 0; border-radius: 30px; background: #13337F; color: #C9D8FF; padding: 14px; text-align: left; font-family: inherit; position: relative; overflow: hidden"><svg aria-hidden="true" width="80" height="80" viewBox="0 0 80 80" style="position: absolute; right: -16px; top: -16px"><rect x="12" y="12" width="56" height="56" rx="20" fill="#2A56C6" transform="rotate(14 40 40)"/></svg><div style="font-size: 38px; line-height: 38px; font-weight: 900; font-stretch: 118%; color: #FFFFFF">7</div><div style="font-size: 14px; font-weight: 800">Backups</div><div style="font-size: 12px">Last one 09:15, checked</div></button>
<button type="button" class="u-in" style="animation-delay: .22s; height: 128px; border: 0; border-radius: 30px; background: #3A1F66; color: #DCC6FF; padding: 14px; text-align: left; font-family: inherit; position: relative; overflow: hidden"><svg aria-hidden="true" width="80" height="80" viewBox="0 0 80 80" style="position: absolute; right: -18px; top: -12px"><rect x="6" y="22" width="68" height="36" rx="18" fill="#6B45B8" transform="rotate(-20 40 40)"/></svg><div style="font-size: 38px; line-height: 38px; font-weight: 900; font-stretch: 118%; color: #FFFFFF">536</div><div style="font-size: 14px; font-weight: 800">Go back</div><div style="font-size: 12px">A backup is made first</div></button>
</div>

<section class="u-in" style="animation-delay: .28s; margin: 10px 10px 0; border-radius: 32px; background: #171C24; padding: 14px 16px">
<div style="font-size: 12px; font-weight: 800; letter-spacing: .1em; color: #B9C0CC">AUTOMATIC UPDATES</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px"><div style="flex: 1; min-width: 0"><div style="font-weight: 700">Core</div><div style="font-size: 13px; color: #B9C0CC">Off. Nothing installs without a press.</div></div><div role="img" aria-label="Off" style="flex: none; width: 52px; height: 32px; box-sizing: border-box; border-radius: 16px; border: 2px solid #8A93A0; position: relative"><div style="position: absolute; left: 6px; top: 6px; width: 16px; height: 16px; border-radius: 8px; background: #8A93A0"></div></div></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9CC8FF","options":["#9CC8FF","#7FE0A2","#F2B62E","#B9A2FF"]},"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#9CC8FF', motionClass: (this.props.motion ?? true) ? '' : 'u-still' };
}
}
</script>
</body>
</html>
