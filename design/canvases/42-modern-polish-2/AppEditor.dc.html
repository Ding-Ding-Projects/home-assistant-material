<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Automation editor, today's look polished</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#1A1E25}
@keyframes t-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.t-in{animation:t-in .32s cubic-bezier(.2,.9,.3,1) both}
.t-still .t-in{animation:none}
@media (prefers-reduced-motion:reduce){.t-in{animation:none}}
.t-ib{width:48px;height:48px;border:0;border-radius:24px;background:transparent;display:grid;place-items:center;flex:none}
.t-seg{flex:1;min-width:0;height:48px;border:0;border-radius:24px;background:transparent;color:#E3E6EC;font-family:inherit;font-size:14px;font-weight:700}
.t-card{border-radius:20px;background:#14181E;padding:14px}
.t-num{flex:none;width:28px;height:28px;border-radius:14px;background:#1D3F8F;color:#FFFFFF;font-size:14px;font-weight:700;display:grid;place-items:center}
.t-tag{flex:none;height:28px;border-radius:14px;background:#0F2A6B;color:#FFFFFF;font-size:13px;font-weight:700;padding:0 12px;display:flex;align-items:center}
.t-item{margin-top:10px;min-height:56px;box-sizing:border-box;border-radius:16px;background:#252A32;padding:8px 4px 8px 12px;display:flex;align-items:center;gap:12px}
.t-add{margin-top:10px;height:48px;border:2px dashed #444A54;border-radius:24px;background:transparent;color:#E3E6EC;font-family:inherit;font-size:14px;font-weight:500;padding:0 18px 0 12px;display:inline-flex;align-items:center;gap:8px}
.t-act{flex:1;min-width:0;height:56px;border:0;border-radius:28px;background:transparent;color:#E3E6EC;font-family:inherit;font-size:12px;font-weight:500;display:grid;justify-items:center;align-content:center;gap:2px}
.t-nav{position:absolute;left:12px;right:12px;bottom:10px;height:64px;box-sizing:border-box;border-radius:32px;background:#20252D;box-shadow:0 8px 22px rgba(0,0,0,.5);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px}
.t-nav a{display:grid;justify-items:center;align-content:center;gap:1px;color:#C3C9D3;text-decoration:none;font-size:12px;font-weight:500;border-radius:26px}
</style>
</helmet>
<div class="{{motionClass}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #1A1E25; color: #E3E6EC; font-family: Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-direction: column">

<header style="flex: none; height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 4px; background: #14181E">
<button type="button" class="t-ib" aria-label="Back" style="background: #20252D; width: 40px; height: 40px; margin: 0 4px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E3E6EC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-7l-7 7 7 7"/></svg></button>
<h1 style="flex: 1; min-width: 0; margin: 0; font-size: 20px; line-height: 28px; font-weight: 700; color: #FFFFFF; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Hallway light at dusk</h1>
<button type="button" class="t-ib" aria-label="Page tools"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E3E6EC" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
<button type="button" class="t-ib" aria-label="More actions"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="#E3E6EC"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
</header>

<div role="tablist" aria-label="Editor mode" style="flex: none; margin: 8px 12px 0; padding: 4px; border-radius: 28px; background: #20252D; display: flex; gap: 4px">
<button type="button" role="tab" aria-selected="false" class="t-seg">Simple</button>
<button type="button" role="tab" aria-selected="true" class="t-seg" style="background: #0F2A6B; color: #FFFFFF">Advanced</button>
<button type="button" role="tab" aria-selected="false" class="t-seg">YAML</button>
</div>

<div style="flex: 1; min-height: 0; padding: 10px 12px 0; display: flex; flex-direction: column; gap: 10px">
<section class="t-card t-in">
<div style="display: flex; align-items: center; gap: 10px"><div class="t-num">1</div><div class="t-tag">When</div><div style="flex: 1; min-width: 0; font-size: 16px; color: #FFFFFF">Any of these happens</div></div>
<div class="t-item"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A8C7FA" stroke-width="2.2" stroke-linecap="round"><path d="M4 17h16M7 17a5 5 0 0 1 10 0M12 6v3M5.5 9.5l2 2M18.5 9.5l-2 2"/></svg><div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 700; color: #FFFFFF">The sun sets</div><div style="font-size: 12px; color: #B4BBC6">20 minutes before · last matched 18:42</div></div><button type="button" class="t-ib" aria-label="Actions for this trigger"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#E3E6EC"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button></div>
<button type="button" class="t-add"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E3E6EC" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add trigger</button>
</section>

<section class="t-card t-in" style="animation-delay: .04s">
<div style="display: flex; align-items: center; gap: 10px"><div class="t-num">2</div><div class="t-tag">And if</div><div style="flex: 1; min-width: 0; font-size: 16px; color: #FFFFFF">All of these are true</div></div>
<div class="t-item"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A8C7FA" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg><div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 700; color: #FFFFFF">Somebody is home</div><div style="font-size: 12px; color: #A8E6B8">True right now</div></div><button type="button" class="t-ib" aria-label="Actions for this condition"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#E3E6EC"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button></div>
</section>

<section class="t-card t-in" style="animation-delay: .08s">
<div style="display: flex; align-items: center; gap: 10px"><div class="t-num">3</div><div class="t-tag">Then do</div><div style="flex: 1; min-width: 0; font-size: 16px; color: #FFFFFF">In this order</div></div>
<div class="t-item"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="#A8C7FA"><path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/><rect x="9.5" y="17.5" width="5" height="2.5" rx="1"/></svg><div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 700; color: #FFFFFF">Turn on Hallway light</div><div style="font-size: 12px; color: #B4BBC6">At 62%, warm white</div></div><button type="button" class="t-ib" aria-label="Actions for this step"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#E3E6EC"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button></div>
</section>
</div>

<div role="toolbar" aria-label="Automation actions" style="position: absolute; left: 12px; right: 12px; bottom: 84px; height: 64px; box-sizing: border-box; border-radius: 32px; background: #20252D; box-shadow: 0 8px 22px rgba(0,0,0,.5); padding: 4px; display: flex; gap: 2px">
<button type="button" class="t-act"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#E3E6EC"><path d="M8 5l11 7-11 7z"/></svg>Run now</button>
<button type="button" class="t-act"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E3E6EC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4h4M11 4v5l-5 9a1.5 1.5 0 0 0 1.3 2h9.4a1.5 1.5 0 0 0 1.3-2l-5-9V4"/></svg>Check</button>
<button type="button" class="t-act"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E3E6EC" stroke-width="2.2" stroke-linecap="round"><path d="M9 4h6M10 4v12a2 2 0 0 0 4 0V4M10 11h4"/></svg>Dry run</button>
<button type="button" class="t-act" style="background: {{accent}}; color: #0B1F4A; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1F4A" stroke-width="2.2" stroke-linejoin="round"><path d="M5 5h11l3 3v11H5z"/><path d="M8 5v5h7V5M8 19v-5h8v5"/></svg>Save</button>
</div>

<nav class="t-nav" aria-label="Main">
<a href="#"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="#C3C9D3"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Home</a>
<a href="#"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C3C9D3" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</a>
<a href="#"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C3C9D3" stroke-width="2.2"><rect x="4" y="6" width="16" height="13" rx="2.5"/></svg>Pages</a>
<a href="#" style="background: #0F2A6B; color: #FFFFFF; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>Settings</a>
<a href="#"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C3C9D3" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A8C7FA","options":["#A8C7FA","#A8E6B8","#F2C86B","#CDB8FF"]},"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#A8C7FA', motionClass: (this.props.motion ?? true) ? '' : 't-still' };
}
}
</script>
</body>
</html>
