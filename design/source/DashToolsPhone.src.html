@@HEAD:Dashboard tools on a phone@@
<div class="row" style="min-height: 400px; padding: 40px 32px; gap: 0; align-items: flex-start">
<div class="col" style="gap: 28px; width: 100%"><header class="col" style="gap: 6px"><h1 class="hs">Dashboard tools on a phone</h1><p class="bm mu" style="max-width: 860px">The same dialog at 320 pixels, full screen.</p></header><div class="row" style="gap: 40px; align-items: flex-start; flex-wrap: wrap"><figure class="col" style="margin: 0; gap: 12px; width: 320px; flex: none"><div class="m3 col" role="group" aria-label="Phone screen, 320 pixels wide" style="width: 320px; height: 640px; border-radius: 28px; overflow: hidden; background: var(--surf); color: var(--on); box-shadow: 0 0 0 1px var(--outv), var(--e3); position: relative"><header class="row" style="gap: 4px; padding: 8px 4px 8px 4px; min-height: 64px; flex: none"><button class="ib" aria-label="Back">@@I:ArrowLeft@@</button><div class="col grow" style="padding: 0 4px"><h2 class="tm" style="font-size: 18px">Dashboard tools</h2></div><button class="ib" aria-label="Close">@@I:Close@@</button></header><div class="col grow" style="padding: 4px 16px 16px; gap: 10px; min-height: 0; overflow: hidden"><div style="overflow: hidden"><div class="seg" role="group" aria-label="Tools"><button class="sel" aria-pressed="true">Outline</button><button aria-pressed="false">Replace</button><button aria-pressed="false">Check</button></div></div><div style="flex: none"><div class="find grow" style="height: 44px; padding-right: 4px"><span class="row grow" style="gap: 10px">@@I:Magnify.s@@<span class="bm">Search cards</span></span><button class="ib" style="width: 40px; height: 40px" aria-label="Build a pattern search">@@I:Regex.s@@</button></div></div><div class="row" style="gap: 6px"><span class="bs mu">1 selected</span><button class="btn tonal sm">Duplicate</button><button class="ib" aria-label="Delete">@@I:Delete@@</button></div><div class="row" style="gap: 10px"><a class="tm" style="color: var(--p); text-decoration: underline">Home</a><code class="bs mu">/home</code></div><div class="row" style="gap: 12px; min-height: 36px; padding-inline-start: 0px"><span class="row" style="gap: 10px">@@I:CheckboxMarked@@<span class="row" style="gap: 8px"><div class="row" style="gap: 8px"><code class="bs" style="color: var(--p)">entities</code><span class="bm">Lights</span></div></span></span><span class="bs mu">3 entities</span></div><div class="row" style="gap: 12px; min-height: 36px; padding-inline-start: 0px"><span class="row" style="gap: 10px">@@I:CheckboxBlankOutline@@<span class="row" style="gap: 8px"><div class="row" style="gap: 8px"><code class="bs" style="color: var(--p)">tile</code><span class="bm">light.hall</span></div></span></span><span class="bs mu">1 entity</span></div></div></div><figcaption class="bs mu" style="padding: 0 8px">On a phone the dialog fills the screen; the bulk row keeps Duplicate and Delete, the rest are in Select all shown.</figcaption></figure><figure class="col" style="margin: 0; gap: 12px; width: 320px; flex: none"><div class="m3 col" role="group" aria-label="Phone screen, 320 pixels wide" style="width: 320px; height: 640px; border-radius: 28px; overflow: hidden; background: var(--surf); color: var(--on); box-shadow: 0 0 0 1px var(--outv), var(--e3); position: relative"><header class="row" style="gap: 4px; padding: 8px 4px 8px 4px; min-height: 64px; flex: none"><button class="ib" aria-label="Back">@@I:ArrowLeft@@</button><div class="col grow" style="padding: 0 4px"><h2 class="tm" style="font-size: 18px">Dashboard tools</h2></div></header><div class="col grow" style="padding: 4px 16px 16px; gap: 10px; min-height: 0; overflow: hidden"><div style="overflow: hidden"><div class="seg" role="group" aria-label="Tools"><button aria-pressed="false">Outline</button><button class="sel" aria-pressed="true">Replace</button><button aria-pressed="false">Check</button></div></div><div class="col"><label class="field"><span class="col grow"><span class="bs mu">Replace entity ID</span><span class="bl mono">light.kitchen</span></span></label></div><div class="col"><label class="field"><span class="col grow"><span class="bs mu">With entity ID</span><span class="bl mono">light.kitchen_ceiling</span></span></label></div><span class="bs mu">4 places will change.</span><button class="btn fill">Replace everywhere</button></div></div><figcaption class="bs mu" style="padding: 0 8px">Find and replace stacks the two fields.</figcaption></figure><figure class="col" style="margin: 0; gap: 12px; width: 320px; flex: none"><div class="m3 dark col" role="group" aria-label="Phone screen, 320 pixels wide" style="width: 320px; height: 640px; border-radius: 28px; overflow: hidden; background: var(--surf); color: var(--on); box-shadow: 0 0 0 1px var(--outv), var(--e3); position: relative"><header class="row" style="gap: 4px; padding: 8px 4px 8px 4px; min-height: 64px; flex: none"><button class="ib" aria-label="Back">@@I:ArrowLeft@@</button><div class="col grow" style="padding: 0 4px"><h2 class="tm" style="font-size: 18px">Dashboard tools</h2></div></header><div class="col grow" style="padding: 4px 16px 16px; gap: 10px; min-height: 0"><div style="overflow: hidden"><div class="seg" role="group" aria-label="Tools"><button class="sel" aria-pressed="true">Check</button><button aria-pressed="false">Templates</button><button aria-pressed="false">Statistics</button></div></div><span class="bm">2 problems found.</span><div class="note warn">@@I:AlertOutline@@<span class="bm">Entity does not exist: sensor.old_garage</span></div><div class="note">@@I:InformationOutline@@<span class="bm">Empty section: Bedroom</span></div></div></div><figcaption class="bs mu" style="padding: 0 8px">The check in the dark scheme.</figcaption></figure></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px"><section class="card col" aria-label="What this board settles" style="gap: 12px; padding: 24px; background: var(--sl1)"><h2 class="tm">What this board settles</h2><ul class="col" style="gap: 10px; margin: 0; padding: 0; list-style: none"><li class="row bm" style="gap: 10px; align-items: flex-start"><span style="color: var(--p); margin-top: -2px">@@I:CheckCircle.s@@</span><span>Tabs scroll sideways; the selected one stays in view.</span></li><li class="row bm" style="gap: 10px; align-items: flex-start"><span style="color: var(--p); margin-top: -2px">@@I:CheckCircle.s@@</span><span>Every control is at least 40 pixels tall.</span></li></ul></section></div></div>
</div>
