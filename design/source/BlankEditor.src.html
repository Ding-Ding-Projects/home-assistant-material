@@HEAD:Starting points for a new dashboard@@
@@SURF:Home|New dashboard|680@@
<div class="col grow" style="padding: 8px 40px 40px; gap: 24px">
<p class="bl mu" style="max-width: 680px">Start from something real. Each starting point says exactly what it will create, and it can be undone from History.</p>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
<button class="card col" style="background: var(--pc); color: var(--on-pc); gap: 12px; text-align: left; padding: 20px; box-shadow: 0 0 0 3px var(--p)"><span class="sq" style="color: var(--on-pc)">@@I:HomeAutomation.l@@</span><span class="tl">Your home's defaults</span><span class="bm">5 rooms, 42 devices, built the same way as the Home page. Same result as Reset to defaults.</span><span class="tag" style="background: var(--sl0); margin-top: auto">Creates 5 sections, 23 cards</span></button>
<button class="card col" style="padding: 20px; gap: 12px; text-align: left"><span class="sq">@@I:Sofa.l@@</span><span class="tl">One room</span><span class="bm mu">Pick a room. Lights, climate and media for that room only.</span><span class="tag" style="background: var(--sl0); margin-top: auto">Creates 1 section, 4 to 8 cards</span></button>
<button class="card col" style="padding: 20px; gap: 12px; text-align: left"><span class="sq">@@I:TabletDashboard.l@@</span><span class="tl">Wall tablet</span><span class="bm mu">Large targets, compact density, no navigation rail.</span><span class="tag" style="background: var(--sl0); margin-top: auto">Creates 1 view, 9 cards, sets density</span></button>
<button class="card col" style="padding: 20px; gap: 12px; text-align: left"><span class="sq">@@I:LightningBolt.l@@</span><span class="tl">Energy only</span><span class="bm mu">Live power, solar and grid from your 3 energy sources.</span><span class="tag" style="background: var(--sl0); margin-top: auto">Creates 4 cards</span></button>
<button class="card col" style="padding: 20px; gap: 12px; text-align: left; background: transparent; box-shadow: inset 0 0 0 2px var(--outv)"><span class="sq" style="background: var(--sl2)">@@I:Plus.l@@</span><span class="tl">Empty</span><span class="bm mu">Nothing is added. You place every card yourself.</span><span class="tag" style="margin-top: auto">Creates nothing</span></button>
</div>
<div class="row" style="gap: 12px"><div class="field grow" style="max-width: 420px"><span class="lm mu">Name</span><input class="bl grow" aria-label="Dashboard name" value="Upstairs" style="border: 0; outline: 0; background: transparent; min-width: 0"></div><span class="grow"></span><button class="btn out">Cancel</button><button class="btn lg fill">Create from your home's defaults</button></div>
</div>
@@/SURF@@
@@TAIL:1200,680@@
