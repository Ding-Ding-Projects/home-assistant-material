rules:
  action-setup:
    status: exempt
    comment: The actions are entity services registered by the sensor platform.
  appropriate-polling:
    status: done
    comment: Nothing is polled. The defender reacts to state changes and evaluates on a 30 second timer because its decisions depend on time.
  brands: todo
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: Every step, abort and error of the config, reconfigure and options flows is tested, including the shared band errors between the two defenders. Measured line coverage of both config flow modules is 100 percent.
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: No external requirements.
  docs-actions: todo
  docs-conditions:
    status: exempt
    comment: The integration has no conditions.
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: The integration has no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: The flow checks that the climate entity exists, can cool or heat, and that the temperatures are within its limits.
  test-before-setup:
    status: done
    comment: Setup raises not ready while the climate entity does not exist yet, and retries.
  unique-config-entry: done
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable:
    status: done
    comment: Every entity is unavailable while the defended climate entity is unavailable.
  integration-owner:
    status: todo
    comment: A code owner needs the maintainer's account name, which has to be added by the maintainer.
  log-when-unavailable: todo
  parallel-updates:
    status: exempt
    comment: No platform fetches data. Entities only read the coordinator.
  reauthentication-flow:
    status: exempt
    comment: No authentication.
  test-coverage:
    status: todo
    comment: Measured line coverage of both integrations together is 91 percent; the guard modules are below 95 percent.
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: The defended climate entity is chosen by the user.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Each entry has exactly one device.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: The next check and room holder sensors start disabled. The guard switches stay enabled because they are the controls.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: A missing climate entity and a missing chosen sensor each raise a repair issue that clears when the entity returns.
  stale-devices:
    status: exempt
    comment: Each entry has exactly one device that is removed with it.
  async-dependency: done
  inject-websession:
    status: exempt
    comment: No web requests.
  strict-typing: todo
