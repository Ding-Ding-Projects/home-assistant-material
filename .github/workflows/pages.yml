name: Project page

# Publishes the project documentation and the frontend's browser-only demo.

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/features/**"
      - "docs/wiki/**"
      - "docs/automation-repositories.md"
      - "docs/feature-status.md"
      - "docs/material-changes.md"
      - "frontend/**"
      - "build.sh"
      - ".github/workflows/pages.yml"
  # A new release changes the build line on the page, so the page is published again.
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  refresh-after-release:
    name: Request a project page refresh
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Start the project page workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    name: Publish the project page
    if: github.event_name != 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The page lists the newest 40 changes, so it needs that much history.
          fetch-depth: 50

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Build the interactive demo
        run: |
          corepack enable
          bash build.sh demo
          mkdir -p docs/site/demo
          cp -a frontend/demo/dist/. docs/site/demo/
          printf '{"source":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > docs/site/demo/build.json

      # Rewrites data.js only (changes, features, status, hero picture sizes). No picture is
      # converted or re-encoded and nothing else is copied.
      - name: Bring the page's data up to date
        run: python3 docs/site/build_site.py --data-only

      - name: Build complete documentation
        run: node docs/site/build-documentation.mjs

      - name: Point the download buttons at the newest Deploy Assistant
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=50" \
            --jq '[.[] | select(.tag_name | startswith("deploy-assistant-v"))][0] // {} | {tag: .tag_name, version: (.tag_name // "" | ltrimstr("deploy-assistant-v")), published: .published_at, assets: [(.assets // [])[] | {name, url: .browser_download_url, size}]}' \
            | { printf 'window.DEPLOY_RELEASE = '; cat; printf ';\n'; } > docs/site/deploy-release.js
          cat docs/site/deploy-release.js

      - name: Show the newest product build on the page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # When the lookup fails or finds nothing, the page says "See the releases page" instead.
          rel="$(gh api "repos/${{ github.repository }}/releases?per_page=50" \
            --jq '[.[] | select((.draft | not) and (.prerelease | not) and (.tag_name | test("^v[0-9]+(\\.[0-9]+)*$")))][0] // {} | {tag: .tag_name, published: .published_at, url: .html_url}')" || rel='{}'
          [ -n "$rel" ] || rel='{}'
          printf 'window.PRODUCT_RELEASE = %s;\n' "$rel" > docs/site/product-release.js
          cat docs/site/product-release.js

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Package the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
