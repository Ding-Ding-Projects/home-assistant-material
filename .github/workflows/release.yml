name: Release

# Every push to main that changes the product publishes one new tagged release,
# but only after the whole run has succeeded.
# This workflow runs no tests and no lint. It builds, packages and publishes.
#
# No GitHub release exists while the build jobs run. The build jobs upload their
# files as workflow artifacts, which also back up the release downloads. Publish
# needs every other job to have succeeded. It creates one normal release with every
# file, reads it back, and then moves the update feed. A failed or cancelled run
# publishes no release and does not move the feed. Container images are pushed by their own
# jobs, so an image tag can exist for a build that never becomes a release.
#
# Pushes that only touch documentation or design files build nothing and publish no
# release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Runs are queued one at a time. A run that has started always finishes and can
# publish. While one runs, at most one newer run waits; a still newer run replaces
# the waiting one before it starts, so a replaced run never builds anything. The
# next run compares itself with the last build that really has a release, so the code
# of a replaced or failed run is built by the next one.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Work out versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      own_lines: ${{ steps.lines.outputs.own }}
      files: ${{ steps.lines.outputs.files }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
      core: ${{ steps.v.outputs.core }}
      core_base: ${{ steps.v.outputs.core_base }}
      core_base_image: ${{ steps.v.outputs.core_base_image }}
      supervisor: ${{ steps.v.outputs.supervisor }}
      os: ${{ steps.v.outputs.os }}
      registry: ${{ steps.v.outputs.registry }}
      heavy: ${{ steps.v.outputs.heavy }}
      started: ${{ steps.v.outputs.started }}
      boards: ${{ steps.v.outputs.boards }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Work out versions
        id: v
        env:
          BUILD: ${{ github.run_number }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          core_base="$(jq -r .core versions.json)"
          core="${core_base}.${BUILD}"
          {
            echo "build=${BUILD}"
            echo "tag=v${core}"
            echo "core=${core}"
            echo "core_base=${core_base}"
            echo "core_base_image=$(jq -r .core_base_image versions.json)"
            echo "supervisor=$(jq -r .supervisor versions.json).${BUILD}"
            echo "os=$(jq -r .os versions.json).${BUILD}"
            echo "registry=ghcr.io/$(jq -r .registry_owner versions.json)"
            echo "started=$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
            echo "boards=$(jq -c .os_boards versions.json)"
          } >> "$GITHUB_OUTPUT"
          heavy=true
          if [ "${EVENT}" = "push" ]; then
            # Compared with the last build that published images, not with the
            # previous commit: a documentation-only push on top of unbuilt code
            # must still build that code. The update feed names that build.
            last="$(curl -fsSL --max-time 20 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/channel/stable.json" 2>/dev/null | jq -r '.homeassistant.default // empty' 2>/dev/null || true)"
            if [ -n "${last}" ] && git fetch --quiet --depth=1 origin "refs/tags/v${last}:refs/tags/v${last}" 2>/dev/null; then
              code_changes="$(git diff --name-only "v${last}" HEAD | grep -Ev '^(design/|docs/|deploy-assistant/|\.github/workflows/(pages|deploy-assistant)\.yml$|social-preview\.png$|[^/]+\.md$)' || true)"
              if [ -z "${code_changes}" ]; then
                heavy=false
              fi
            fi
          fi
          echo "heavy=${heavy}" >> "$GITHUB_OUTPUT"

      - name: Count lines
        id: lines
        run: |
          set -euo pipefail
          own="$(git ls-files -- . ':!core' ':!frontend' ':!supervisor' ':!operating-system' ':!landingpage' ':!version' | xargs -d '\n' cat 2>/dev/null | wc -l)"
          all="$(git ls-files | wc -l)"
          echo "own=${own}" >> "$GITHUB_OUTPUT"
          echo "files=${all}" >> "$GITHUB_OUTPUT"

  frontend:
    name: Build the frontend
    needs: prepare
    if: needs.prepare.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max_old_space_size=6144
      HUSKY: "0"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATERIAL_BUILD: ${{ needs.prepare.outputs.core }}
        run: |
          if ! ./node_modules/.bin/gulp build-app; then
            echo "::warning::Build with downloaded translations failed. Building again with English only."
            SKIP_FETCH_NIGHTLY_TRANSLATIONS=1 ./node_modules/.bin/gulp build-app
          fi

      - name: Package the wheel
        run: |
          python3 -m pip install build
          rm -rf dist home_assistant_frontend.egg-info
          python3 -m build -q
          ls -l dist
          sha256sum dist/*.whl

      # Used by the image builds and, at the end, attached to the release by publish.
      - name: Keep the wheel for the image builds and the release
        uses: actions/upload-artifact@v4
        with:
          name: frontend-wheel
          path: frontend/dist/*.whl
          if-no-files-found: error
          retention-days: 14

  translations:
    name: Collect integration translations
    needs: prepare
    if: needs.prepare.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Upstream downloads integration translations from its translation service with a
      # private token. The same files ship inside the upstream image for this core release,
      # so they are copied from there.
      - name: Copy translations from the upstream image
        env:
          CORE_BASE: ${{ needs.prepare.outputs.core_base }}
        run: |
          set -euo pipefail
          container="$(docker create "ghcr.io/home-assistant/amd64-homeassistant:${CORE_BASE}")"
          docker cp "${container}:/usr/src/homeassistant/homeassistant/components" components
          docker rm "${container}" >/dev/null
          find components -path '*/translations/*.json' | tar czf translations.tar.gz -T -
          echo "$(tar tzf translations.tar.gz | wc -l) translation files"

      - name: Keep the translations for the image builds
        uses: actions/upload-artifact@v4
        with:
          name: translations
          path: translations.tar.gz
          if-no-files-found: error
          retention-days: 14

  core:
    name: Build ${{ matrix.arch }} core images
    needs: [prepare, frontend, translations]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      REGISTRY: ${{ needs.prepare.outputs.registry }}
      CORE: ${{ needs.prepare.outputs.core }}
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
      SOURCE: https://github.com/${{ github.repository }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Stamp versions
        run: python3 scripts/ci/set-versions.py "${{ needs.prepare.outputs.build }}"

      - name: Fetch the frontend wheel
        uses: actions/download-artifact@v4
        with:
          name: frontend-wheel
          path: core

      - name: Fetch the translations
        uses: actions/download-artifact@v4
        with:
          name: translations
          path: .

      - name: Add translations and the image marker
        run: |
          set -euo pipefail
          tar xzf translations.tar.gz -C core/homeassistant
          rm translations.tar.gz
          echo "${GITHUB_SHA};${GITHUB_REF};${GITHUB_EVENT_NAME};${GITHUB_ACTOR}" > core/rootfs/OFFICIAL_IMAGE
          ls core/home_assistant_frontend-*.whl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the core image
        run: |
          set -euo pipefail
          docker buildx build core \
            --platform "${PLATFORM}" \
            --build-arg "BUILD_FROM=ghcr.io/home-assistant/${ARCH}-homeassistant-base:${{ needs.prepare.outputs.core_base_image }}" \
            --label "io.hass.arch=${ARCH}" \
            --label "io.hass.version=${CORE}" \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.version=${CORE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${REGISTRY}/${ARCH}-homeassistant:${CORE}" \
            --tag "${REGISTRY}/${ARCH}-homeassistant:latest" \
            --push

      - name: Build and push the machine images
        run: |
          set -euo pipefail
          for machine in $(jq -r --arg arch "${ARCH}" '.machines[$arch][]' versions.json); do
            echo "::group::${machine}"
            docker buildx build core/machine \
              --file "core/machine/${machine}" \
              --platform "${PLATFORM}" \
              --build-arg "BUILD_FROM=${REGISTRY}/${ARCH}-homeassistant:${CORE}" \
              --label "org.opencontainers.image.source=${SOURCE}" \
              --tag "${REGISTRY}/${machine}-homeassistant:${CORE}" \
              --tag "${REGISTRY}/${machine}-homeassistant:latest" \
              --push
            echo "::endgroup::"
          done

      - name: Build and push the landing page image
        run: |
          set -euo pipefail
          tags=()
          for machine in $(jq -r --arg arch "${ARCH}" '.machines[$arch][]' versions.json); do
            tags+=(--tag "${REGISTRY}/${machine}-homeassistant:landingpage")
          done
          docker buildx build landingpage \
            --platform "${PLATFORM}" \
            --label "io.hass.arch=${ARCH}" \
            --label "io.hass.version=landingpage" \
            --label "org.opencontainers.image.source=${SOURCE}" \
            "${tags[@]}" \
            --push

  supervisor:
    name: Build ${{ matrix.arch }} supervisor image
    needs: prepare
    if: needs.prepare.outputs.heavy == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      REGISTRY: ${{ needs.prepare.outputs.registry }}
      SUPERVISOR: ${{ needs.prepare.outputs.supervisor }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the supervisor image
        run: |
          set -euo pipefail
          mkdir -p supervisor/wheels
          docker buildx build supervisor \
            --platform "${{ matrix.platform }}" \
            --build-arg "BUILD_VERSION=${SUPERVISOR}" \
            --label "io.hass.arch=${ARCH}" \
            --label "io.hass.version=${SUPERVISOR}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${SUPERVISOR}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${REGISTRY}/${ARCH}-hassio-supervisor:${SUPERVISOR}" \
            --tag "${REGISTRY}/${ARCH}-hassio-supervisor:latest" \
            --push

  container:
    # Pushes the multi-architecture container image. This is not a release and does not
    # wait for one: the hosted instance moves to a build by this image tag long before
    # the operating system jobs end, so the tag can exist for a build that never
    # becomes a release.
    name: Publish the container image
    needs: [prepare, core, supervisor]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      public: ${{ steps.public.outputs.public }}
    env:
      REGISTRY: ${{ needs.prepare.outputs.registry }}
      CORE: ${{ needs.prepare.outputs.core }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the multi-architecture container image
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${REGISTRY}/home-assistant-material:${CORE}" \
            --tag "${REGISTRY}/home-assistant-material:latest" \
            "${REGISTRY}/amd64-homeassistant:${CORE}" \
            "${REGISTRY}/aarch64-homeassistant:${CORE}"
          docker buildx imagetools inspect "${REGISTRY}/home-assistant-material:${CORE}"

      - name: Check that the images can be pulled without signing in
        id: public
        run: |
          set -uo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          if docker manifest inspect "${REGISTRY}/home-assistant-material:${CORE}" >/dev/null 2>&1; then
            echo "public=true" >> "$GITHUB_OUTPUT"
            echo "Images are public." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The container images are not public. Devices cannot pull them until each package under the organization's Packages page is changed to Public."
            {
              echo "## Action needed: container images are private"
              echo
              echo "Open the organization's Packages page, and for each package of this repository choose Package settings, Change visibility, Public. Until then the operating system images and the updater cannot download these images."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  full:
    # The outer image of the full hosting mode (see docs/features/hosting/full-mode.md): a small
    # Docker engine plus the script that starts the Supervisor inside it. It carries no core and
    # no Supervisor, which the Supervisor downloads itself from the images above, so it does not
    # wait for them. It is tagged with the core version so it is listed beside the plain image.
    name: Build the full hosting mode image
    needs: prepare
    if: needs.prepare.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ${{ needs.prepare.outputs.registry }}
      CORE: ${{ needs.prepare.outputs.core }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the full hosting mode image
        run: |
          set -euo pipefail
          docker buildx build hosting/full \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${CORE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${REGISTRY}/home-assistant-material-full:${CORE}" \
            --tag "${REGISTRY}/home-assistant-material-full:latest" \
            --push
          docker buildx imagetools inspect "${REGISTRY}/home-assistant-material-full:${CORE}"

  os:
    name: Build the ${{ matrix.board.id }} operating system image
    needs: [prepare, container]
    runs-on: ubuntu-24.04
    # An operating system build takes one to two hours. The release waits for every
    # board: a run whose operating system jobs fail or are cancelled publishes nothing.
    # A run that has started is never replaced by a newer push (see the workflow-level
    # concurrency group), so these jobs get to finish.
    timeout-minutes: 350
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.prepare.outputs.boards) }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      OS: ${{ needs.prepare.outputs.os }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free space on the build drive
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force >/dev/null
          sudo mkdir -p /mnt/cache /mnt/output
          sudo chown -R "$(id -u):$(id -g)" /mnt/cache /mnt/output
          df -h / /mnt

      - name: Stamp versions and pin the container versions
        run: |
          set -euo pipefail
          python3 scripts/ci/set-versions.py "${{ needs.prepare.outputs.build }}"
          python3 scripts/ci/make-channel-json.py "${{ needs.prepare.outputs.build }}" operating-system/version-pinned.json

      - name: Prepare the update signing key
        id: key
        env:
          RAUC_CERTIFICATE: ${{ secrets.RAUC_CERTIFICATE }}
          RAUC_PRIVATE_KEY: ${{ secrets.RAUC_PRIVATE_KEY }}
        working-directory: operating-system
        run: |
          set -euo pipefail
          if [ -n "${RAUC_CERTIFICATE}" ] && [ -n "${RAUC_PRIVATE_KEY}" ]; then
            printf '%s\n' "${RAUC_CERTIFICATE}" > cert.pem
            printf '%s\n' "${RAUC_PRIVATE_KEY}" > key.pem
            echo "persistent=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No RAUC_CERTIFICATE and RAUC_PRIVATE_KEY secrets. This image is signed with a one-time key, so operating system updates over the air are not offered for it."
            buildroot-external/scripts/generate-signing-key.sh cert.pem key.pem
            echo "persistent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/cache/cc
          key: haos-cc-${{ matrix.board.id }}-${{ github.run_id }}
          restore-keys: haos-cc-${{ matrix.board.id }}-

      - name: Build the builder container
        run: docker build --tag haos-builder operating-system

      - name: Build the image
        env:
          DEFCONFIG: ${{ matrix.board.defconfig }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          auth="$(printf '%s:%s' "${ACTOR}" "${GH_TOKEN}" | base64 -w0)"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "${auth}" > operating-system/.registry-auth.json
          docker run --rm --privileged \
            -e BUILDER_UID="$(id -u)" \
            -e BUILDER_GID="$(id -g)" \
            -v "${GITHUB_WORKSPACE}/operating-system:/build" \
            -v /mnt/cache:/cache \
            -v /mnt/output:/build/output \
            haos-builder \
            bash -c "mkdir -p ~/.docker && cp /build/.registry-auth.json ~/.docker/config.json && make HAOS_VERSION_JSON=/build/version-pinned.json ${DEFCONFIG}"
          rm -f operating-system/.registry-auth.json
          ls -l /mnt/output/images/haos_* || true

      - name: Write the checksums
        working-directory: /mnt/output/images
        run: |
          set -euo pipefail
          sha256sum haos_* > "SHA256SUMS.${{ matrix.board.id }}"
          cat "SHA256SUMS.${{ matrix.board.id }}"
          {
            echo "## ${{ matrix.board.label }} (${{ matrix.board.id }})"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in haos_*; do echo "| ${f} | $(du -h "${f}" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      # The images are already compressed, so they are stored without compressing again.
      # The publish job attaches them to the release once every job has succeeded.
      - name: Keep the images for the release
        uses: actions/upload-artifact@v4
        with:
          name: release-os-${{ matrix.board.id }}
          path: |
            /mnt/output/images/haos_*
            /mnt/output/images/SHA256SUMS.${{ matrix.board.id }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Record whether updates over the air can be offered
        run: echo "${{ steps.key.outputs.persistent }}" > persistent.txt

      - name: Keep the signing result
        uses: actions/upload-artifact@v4
        with:
          name: os-signing-${{ matrix.board.id }}
          path: persistent.txt
          retention-days: 14

      - name: Save the compiler cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: /mnt/cache/cc
          key: haos-cc-${{ matrix.board.id }}-${{ github.run_id }}

  # The Deploy Assistant desktop app is built by its own workflow and published as
  # deploy-assistant-v* releases. Its newest files are copied onto every release
  # here, so one release page holds the images and the app that installs them. The
  # files are staged as an artifact and attached by the publish job.
  assistant:
    name: Stage the Deploy Assistant
    needs: prepare
    if: needs.prepare.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.copy.outputs.latest }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the newest Deploy Assistant files
        id: copy
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '[.[] | select(.tag_name | startswith("deploy-assistant-v")) | select(.draft | not) | select((.assets | length) > 0)][0].tag_name // empty')"
          if [ -z "${latest}" ]; then
            echo "No Deploy Assistant release with files exists yet."
            exit 1
          fi
          mkdir files
          gh release download "${latest}" --repo "${GITHUB_REPOSITORY}" --dir files
          # RELEASES and SHA256SUMS are generic names: keep them apart from the image files.
          if [ -f files/SHA256SUMS ]; then mv files/SHA256SUMS files/SHA256SUMS.deploy-assistant; fi
          ls -la files
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"

      - name: Keep the files for the release
        uses: actions/upload-artifact@v4
        with:
          name: release-assistant
          path: files/*
          if-no-files-found: error
          retention-days: 14

  # The only job that creates the release. It runs only when every job above it
  # succeeded (no always(): a failed, cancelled or skipped job skips this one), so a
  # release is never created for a build that is partial or failed. A push that changed
  # documentation or design files only skips every build job and therefore this one.
  publish:
    name: Publish the release
    needs: [prepare, frontend, translations, core, supervisor, container, full, os, assistant]
    if: needs.prepare.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      CORE: ${{ needs.prepare.outputs.core }}
      BUILD: ${{ needs.prepare.outputs.build }}
      SUPERVISOR: ${{ needs.prepare.outputs.supervisor }}
      OS: ${{ needs.prepare.outputs.os }}
      REGISTRY: ${{ needs.prepare.outputs.registry }}
      BOARDS: ${{ needs.prepare.outputs.boards }}
      STARTED: ${{ needs.prepare.outputs.started }}
      OWN_LINES: ${{ needs.prepare.outputs.own_lines }}
      FILES: ${{ needs.prepare.outputs.files }}
      PUBLIC: ${{ needs.container.outputs.public }}
      ASSISTANT_TAG: ${{ needs.assistant.outputs.latest }}
      R_FRONTEND: ${{ needs.frontend.result }}
      R_CORE: ${{ needs.core.result }}
      R_SUPERVISOR: ${{ needs.supervisor.result }}
      R_CONTAINER: ${{ needs.container.result }}
      R_FULL: ${{ needs.full.result }}
      R_OS: ${{ needs.os.result }}
      R_ASSISTANT: ${{ needs.assistant.result }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the frontend wheel
        uses: actions/download-artifact@v4
        with:
          name: frontend-wheel
          path: staged/frontend-wheel

      - name: Fetch the staged release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: staged
          merge-multiple: false

      - name: Fetch the signing results
        uses: actions/download-artifact@v4
        with:
          pattern: os-signing-*
          path: signing
          merge-multiple: false

      - name: Create the release, read it back and move the update feed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || github.token }}
        run: |
          set -euo pipefail

          # Anything that fails after this point removes the release and its tag, so
          # nothing partial stays. The update feed moves last, so it never points at a
          # build without a complete release.
          armed=0
          rollback() {
            status=$?
            if [ "${armed}" = "1" ] && [ "${status}" != "0" ]; then
              echo "::warning::Publishing failed. Removing release ${TAG} and its tag."
              gh release delete "${TAG}" --yes --cleanup-tag || true
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
            fi
          }
          trap rollback EXIT

          # Check the staged files before anything is created.
          ls staged/frontend-wheel/*.whl >/dev/null
          for id in $(jq -r '.[].id' <<< "${BOARDS}"); do
            dir="staged/release-os-${id}"
            test -f "${dir}/SHA256SUMS.${id}" || { echo "::error::No checksums for ${id}."; exit 1; }
            compgen -G "${dir}/haos_*" >/dev/null || { echo "::error::No operating system image for ${id}."; exit 1; }
          done
          compgen -G "staged/release-assistant/*" >/dev/null || { echo "::error::No Deploy Assistant files."; exit 1; }

          # The update feed file that goes with the release.
          mkdir out
          python3 scripts/ci/make-channel-json.py "${BUILD}" out/stable.json

          find staged out -type f | LC_ALL=C sort > file-list.txt
          duplicates="$(while IFS= read -r f; do basename "${f}"; done < file-list.txt | sort | uniq -d)"
          if [ -n "${duplicates}" ]; then
            echo "::error::Two staged files share a name: ${duplicates}"
            exit 1
          fi
          mapfile -t files < file-list.txt
          echo "${#files[@]} files to attach"

          # Release notes.
          {
            echo "## Home Assistant Material ${CORE}"
            echo
            echo "Source: ${GITHUB_SHA}"
            echo
            # When this build was published, in 24-hour form: Toronto time first, then UTC.
            echo "Updated: $(TZ=America/Toronto date '+%-d %B %Y at %H:%M %Z'), which is $(date --utc '+%Y-%m-%d %H:%M') UTC."
            echo
            echo "This release was published after every build job of its run had succeeded, so every file listed below is attached."
            echo
            echo "| Part | Version | Where |"
            echo "| --- | --- | --- |"
            echo "| Container image (amd64 and arm64) | ${CORE} | \`${REGISTRY}/home-assistant-material:${CORE}\` |"
            echo "| Core images per machine | ${CORE} | \`${REGISTRY}/<machine>-homeassistant:${CORE}\` |"
            echo "| Supervisor images | ${SUPERVISOR} | \`${REGISTRY}/<arch>-hassio-supervisor:${SUPERVISOR}\` |"
            echo "| Operating system images | ${OS} | attached files named \`haos_<board>-${OS}\` |"
            echo "| Frontend wheel | $(jq -r .frontend versions.json) | attached \`.whl\` file |"
            echo
            echo "### Container images"
            echo
            echo "\`docker pull ${REGISTRY}/home-assistant-material:${CORE}\`"
            echo
            echo "Container images are pushed by their own jobs before the operating system images finish, so the tag of a build that never became a release can exist in the registry."
            if [ "${PUBLIC}" != "true" ]; then
              echo
              echo "The images are currently private in the container registry. They must be made public in the organization's Packages settings before a device can pull them."
            fi
            echo
            echo "### Operating system images"
            for id in $(jq -r '.[].id' <<< "${BOARDS}"); do
              echo
              echo "$(jq -r --arg id "${id}" '.[] | select(.id == $id) | "**\(.label)** (\(.id))"' <<< "${BOARDS}")"
              echo
              echo "| File | Size |"
              echo "| --- | --- |"
              for f in staged/release-os-${id}/haos_*; do echo "| $(basename "${f}") | $(du -h "${f}" | cut -f1) |"; done
            done
            echo
            echo "### Deploy Assistant"
            echo
            echo "The desktop app that installs and manages this product is attached: \`HAM-Deploy-Assistant-Setup.exe\` for Windows, the \`.deb\` or Linux \`.zip\`, and the macOS \`.zip\`. These are the files of ${ASSISTANT_TAG}, copied unchanged; check them against \`SHA256SUMS.deploy-assistant\`. Nothing is code-signed."
            echo
            echo "### Checks"
            echo
            echo "This workflow runs no tests and no lint. Nothing in this release is claimed to be tested by the release pipeline. Job results for this run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "### Build results"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Frontend | ${R_FRONTEND} |"
            echo "| Core and machine images | ${R_CORE} |"
            echo "| Supervisor images | ${R_SUPERVISOR} |"
            echo "| Container image | ${R_CONTAINER} |"
            echo "| Full hosting mode image | ${R_FULL} |"
            echo "| Operating system images | ${R_OS} |"
            echo "| Deploy Assistant files | ${R_ASSISTANT} |"
            echo
            finished="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
            seconds=$(( $(date --utc --date "${finished}" +%s) - $(date --utc --date "${STARTED}" +%s) ))
            echo "Workflow started ${STARTED}, release created ${finished}, ${seconds} seconds end to end."
            echo
            echo "### Size"
            echo
            echo "${FILES} tracked files. ${OWN_LINES} lines outside the vendored upstream folders, counted by this workflow."
          } > notes.md

          # The release is a normal release: no draft and no prerelease flag.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1 || gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag or release ${TAG} already exists. It is left untouched."
            exit 1
          fi
          gh release create "${TAG}" "${files[@]}" --target "${GITHUB_SHA}" --title "Home Assistant Material ${CORE}" --notes-file notes.md
          armed=1

          gh release view "${TAG}" --json isDraft,isPrerelease,assets > readback.json
          python3 scripts/ci/check-release.py readback.json file-list.txt

          # The release is complete. Move the update feed. Operating system entries
          # advance only when all boards report that they used the persistent key.
          os_args=(--os "${TAG}")
          for id in $(jq -r '.[].id' <<< "${BOARDS}"); do
            if ! cmp -s "signing/os-signing-${id}/persistent.txt" <(printf 'true\n'); then
              echo "No persistent signing confirmation for ${id}. Keeping the existing operating system feed entries."
              os_args=()
              break
            fi
          done
          scripts/ci/publish-channel.sh "${BUILD}" "${os_args[@]}"
          armed=0
          gh release view "${TAG}" --json tagName,isDraft,isPrerelease,url

      - name: Record release recovery information
        if: ${{ always() }}
        continue-on-error: true
        env:
          PUBLISH_STATUS: ${{ job.status }}
        run: |
          mkdir -p recovery
          printf 'Run: %s/%s/actions/runs/%s\nSource: %s\nRelease: %s\nJob status: %s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$GITHUB_SHA" "$TAG" "$PUBLISH_STATUS" > recovery/build.txt
          for name in notes.md file-list.txt readback.json; do
            if [ -f "$name" ]; then cp "$name" recovery/; fi
          done
          if [ -f out/stable.json ]; then cp out/stable.json recovery/; fi
          if [ -d signing ]; then
            find signing -type f -name persistent.txt -print0 |
              while IFS= read -r -d '' name; do
                cp "$name" "recovery/$(basename "$(dirname "$name")").txt"
              done
          fi
          {
            printf '\n### Backup downloads\n\n'
            printf 'The run keeps the frontend wheel, operating system images and Deploy Assistant files under Artifacts.\n'
            printf 'Use the source and release in the recovery artifact to verify a manual release.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release recovery information
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: publication-recovery-${{ github.run_attempt }}
          path: recovery/
          if-no-files-found: warn
          retention-days: 14
