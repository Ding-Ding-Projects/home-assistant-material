name: Deploy Assistant

# Builds the Deploy Assistant desktop app for Windows (Squirrel: Setup.exe, RELEASES, .nupkg),
# Linux (.deb and .zip) and macOS (.zip), and publishes them as their own release. Nothing is
# code-signed. The project page is rebuilt afterwards so its download buttons point at the files.

on:
  push:
    branches: [main]
    paths:
      - "deploy-assistant/**"
      - ".github/workflows/deploy-assistant.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-assistant
  cancel-in-progress: false

jobs:
  # Every build has a dim sum code name from the public catalog (Ding-Ding-Projects/dim-sum-photos):
  # the first dish, in catalog order, whose photo is published and that no earlier Deploy Assistant
  # release used. If none can be resolved, the build ships with its version alone.
  codename:
    name: Choose the code name
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pick.outputs.name }}
      photo: ${{ steps.pick.outputs.photo }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          curl -fsSL https://raw.githubusercontent.com/Ding-Ding-Projects/dim-sum-photos/main/catalog/index.json -o catalog.json || exit 0
          gh api "repos/Ding-Ding-Projects/dim-sum-photos/releases?per_page=100" > photos.json || exit 0
          gh api "repos/${REPO}/releases?per_page=100" --paginate > ours.json || echo '[]' > ours.json
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          cat = json.load(open('catalog.json'))
          assets = {}
          for r in json.load(open('photos.json')):
              if r['tag_name'].startswith('catalog-v1') and not r.get('draft'):
                  for a in r.get('assets', []):
                      assets[a['name']] = a['browser_download_url']
          used = set()
          for r in json.load(open('ours.json')):
              if r['tag_name'].startswith('deploy-assistant-v'):
                  for line in (r.get('body') or '').splitlines():
                      if line.startswith('Code name: '):
                          used.add(line[len('Code name: '):].split(' (')[0].strip())
          for d in cat.get('dishes', []):
              name = d['name']['en'] + ' · ' + d['name']['zhHant']
              url = assets.get(os.path.basename(d.get('image', {}).get('path', '')))
              if url and name not in used:
                  print('name=' + name)
                  print('photo=' + url)
                  break
          EOF
  build:
    name: Build on ${{ matrix.os }}
    needs: codename
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deploy-assistant
    steps:
      # Git on Windows refuses to read some file names in the operating-system folder, even when
      # the sparse checkout leaves them out. They are never written here, so the check is turned off.
      - name: Allow the repository's file names on Windows
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        run: git config --global core.protectNTFS false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Only what the app needs: the rest of the repository has paths Windows cannot check out.
          sparse-checkout: |
            deploy-assistant
            docs/site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy-assistant/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Set the version
        shell: bash
        # Major and minor come from package.json; the patch number is this run's number.
        run: npm version --no-git-tag-version "$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${GITHUB_RUN_NUMBER}"
      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg
      - name: Build the installers
        shell: bash
        env:
          HAM_CODENAME: ${{ needs.codename.outputs.name }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ""
          WIN_CSC_LINK: ""
        run: npm run make
      - name: Collect
        shell: bash
        run: |
          mkdir -p ../dist-da
          find out/make -type f \( -name '*.exe' -o -name '*.nupkg' -o -name 'RELEASES' -o -name '*.deb' -o -name '*.zip' \) -print0 | while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in RELEASES) base="RELEASES" ;; *.zip) base="$(echo "$base" | tr ' ' '-' | sed "s/\.zip$/-${RUNNER_OS}.zip/")" ;; *) base="$(echo "$base" | tr ' ' '-')" ;; esac
            cp "$f" "../dist-da/$base"
          done
          ls -la ../dist-da
      - uses: actions/upload-artifact@v4
        with:
          name: da-${{ matrix.os }}
          path: dist-da/*

  release:
    name: Publish the release
    needs: [codename, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CODE_NAME: ${{ needs.codename.outputs.name }}
          CODE_PHOTO: ${{ needs.codename.outputs.photo }}
        run: |
          set -euo pipefail
          # The version the build jobs stamped, read from the Debian package's name.
          VERSION="$(ls files/ham-deploy-assistant_*_amd64.deb | sed -E 's/.*_([0-9.]+)_amd64\.deb/\1/')"
          TAG="deploy-assistant-v${VERSION}"
          cd files
          sha256sum * > SHA256SUMS
          CODENAME="${CODE_NAME:-}"
          PHOTO="${CODE_PHOTO:-}"
          gh api "repos/${REPO}" --jq '"Token can push: " + (.permissions.push|tostring)' || true
          {
            if [ -n "$CODENAME" ]; then echo "Code name: ${CODENAME} (photo: ${PHOTO})"; else echo "No dim sum code name could be resolved from the public catalog for this build; it ships with its version alone."; fi
            echo
            echo "Home Assistant Material Deploy Assistant ${VERSION}: deploy Home Assistant Material in one click to Docker on this computer, an SSH host, VirtualBox or VMware, or write a Raspberry Pi card; manage every instance and its backups."
            echo
            echo "- Windows: HAM-Deploy-Assistant-Setup.exe (Squirrel; it updates itself from RELEASES and the .nupkg)."
            echo "- Linux: the .deb, or the Linux .zip."
            echo "- macOS: the macOS .zip."
            echo
            echo "Nothing here is code-signed. Windows SmartScreen and macOS Gatekeeper warn on first start; check the files against SHA256SUMS."
            echo
            echo "Commit ${GITHUB_SHA}."
          } > ../notes.md
          gh release create "$TAG" --repo "$REPO" --title "Deploy Assistant ${VERSION}" --notes-file ../notes.md --latest=false --target "$GITHUB_SHA" ./*
      - name: Rebuild the project page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
